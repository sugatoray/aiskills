  - id: part15
    kind: standard
    nav_label: "The Big Picture"
    icon: horizon
    number: "15"
    eyebrow: "Part 15"
    title: "The Big Picture"
    lede: "The AI landscape in five minutes, three things to watch next week, and the full scope note."
    items:
      - title: "The AI landscape in five minutes"
        icon: horizon
        badge: orange
        tag: "Synthesis"
        open: true
        body:
          - "The dominant thread this week is <b>vertical consolidation around Nvidia</b>: a $13B acquisition of the open-model ecosystem's central hub, plus a role as long-term tenant in a $50B Texas data-center lease, extend Nvidia's reach well beyond chips into distribution and physical infrastructure. Layered on top, three frontier labs each shipped a cybersecurity-capable model this week under some form of gated access — OpenAI's GPT-6 Astra crossing a 'Critical' capability threshold, Google's Gemini 3.8 Flash Cyber, and Anthropic's trusted-access Mythos 5.1 — suggesting the industry is converging on tiered, vetted access as the default answer to dual-use risk, rather than waiting for regulation to force the issue."
          - "Capital continues flowing toward physical buildout over pure model training: Anthropic alone committed on the order of $60B across three compute suppliers in under two months, ahead of an IPO push that has it pulling clearly ahead of OpenAI's now-2027-leaning timeline. That spending sits against a combined ~$725B big-tech capex figure for 2026 and a live, substantive debate about whether infrastructure investment has outrun the roughly $100B of realized enterprise AI revenue supporting it — a question the market will start pricing in earnest once Anthropic's IPO provides the first real public benchmark for foundation-model economics."
          - "Geopolitically, the pattern from prior weeks holds: policy exists faster than execution. China's chip self-sufficiency keeps climbing (41%+) even as its memory bottleneck persists, while U.S. export clearances for H200/MI325X remain undelivered on the ground months after approval. Meanwhile a new legal front opened against Anthropic — its founders named personally in a copyright suit — adding a category of executive risk that could reshape how every lab's leadership thinks about historical data-sourcing decisions."
      - title: "Three things to watch next week"
        icon: compass
        badge: orange
        tag: "Forward look"
        open: true
        kv:
          - term: "1. Anthropic's S-1"
            desc: "Whether Anthropic publishes its S-1 and confirms the October Nasdaq listing target, giving the market its first real look at frontier-lab financials."
