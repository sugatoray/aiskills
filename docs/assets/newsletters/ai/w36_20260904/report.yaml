      - title: "🇮🇳 India — → Stable"
        icon: globe
        badge: indigo
        tag: "Global power map"
        body:
          - "India's Parliament is scheduled to begin reviewing Digital India Act generative-AI liability clauses on September 21, 2026 — a regulatory process starting, not yet a policy outcome."
      - title: "🇯🇵 Japan — → Stable"
        icon: globe
        badge: indigo
        tag: "Global power map"
        body:
          - "METI is set to release updated AI Guidelines for Business on September 10, introducing watermarking recommendations for media companies, continuing Japan's light-touch, no-monetary-penalty regulatory approach."
      - title: "🇰🇷 South Korea — No material development this week"
        icon: alert
        badge: gray
        tag: "Gap, stated honestly"
        body:
