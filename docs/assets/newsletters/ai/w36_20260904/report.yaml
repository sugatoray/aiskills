        icon: globe
        badge: indigo
        tag: "Global power map"
        body:
          - "Chip self-sufficiency crossing 41% and an aggressive open-weight release cadence (Kimi K3, Qwen3.8, GLM-5.3, DeepSeek V4) both point to sustained domestic-stack momentum, though the unresolved memory (HBM) bottleneck caps how far that goes without a CXMT breakthrough."
      - title: "🇪🇺 European Union / 🇫🇷 France — → Stable"
        icon: globe
        badge: indigo
        tag: "Global power map"
        body:
          - "Mistral's compute-sovereignty coalition (Part 1, #16) is real forward motion, but the EU AI Act's high-risk compliance deadline remains politically contested (a proposed delay to December 2027 is unresolved), leaving the region's regulatory trajectory uncertain even as its infrastructure ambitions advance."
      - title: "🇬🇧 United Kingdom — → Stable"
        icon: globe
        badge: indigo
        tag: "Global power map"
        body:
          - "The UK's AI Regulation and Safety Bill is expected to receive Royal Assent October 15, 2026; Nscale (UK-based) is a supplier on Anthropic's $45B compute deal, giving the UK an infrastructure foothold independent of the regulatory track."
      - title: "🇩🇪 Germany — No material development this week"
        icon: alert
        badge: gray
        tag: "Gap, stated honestly"
        body:
