  - id: part3
    kind: standard
    nav_label: "Open vs. Closed"
    icon: eye
    number: "03"
    eyebrow: "Part 3"
    title: "Open vs. Closed AI"
    lede: "Is the gap between open-weight and closed models widening or narrowing this week?"
    items:
      - title: "This week's read: narrowing on capability and cost, widening on gated-safety tiers"
        icon: eye
        badge: indigo
        tag: "Assessment"
        open: true
        body:
          - "On raw capability and cost, the gap keeps narrowing: Kimi K3 (2.8T params, MIT-adjacent terms), Qwen3.8 (2.4T, with a permissive Apache-licensed distilled variant), GLM-5.3, and a now fully MIT-licensed DeepSeek V4 Pro give enterprises credible, cheap, self-hostable alternatives to frontier closed models for most workloads."
          - "But this week's three flagship closed releases — GPT-6 Astra, Gemini 3.8 Flash Cyber, and Claude Mythos 5.1 — all point to a <b>new axis of separation</b>: gated, safety-tiered access to categories (cybersecurity, life sciences) that closed labs can restrict via API controls and vetting programs, and open-weight releases structurally cannot. A model you can download and run anywhere cannot be access-gated after the fact."
          - "<b>Net read:</b> the general-capability gap is narrowing, but a governance gap is opening in specific dual-use categories — meaning 'open vs. closed' is becoming less a single spectrum and more two separate competitions."
          - "On licensing: 'open weight' still isn't synonymous with 'open source' here — Kimi K3 ships under commercial-use conditions for large-scale MaaS deployments, not an unrestricted license, and Mistral's newly announced coalition (Part 1, #16) is explicitly about compute sovereignty, not licensing liberalization."
        sources:
          - label: "wavect.io — Best Open-Weight LLMs 2026 comparison"
            url: "https://wavect.io/blog/open-weight-llm-comparison-2026/"

