          - "Capital (Nvidia-Hugging Face, $725B combined big-tech capex), a live IPO push (Anthropic), and back-to-back frontier releases (GPT-6 Astra) all point up — but H200/MI325X export-policy enforcement still isn't executing in practice, and a copyright suit now names Anthropic's founders personally. Momentum is real; so is accumulating regulatory and legal friction."
