        badge: indigo
        tag: "Global power map"
        body:
          - "HUMAIN's ~$100B, 2.2GW buildout and Stargate UAE's 1GW target both continue advancing on schedule, backed by among the cheapest energy costs of any region building AI infrastructure today."

