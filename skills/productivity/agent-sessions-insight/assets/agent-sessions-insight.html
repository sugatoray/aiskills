    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --surface: #1b1b1f; --surface-2: #24242a; --border: #303038;
  --text: #ececef; --muted: #a0a0aa; --accent: #8ea6ff; --accent-soft: #26305a;
  --judge: #f5c46b; --judge-soft: #3a2c10; --warn: #ff8a7a;
  --a1: #8ea6ff; --a2: #4fd1aa; --a3: #fb923c; --a4: #b794f6; --a5: #f472b6; --a6: #a3e635;

  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-wrap: anywhere;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
header h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.01em; }

.head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
#theme-toggle { flex: 0 0 auto; font: inherit; font-size: .85rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
#theme-toggle:hover { color: var(--text); }
.caveat { margin: 14px 0 0; padding: 10px 14px; border-left: 3px solid var(--judge); background: var(--judge-soft); border-radius: 4px; font-size: .92rem; max-width: 80ch; }
.caveat[hidden] { display: none; }
.lead { color: var(--muted); margin: 0 0 16px; max-width: 72ch; }
.section-h { font-size: 1.05rem; margin: 4px 0 10px; }
.habits { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; margin-bottom: 16px; }
.habits > .card { margin-bottom: 0; }
.habit p { margin: 0 0 8px; color: var(--muted); font-size: .92rem; }
.ev { font-size: .84rem; color: var(--muted); margin: 0; }
.ev b { color: var(--text); font-weight: 600; }
.stack-chart .cols { display: flex; align-items: flex-end; gap: 6px; height: 170px; border-bottom: 1px solid var(--border); }
.stack-chart .col { flex: 1 1 0; min-width: 6px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.stack-chart .tot { font-size: .72rem; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 2px; }
.stack-chart .seg { border-radius: 2px; margin-top: 1px; outline-offset: 1px; }
.stack-chart .seg:focus-visible { outline: 2px solid var(--accent); }
.stack-chart .labels { display: flex; gap: 6px; font-size: .72rem; color: var(--muted); margin-top: 4px; }
.stack-chart .labels span { flex: 1 1 0; min-width: 6px; text-align: center; overflow: hidden; white-space: nowrap; }
.demo-note { margin: 12px 0 0; padding: 8px 12px; border-radius: 8px; background: var(--judge-soft); color: var(--judge); font-size: .9rem; }
[role="tablist"] {
  display: flex; gap: 4px; margin: 20px 0 16px; padding: 4px; overflow-x: auto;
  background: var(--surface-2); border-radius: 10px; scrollbar-width: thin;
}
[role="tab"] {
  flex: 0 0 auto; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .92rem;
  padding: 7px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap;
}
[role="tab"]:hover { color: var(--text); }
[role="tab"][aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
[role="tab"]:focus-visible, .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[role="tab"][hidden] { display: none; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card h2 { font-size: 1.05rem; margin: 0 0 4px; }
.card h3 { font-size: .98rem; margin: 0 0 6px; }
.sub { color: var(--muted); font-size: .88rem; margin: 0 0 12px; }
.badge { display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; vertical-align: middle; margin-left: 6px; }
.badge.exact { background: var(--accent-soft); color: var(--accent); }
.badge.judge { background: var(--judge-soft); color: var(--judge); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
.stat .v { font-size: 1.7rem; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: .85rem; }
.prose p { margin: 0 0 8px; }
.prose p:last-child { margin-bottom: 0; }
.empty { color: var(--muted); font-style: italic; margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.grid2 > .card { margin-bottom: 0; }
.chart .bars { display: flex; align-items: flex-end; gap: 3px; height: 150px; border-bottom: 1px solid var(--border); padding-top: 6px; }
.chart .bar { flex: 1 1 0; min-width: 3px; background: var(--accent); border-radius: 3px 3px 0 0; opacity: .9; cursor: default; }
.chart .bar:hover, .chart .bar:focus { opacity: 1; filter: brightness(1.1); }
.chart .bar.zero { background: var(--border); }
.chart .axis { display: flex; gap: 3px; font-size: .72rem; color: var(--muted); margin-top: 4px; }
.chart .axis span { flex: 1 1 0; min-width: 3px; text-align: center; overflow: hidden; white-space: nowrap; }
.hbars { display: grid; grid-template-columns: minmax(80px, 34%) 1fr auto; gap: 6px 10px; align-items: center; font-size: .9rem; }
.hbars .track { background: var(--surface-2); border-radius: 4px; height: 12px; overflow: hidden; }
.hbars .fill { height: 100%; background: var(--accent); border-radius: 4px; }
.hbars .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.timeline { position: relative; height: 180px; border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 10px 0 4px 44px; }
.timeline .dot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; opacity: .85; }
.timeline .ylab { position: absolute; left: -44px; width: 38px; white-space: nowrap; text-align: right; font-size: .7rem; color: var(--muted); transform: translateY(-50%); }
.tl-x { display: flex; justify-content: space-between; margin-left: 44px; font-size: .72rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .85rem; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: normal; }
#sessions-table { min-width: 760px; }
#sessions-table td:nth-child(6) { min-width: 220px; }
#sessions-table td:first-child { white-space: nowrap; }
th { color: var(--muted); font-weight: 600; white-space: nowrap; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
code { font: .85em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.kind { border-left: 3px solid var(--judge); padding-left: 12px; margin-bottom: 14px; }
.kind:last-child { margin-bottom: 0; }
.kind .meta { color: var(--muted); font-size: .86rem; }
.kind ul, .friction ul { margin: 6px 0 0; padding-left: 18px; }
.friction li { margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface-2); border-radius: 999px; padding: 2px 10px; font-size: .85rem; }
input[type="search"] { width: 100%; max-width: 360px; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); margin-bottom: 10px; }
#tooltip { position: fixed; z-index: 10; pointer-events: none; background: var(--text); color: var(--bg); font-size: .82rem; padding: 5px 8px; border-radius: 6px; max-width: 260px; }
#tooltip[hidden] { display: none; }
.foot { color: var(--muted); font-size: .82rem; margin-top: 24px; }
@media (prefers-reduced-motion: no-preference) {

@media (max-width: 520px) { header h1 { font-size: 1.35rem; } .stat .v { font-size: 1.4rem; } .card { padding: 14px; } }

    t.appendChild((S.tools || []).length ? hbars(S.tools, "call") : empty("No tool calls recorded."));
    g.appendChild(t);
    var cm = card("Slash commands", "exact");
    cm.appendChild((S.commands || []).length ? hbars(S.commands, "use") : empty("No slash commands recorded."));
    g.appendChild(cm);
    var ts = card("Tests", "exact");
    ts.appendChild(el("p", { cls: "prose", text: plural(S.test_runs, "test run") + " in " + plural(S.sessions, "session") +
      " (" + fmt(S.sessions ? S.test_runs / S.sessions : 0) + " per session)." }));
    g.appendChild(ts);
    var de = card("Doc-file edits", "exact", "Edits to CLAUDE.md, AGENTS.md, README.md and similar.");
    var docs = Object.keys(S.doc_edits || {}).map(function (k) { return [k, S.doc_edits[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
    de.appendChild(docs.length ? hbars(docs, "edit") : empty("No doc-file edits recorded."));
    g.appendChild(de);
    p.appendChild(g);
  };
  P.friction = function (p) {
    lead(p, "Snags that recur, work that looks unfinished, and the longest sessions. Treat each as a lead, not a verdict.");
    var c = card("Possible friction", "judge", "Patterns worth a look. Each is a possibility, not a conclusion.");
    var fr = INS.friction || [];
    if (!fr.length) c.appendChild(empty("No reading of friction was added."));
    else {
      var ul = el("ul", { cls: "friction" });
      fr.forEach(function (f) { ul.appendChild(el("li", null, el("strong", { text: f.title }), " ", el("span", { text: f.detail }), seen(f.evidence))); });
      c.appendChild(ul);
    }
    p.appendChild(c);
    var th = card("Open threads", "judge", "Work that looked unfinished at its last session, and the next step.");
    var threads = INS.threads || [];
    if (!threads.length) th.appendChild(empty("No open threads were noted."));
    else {
      var tt = el("table", { id: "threads" }), tb = el("tbody");
      tt.appendChild(el("thead", null, el("tr", null, el("th", { text: "Thread" }), el("th", { text: "Next step" }))));
      threads.forEach(function (x) {
        tb.appendChild(el("tr", null, el("td", null, el("div", { text: x.thread }), x.when ? el("div", { cls: "ev", text: x.when }) : null), el("td", { text: x.next })));
      });
      tt.appendChild(tb);
      th.appendChild(el("div", { cls: "scroll" }, tt));
    }
    p.appendChild(th);
    var longest = ROWS.slice().sort(function (a, b) { return b.minutes - a.minutes; }).slice(0, 5);
    var c2 = card("Longest sessions", "exact", "First to last event, so a session left open reads long.");
    c2.appendChild(longest.length ? table(["Start", "Agent", "Project", "Minutes", "Prompts"],
      longest.map(function (r) { return [when(r.start), r.agent, r.project, fmt(r.minutes), r.prompts]; }), [false, false, false, true, true]) : empty("No sessions."));
    p.appendChild(c2);
  };
  P.agents = function (p) {
    lead(p, "How the sessions split between agents, and how each one is used.");
    var c = card("Sessions per agent", "exact");
    c.appendChild(hbars(agentNames.map(function (a) { return [a, S.per_agent[a]]; }), "session", agentColor));
    var rows = agentNames.map(function (a) {
      var mine = ROWS.filter(function (r) { return r.agent === a; });
      var days = {}; mine.forEach(function (r) { days[new Date(r.start).toDateString()] = 1; });
      var mins = mine.map(function (r) { return r.minutes; }).sort(function (x, y) { return x - y; });
      var med = mins.length ? (mins.length % 2 ? mins[(mins.length - 1) / 2] : (mins[mins.length / 2 - 1] + mins[mins.length / 2]) / 2) : 0;
      return [a, S.per_agent[a], Object.keys(days).length, fmt(med), mine.reduce(function (s, r) { return s + (r.prompts || 0); }, 0)];
    });
    c.appendChild(el("div", { style: "margin-top:14px" }, table(["Agent", "Sessions", "Active days", "Median minutes", "Prompts"], rows, [false, true, true, true, true])));
    p.appendChild(c);
    var c2 = card("How the work is split", "judge");
    c2.appendChild(notes(INS.agents, "No reading was added."));
    p.appendChild(c2);
  };
  P.numbers = function (p) {
    lead(p, "Every figure the collector counted, unchanged. Check any claim in the other tabs against this table.");
    var c = card("Exact numbers", "exact", "Everything the collector counted. Check any claim in the other tabs here.");
    var t = el("table"), tb = el("tbody");
    t.appendChild(el("thead", null, el("tr", null, el("th", { text: "Key" }), el("th", { text: "Value" }))));
    Object.keys(S).forEach(function (k) {
      var v = S[k], s;
      if (Array.isArray(v)) s = v.map(function (x) { return Array.isArray(x) ? x[0] + " (" + x[1] + ")" : String(x); }).join(", ");
      else if (v && typeof v === "object") s = Object.keys(v).map(function (x) { return x + ": " + v[x]; }).join(", ");
      else s = typeof v === "number" ? fmt(v) : String(v);
      tb.appendChild(el("tr", null, el("td", null, el("code", { "data-key": k, text: k })), el("td", { text: s || "—" })));
    });
    t.appendChild(tb);
    c.appendChild(el("div", { cls: "scroll" }, t));
    p.appendChild(c);
  };
  P.data = function (p) {
    lead(p, "One row per session in the window, and how the data was collected.");
    var c = card("Sessions", "exact", "One row per session in the window. Prompts are cut to 160 characters.");
    var input = el("input", { type: "search", id: "filter", placeholder: "Filter by agent, project or prompt", "aria-label": "Filter sessions" });
    c.appendChild(input);
    var t = el("table", { id: "sessions-table" }), tb = el("tbody");
    var head = el("tr");
    ["Start", "Agent", "Project", "Minutes", "Prompts", "First prompt", "Top tools"].forEach(function (h) { head.appendChild(el("th", { text: h })); });
    t.appendChild(el("thead", null, head));
    var rows = ROWS.slice().sort(function (a, b) { return a.start < b.start ? 1 : -1; }).map(function (r) {
      var tools = (r.top_tools || []).map(function (x) { return x[0] + " " + x[1]; }).join(", ");
      var tr = el("tr", null, el("td", { text: when(r.start) }), el("td", { text: r.agent }), el("td", { text: r.project || "" }),
        el("td", { cls: "num", text: fmt(r.minutes) }), el("td", { cls: "num", text: r.prompts }), el("td", { text: r.first_prompt || "" }), el("td", { text: tools }));
      tr.dataset.search = [r.agent, r.project, r.first_prompt, tools, r.id].join(" ").toLowerCase();
      tb.appendChild(tr);
      return tr;
    });
    t.appendChild(tb);
    c.appendChild(el("div", { cls: "scroll" }, t));
    var count = el("p", { cls: "sub", style: "margin-top:8px" });
    function apply() {
      var q = input.value.trim().toLowerCase(), n = 0;
      rows.forEach(function (tr) { var show = !q || tr.dataset.search.indexOf(q) >= 0; tr.hidden = !show; if (show) n++; });
      count.textContent = n + " of " + rows.length + " sessions";
    }
    input.addEventListener("input", apply); apply();
    c.appendChild(count);
    p.appendChild(c);
    var m = card("How this was collected", "exact");
    m.appendChild(table(["", ""], [["Generated", when(META.generated)], ["Window", plural(S.window_days, "day")],
      ["Agents with sessions", (META.agents || agentNames).join(", ") || "none"], ["First session", when(S.first)], ["Last activity", when(S.last)],
      ["Collector", "scripts/collect.py (read-only, offline)"]]));
    p.appendChild(m);
  };

  // ---------- tabs and routing ----------
  var tabsEl = document.getElementById("tabs"), panelsEl = document.getElementById("panels"), built = {};
  var tabs = TABS.map(function (t) {
    var b = el("button", { role: "tab", type: "button", id: "tab-" + t[0], "data-tab": t[0], "aria-controls": "panel-" + t[0], "aria-selected": "false", tabindex: "-1", text: t[1] });
    if (t[0] === "agents" && agentNames.length < 2) b.hidden = true;
    var panel = el("section", { role: "tabpanel", id: "panel-" + t[0], "aria-labelledby": "tab-" + t[0], tabindex: "0" });
    panel.hidden = true;
    tabsEl.appendChild(b); panelsEl.appendChild(panel);
    b.addEventListener("click", function () { go(t[0], true); });
    b.addEventListener("keydown", function (e) {
      var vis = tabs.filter(function (x) { return !x.hidden; }), i = vis.indexOf(b), j = null;
      if (e.key === "ArrowRight") j = (i + 1) % vis.length;
      else if (e.key === "ArrowLeft") j = (i - 1 + vis.length) % vis.length;
      else if (e.key === "Home") j = 0;
      else if (e.key === "End") j = vis.length - 1;
      if (j === null) return;
      e.preventDefault();
      go(vis[j].getAttribute("data-tab"), true);
      vis[j].focus();
    });
    return b;
  });
  function go(name, push) {
    var b = document.getElementById("tab-" + name);
    if (!b || b.hidden) name = "overview";
    tabs.forEach(function (t) {
      var on = t.getAttribute("data-tab") === name;
      t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1;
      document.getElementById("panel-" + t.getAttribute("data-tab")).hidden = !on;
    });
    if (!built[name]) { built[name] = true; P[name](document.getElementById("panel-" + name)); }
    hideTip();
    if (push && location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  }
  window.addEventListener("hashchange", function () { go(location.hash.slice(1), false); });

  // ---------- header ----------
  document.getElementById("subtitle").textContent = plural(S.sessions || 0, "session") + " over the last " + plural(S.window_days || 0, "day") +
    (agentNames.length ? " · " + agentNames.join(", ") : "") + (META.generated ? " · generated " + day(META.generated) : "");
  document.getElementById("demo-note").hidden = !META.demo;
  if (INS.caveat) { document.getElementById("caveat-text").textContent = INS.caveat; document.getElementById("caveat").hidden = false; }
  var THEMES = ["", "light", "dark"], themeBtn = document.getElementById("theme-toggle");
  function setTheme(v, save) {
    if (v) document.documentElement.setAttribute("data-theme", v); else document.documentElement.removeAttribute("data-theme");
    themeBtn.textContent = "Theme: " + (v ? v.charAt(0).toUpperCase() + v.slice(1) : "Auto");
    if (save) { try { localStorage.setItem("agentSessionsInsightTheme", v); } catch (e) { /* storage blocked: still works for this view */ } }
  }
  var savedTheme = ""; try { savedTheme = localStorage.getItem("agentSessionsInsightTheme") || ""; } catch (e) { savedTheme = ""; }
  setTheme(THEMES.indexOf(savedTheme) >= 0 ? savedTheme : "", false);
  themeBtn.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme") || "";
    setTheme(THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length], true);
  });
  document.getElementById("foot").textContent = "Made by agent-sessions-insight from the session logs on this machine. Nothing in this page was sent anywhere.";
  go(location.hash.slice(1) || "overview", false);
})();
</script>
</body>
</html>
