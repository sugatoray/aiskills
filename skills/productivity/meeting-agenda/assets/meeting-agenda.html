<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Agenda</title>
<style>
  :root {
    --bg-1: #2a2386; --bg-2: #1d1a68; --bg-3: #2b2280;
    --ink: #f5f3ff; --muted: #c4c0f0; --faint: rgba(255,255,255,.12);
    --teal: #2dd4bf; --cyan: #22d3ee; --indigo: #6d4cff; --violet: #8b5cf6;
    --amber: #f59e0b; --red: #ef4444;
    --panel: rgba(24, 20, 78, .95);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: #2a2386;
    background:
      radial-gradient(ellipse at top left, rgba(124, 92, 255, .55) 0%, transparent 55%),   /* violet glow */
      radial-gradient(ellipse at bottom right, rgba(110, 80, 230, .35) 0%, transparent 60%),
      linear-gradient(135deg, #2a2386 0%, #1d1a68 55%, #2b2280 100%);                     /* indigo base */
    color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .35; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  /* header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px clamp(16px, 3vw, 40px) 0; }
  #meeting-title { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); overflow-wrap: anywhere; }
  #btn-edit { background: transparent; border: 0; border-radius: 50%; width: 42px; height: 42px; display: grid; place-items: center; flex: none; opacity: .85; }
  #btn-edit:hover { opacity: 1; background-color: rgba(255,255,255,.08); }
  #btn-edit svg { width: 24px; height: 24px; }

  /* stage */
  main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(16px, 4vw, 56px); padding: clamp(12px, 3vh, 32px) clamp(16px, 5vw, 72px); overflow: hidden; }
  #deck { min-height: 0; height: 100%; }
  .slide { display: none; height: 100%; overflow-y: auto; flex-direction: column; justify-content: center; min-width: 0; }
  .slide.active { display: flex; animation: enter .35s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .eyebrow { margin-bottom: .6em; font-size: clamp(12px, 1.9vh, 17px); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--teal); }
  .num {
    font-size: clamp(56px, 13vh, 140px); font-weight: 900; line-height: .9; letter-spacing: -.02em;
    background: linear-gradient(160deg, var(--violet), var(--indigo) 70%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(109, 76, 255, .35));
  }
  .title { margin: .35em 0 .4em; font-size: clamp(28px, 6vh, 64px); line-height: 1.1; font-weight: 800; overflow-wrap: anywhere; text-shadow: 0 2px 14px rgba(10, 6, 40, .35); }
  .points { margin: 0; padding-left: 1.2em; font-size: clamp(17px, 2.8vh, 28px); color: #ddd6fe; overflow-wrap: anywhere; }
  .points li { margin: .3em 0; }
  .points li::marker { color: var(--teal); }

  /* timer */
  #timer-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #timer { position: relative; width: clamp(150px, 34vh, 280px); aspect-ratio: 1; }
  #timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  #ring-track { fill: none; stroke: rgba(255,255,255,.08); stroke-width: 14; }
  #ring-progress { fill: none; stroke: url(#ring-grad); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .25s linear; filter: drop-shadow(0 0 10px rgba(34, 211, 238, .25)); }
  #timer.warn #ring-progress { stroke: var(--amber); }
  #timer.over #ring-progress { stroke: var(--red); }
  #timer.over { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(239,68,68,0)); } 50% { transform: scale(1.04); filter: drop-shadow(0 0 18px rgba(239,68,68,.7)); } }
  #timer-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  #timer-text { font-size: clamp(30px, 7vh, 60px); font-weight: 700; font-variant-numeric: tabular-nums; }
  #timer.warn #timer-text { color: #fcd34d; }
  #timer.over #timer-text { color: #fca5a5; }
  #timer-sub { font-size: clamp(12px, 1.9vh, 16px); font-weight: 600; color: var(--muted); }
  #timer.paused #timer-text { opacity: .55; }
  .controls { display: flex; gap: 8px; }
  .controls button { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 7px 16px; font-weight: 600; }
  .controls button::before { display: inline-block; margin-right: .45em; text-align: center; }
  #btn-pause::before { content: "\275A\275A"; letter-spacing: -.12em; font-size: .7em; }
  #btn-pause[data-state="paused"]::before { content: "\25B6\FE0E"; }
  #btn-reset::before { content: "\21BA"; }
  .ed-actions button, .row button {
    background: var(--faint); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 6px 14px;
  }
  .controls button:hover, .ed-actions button:hover:not(:disabled), .row button:hover:not(:disabled) { background: rgba(255,255,255,.22); }

  /* footer */
  footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding: 10px clamp(16px, 3vw, 40px) 16px; background: transparent; font-size: 13px; }
  #hints { color: var(--ink); font-weight: 600; }
  #hints kbd { font: 600 12px/1 system-ui, sans-serif; border: 0; border-radius: 4px; padding: 3px 6px; background: rgba(255,255,255,.08); color: var(--ink); }
  #hints .sep { color: var(--muted); margin: 0 .3em; }
  #dots { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; flex: 1 1 160px; }
  /* one dash per item; it fills with the time spent on that item */
  .dot { width: 24px; height: 6px; padding: 0; border: 0; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; display: block; }
  .dot-fill { display: block; height: 100%; width: 0; background: var(--cyan); }
  .dot.over .dot-fill { background: var(--red); }
  .dot[aria-current="step"] { width: 34px; background: rgba(109, 76, 255, .55); box-shadow: 0 0 10px rgba(109, 76, 255, .6); }
  #meeting { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #meeting-text { font-variant-numeric: tabular-nums; white-space: nowrap; }
  #meeting-bar { position: relative; width: clamp(140px, 20vw, 280px); height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
  /* one segment per item, sized by its planned minutes; each fills with the time spent on that item */
  #meeting-bar .seg { position: absolute; top: 0; bottom: 0; overflow: hidden; }
  #meeting-bar .seg.current { background: rgba(255,255,255,.14); }
  #meeting-bar .seg-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--indigo), var(--cyan)); transition: width .25s linear; }
  #meeting-bar.warn .seg-fill { background: var(--amber); }
  #meeting-bar.over .seg-fill, #meeting-bar .seg.over .seg-fill { background: var(--red); }
  #meeting-bar .tick { position: absolute; z-index: 1; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(20,16,70,.9); }

  /* editor */
  #editor { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(5,2,15,.6); backdrop-filter: blur(4px); }
  #editor[hidden] { display: none; }
  .ed-panel { width: min(920px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .ed-head { padding: 16px 20px 6px; }
  .ed-head h2 { margin: 0; font-size: 20px; }
  .ed-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  #ed-rows { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 20px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; grid-template-columns: 34px 92px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); }
  .row.invalid { border-color: var(--red); background: rgba(239,68,68,.12); }
  .row-num { font-weight: 800; color: var(--teal); padding-top: 8px; }
  .row label { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .row input, .row textarea { width: 100%; font: inherit; color: var(--ink); background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.18); border-radius: 6px; padding: 6px 8px; }
  .row textarea { resize: vertical; min-height: 58px; margin-top: 8px; }
  .row-btns { display: flex; gap: 4px; padding-top: 18px; }
  .row-btns button { padding: 4px 9px; }
  .btn-remove:hover:not(:disabled) { background: rgba(239,68,68,.35) !important; }
  #ed-error { margin: 0 20px; color: #fca5a5; font-size: 13px; }
  .ed-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid rgba(255,255,255,.1); }
  .ed-actions .spacer { flex: 1; }
  #ed-apply { background: var(--teal); color: #052e2b; border-color: var(--teal); font-weight: 700; }

  @media (max-width: 720px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    #timer { width: clamp(120px, 22vh, 180px); }
    #timer-wrap { flex-direction: row; }
    .controls { flex-direction: column; }
    .row { grid-template-columns: 26px 70px minmax(0, 1fr); }
    .row-btns { grid-column: 1 / -1; padding-top: 0; justify-content: flex-end; }
  }
</style>
</head>
<body>
<header>
  <h1 id="meeting-title"></h1>
  <button id="btn-edit" type="button" aria-label="Edit agenda" title="Edit agenda">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main>
  <div id="deck" aria-live="polite"></div>
  <div id="timer-wrap">
    <div id="timer" role="timer" aria-label="Item timer">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <!-- the svg is rotated -90deg, so (1,1) is the top-right: cyan there, violet bottom-left -->
          <linearGradient id="ring-grad" x1="1" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#22d3ee"/>
            <stop offset="1" stop-color="#6d4cff"/>
          </linearGradient>
        </defs>
        <circle id="ring-track" cx="100" cy="100" r="90"/>
        <circle id="ring-progress" cx="100" cy="100" r="90" stroke-dasharray="565.487" stroke-dashoffset="0"/>
      </svg>
      <div id="timer-center"><div id="timer-text">0:00</div><div id="timer-sub">remaining</div></div>
    </div>
    <div class="controls">
      <button id="btn-pause" type="button">Pause</button>
      <button id="btn-reset" type="button">Reset</button>
    </div>
  </div>
</main>

<footer>
  <div id="hints" title="Also: PgUp/PgDn, Shift+Space back, Home/End"><kbd>←</kbd> <kbd>→</kbd> <kbd>Space</kbd> navigate<span class="sep">·</span><kbd>P</kbd> pause/resume<span class="sep">·</span><kbd>R</kbd> reset timer</div>
  <nav id="dots" aria-label="Agenda items"></nav>
  <div id="meeting">
    <div id="meeting-bar" role="progressbar" aria-label="Meeting time used"></div>
    <span id="meeting-text"></span>
  </div>
</footer>

<div id="editor" role="dialog" aria-modal="true" aria-labelledby="ed-heading" hidden>
  <div class="ed-panel">
    <div class="ed-head">
      <h2 id="ed-heading">Edit agenda</h2>
      <p>One row per item. Minutes in 0.5 steps; sub-points one per line.</p>
    </div>
    <div id="ed-rows"></div>
    <p id="ed-error" hidden>Every item needs a title and minutes greater than 0. Fix the highlighted rows.</p>
    <div class="ed-actions">
      <button id="ed-add" type="button">+ Add item</button>
      <button id="ed-reset" type="button">Reset to file defaults</button>
      <span class="spacer"></span>
      <button id="ed-cancel" type="button">Cancel</button>
      <button id="ed-save" type="button">Save HTML</button>
      <button id="ed-apply" type="button">Apply</button>
    </div>
  </div>
</div>

<script type="application/json" id="agenda-data">
{
  "title": "Team Planning Meeting",
  "items": [
    { "minutes": 10, "title": "Priorities for 2026 & 2027",
      "points": ["What are the priorities for 2026?", "What are the priorities for 2027?"] },
    { "minutes": 8, "title": "Identify trainings for 2027",
      "points": ["Skill gaps vs. priorities", "Candidate courses & certifications", "Who attends, and when"] },
    { "minutes": 5, "title": "Resourcing & budget",
      "points": ["Headcount needs", "Training budget estimate"] },
    { "minutes": 3, "title": "Risks & blockers",
      "points": ["Top risks to the plan", "Dependencies on other teams"] },
    { "minutes": 4, "title": "Decisions, owners & next steps",
      "points": ["Confirm decisions", "Assign owners & dates", "Schedule follow-up"] }
  ]
}
</script>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "meetingAgenda";
  var RING_C = 2 * Math.PI * 90;
  var WARN_FRACTION = 0.2;

  // Pristine copy of the page, taken before anything is rendered, used by "Save HTML".
  var PRISTINE = document.documentElement.cloneNode(true);

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;   // user text is only ever set as textContent
    return n;
  }

  // ---------- data ----------
  function normalize(raw) {
    var data = Array.isArray(raw) ? { items: raw } : raw;
    if (!data || !Array.isArray(data.items) || data.items.length === 0) return null;
    var items = [];
    for (var i = 0; i < data.items.length; i++) {
      var it = data.items[i] || {};
      var minutes = Number(it.minutes);
      var title = typeof it.title === "string" ? it.title.trim() : "";
      if (!(minutes > 0) || !isFinite(minutes) || !title) return null;
      var points = Array.isArray(it.points) ? it.points.filter(function (p) { return typeof p === "string" && p.trim(); }).map(function (p) { return p.trim(); }) : [];
      items.push({ minutes: minutes, title: title, points: points });
    }
    return { title: typeof data.title === "string" ? data.title : "", items: items };
  }

  var FILE_DEFAULTS = normalize(JSON.parse($("#agenda-data").textContent)) || { title: "", items: [{ minutes: 5, title: "Agenda item", points: [] }] };

  function loadAgenda() {
    try {
      var s = localStorage.getItem(STORAGE_KEY);
      if (s) { var d = normalize(JSON.parse(s)); if (d) return d; }
    } catch (e) { /* storage blocked or corrupt: fall back */ }
    return clone(FILE_DEFAULTS);
  }
  function saveAgenda(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) {} }
  function clearAgenda() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }
  function clone(d) { return JSON.parse(JSON.stringify(d)); }

  // ---------- state ----------
  var agenda = loadAgenda();
  var current = 0;
  var elapsed = [];          // ms used per slide (excluding the running segment)
  var runningSince = null;   // Date.now() when the current slide's timer last started, or null if paused
  var editorOpen = false;
  var resumeAfterEditor = false;

  function now() { return Date.now(); }
  function plannedMs(i) { return agenda.items[i].minutes * 60000; }
  function usedMs(i) { return elapsed[i] + (i === current && runningSince != null ? now() - runningSince : 0); }
  function totalPlannedMs() { return agenda.items.reduce(function (s, it) { return s + it.minutes * 60000; }, 0); }
  function totalUsedMs() { var s = 0; for (var i = 0; i < agenda.items.length; i++) s += usedMs(i); return s; }

  function fmt(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }

  function start() { if (runningSince == null) runningSince = now(); }
  function stop() { if (runningSince != null) { elapsed[current] += now() - runningSince; runningSince = null; } }

  // ---------- build ----------
  function build() {
    var deck = $("#deck"), dots = $("#dots"), bar = $("#meeting-bar");
    deck.textContent = ""; dots.textContent = "";
    bar.textContent = "";
    $("#meeting-title").textContent = agenda.title || "";
    document.title = agenda.title || "Meeting Agenda";

    var total = totalPlannedMs(), acc = 0;
    agenda.items.forEach(function (it, i) {
      var s = el("section", "slide");
      s.setAttribute("aria-label", "Item " + (i + 1));
      s.appendChild(el("div", "eyebrow", "Agenda item " + (i + 1) + " of " + agenda.items.length + " · " + it.minutes + " min"));
      s.appendChild(el("div", "num", String(i + 1).padStart(2, "0")));
      s.appendChild(el("h2", "title", it.title));
      if (it.points.length) {
        var ul = el("ul", "points");
        it.points.forEach(function (p) { ul.appendChild(el("li", null, p)); });
        s.appendChild(ul);
      }
      deck.appendChild(s);

      var d = el("button", "dot");
      d.type = "button";
      d.appendChild(el("span", "dot-fill"));
      d.setAttribute("aria-label", "Go to item " + (i + 1) + ": " + it.title);
      d.title = (i + 1) + ". " + it.title;
      d.addEventListener("click", function () { go(i); d.blur(); });
      dots.appendChild(d);

      var seg = el("div", "seg");
      seg.style.left = (acc * 100 / total) + "%";
      seg.style.width = (it.minutes * 60000 * 100 / total) + "%";
      seg.title = (i + 1) + ". " + it.title;
      seg.appendChild(el("div", "seg-fill"));
      bar.appendChild(seg);

      acc += it.minutes * 60000;
      if (i < agenda.items.length - 1) {
        var t = el("div", "tick");
        t.setAttribute("style", "left:" + (acc * 100 / total) + "%");
        bar.appendChild(t);
      }
    });
    elapsed = agenda.items.map(function () { return 0; });
    runningSince = null;
  }

  function go(i) {
    i = Math.max(0, Math.min(agenda.items.length - 1, i));
    if (i === current) return;
    stop();
    current = i;
    start();
    render();
  }

  // ---------- render ----------
  function render() {
    var slides = document.querySelectorAll(".slide"), dots = document.querySelectorAll(".dot");
    for (var i = 0; i < slides.length; i++) {
      slides[i].classList.toggle("active", i === current);
      if (i === current) dots[i].setAttribute("aria-current", "step"); else dots[i].removeAttribute("aria-current");
      dots[i].classList.toggle("done", i < current);
      var du = usedMs(i), dp = plannedMs(i);
      dots[i].classList.toggle("over", du > dp);
      dots[i].firstChild.style.width = +Math.min(100, du * 100 / dp).toFixed(2) + "%";
    }

    var planned = plannedMs(current), used = usedMs(current);
    var over = used > planned;
    var remaining = planned - used;
    var timer = $("#timer");
    timer.classList.toggle("over", over);
    timer.classList.toggle("warn", !over && remaining <= planned * WARN_FRACTION);
    timer.classList.toggle("paused", runningSince == null);
    $("#timer-text").textContent = over ? "+" + fmt(Math.floor((used - planned) / 1000)) : fmt(Math.ceil(remaining / 1000));
    var allotted = fmt(Math.round(planned / 1000)) + " allotted";
    $("#timer-sub").textContent = over ? "over " + allotted : (runningSince == null ? "paused · of " : "of ") + allotted;
    $("#ring-progress").setAttribute("stroke-dashoffset", String(over ? 0 : RING_C * Math.min(1, used / planned)));
    $("#btn-pause").textContent = runningSince == null ? "Resume" : "Pause";
    $("#btn-pause").setAttribute("data-state", runningSince == null ? "paused" : "running");

    var tp = totalPlannedMs(), tu = totalUsedMs();
    $("#meeting-text").textContent = "Meeting: " + fmt(Math.floor(tu / 1000)) + " used / " + fmt(Math.round(tp / 1000)) + " planned";
    var bar = $("#meeting-bar"), pct = tu * 100 / tp;
    bar.classList.toggle("over", tu > tp);
    bar.classList.toggle("warn", tu <= tp && pct >= 80);
    bar.title = Math.round(pct) + "% used";
    bar.setAttribute("aria-valuenow", String(Math.round(pct)));
    bar.querySelectorAll(".seg").forEach(function (seg, i) {
      var u = usedMs(i), p = plannedMs(i);
      seg.classList.toggle("current", i === current);
      seg.classList.toggle("over", u > p);
      seg.firstChild.style.width = +Math.min(100, u * 100 / p).toFixed(2) + "%";
    });
  }

  // ---------- timer controls ----------
  function togglePause() { if (runningSince == null) start(); else stop(); render(); }
  function resetTimer() { var running = runningSince != null; runningSince = null; elapsed[current] = 0; if (running) start(); render(); }

  $("#btn-pause").addEventListener("click", function (e) { togglePause(); e.currentTarget.blur(); });
  $("#btn-reset").addEventListener("click", function (e) { resetTimer(); e.currentTarget.blur(); });

  // ---------- keyboard ----------
  document.addEventListener("keydown", function (e) {
    if (editorOpen) {
      if (e.key === "Escape") { e.preventDefault(); closeEditor(); }
      return;   // never change slides or timers while editing
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key, handled = true;
    if (k === "ArrowRight" || k === "PageDown" || (k === " " && !e.shiftKey)) go(current + 1);
    else if (k === "ArrowLeft" || k === "PageUp" || (k === " " && e.shiftKey)) go(current - 1);
    else if (k === "Home") go(0);
    else if (k === "End") go(agenda.items.length - 1);
    else if (k === "p" || k === "P") togglePause();
    else if (k === "r" || k === "R") resetTimer();
    else handled = false;
    if (handled) e.preventDefault();
  });

  // ---------- editor ----------
  var showErrors = false;

  function rowEls() { return Array.prototype.slice.call(document.querySelectorAll("#ed-rows .row")); }

  function readRows() {
    return rowEls().map(function (r) {
      return {
        minutesRaw: $(".f-min", r).value,
        title: $(".f-title", r).value,
        pointsRaw: $(".f-points", r).value
      };
    });
  }

  function rowFromItem(it) {
    return { minutesRaw: String(it.minutes), title: it.title, pointsRaw: it.points.join("\n") };
  }

  function renderRows(rows) {
    var host = $("#ed-rows");
    host.textContent = "";
    rows.forEach(function (r, i) {
      var row = el("div", "row");
      row.appendChild(el("div", "row-num", String(i + 1).padStart(2, "0")));

      var mWrap = el("div");
      var mLab = el("label", null, "Minutes");
      var m = el("input", "f-min");
      m.type = "number"; m.step = "0.5"; m.min = "0.5"; m.value = r.minutesRaw; m.id = "f-min-" + i;
      mLab.htmlFor = m.id;
      mWrap.appendChild(mLab); mWrap.appendChild(m);
      row.appendChild(mWrap);

      var tWrap = el("div");
      var tLab = el("label", null, "Title");
      var t = el("input", "f-title");
      t.type = "text"; t.value = r.title; t.id = "f-title-" + i;
      tLab.htmlFor = t.id;
      var p = el("textarea", "f-points");
      p.value = r.pointsRaw; p.placeholder = "Sub-points, one per line (optional)";
      p.setAttribute("aria-label", "Sub-points for item " + (i + 1));
      tWrap.appendChild(tLab); tWrap.appendChild(t); tWrap.appendChild(p);
      row.appendChild(tWrap);

      var b = el("div", "row-btns");
      [["btn-up", "↑", "Move up", i === 0, -1], ["btn-down", "↓", "Move down", i === rows.length - 1, 1]].forEach(function (cfg) {
        var btn = el("button", cfg[0], cfg[1]);
        btn.type = "button"; btn.title = cfg[2]; btn.setAttribute("aria-label", cfg[2] + " item " + (i + 1)); btn.disabled = cfg[3];
        btn.addEventListener("click", function () { move(i, cfg[4]); });
        b.appendChild(btn);
      });
      var rm = el("button", "btn-remove", "✕");
      rm.type = "button"; rm.title = "Remove item"; rm.setAttribute("aria-label", "Remove item " + (i + 1));
      rm.disabled = rows.length === 1;
      rm.addEventListener("click", function () { remove(i); });
      b.appendChild(rm);
      row.appendChild(b);

      row.addEventListener("input", function () { if (showErrors) validate(); });
      host.appendChild(row);
    });
    if (showErrors) validate();
  }

  function move(i, dir) {
    var rows = readRows(), j = i + dir;
    if (j < 0 || j >= rows.length) return;
    var tmp = rows[i]; rows[i] = rows[j]; rows[j] = tmp;
    renderRows(rows);
    var btn = $(dir < 0 ? ".btn-up" : ".btn-down", rowEls()[j]);
    if (btn && !btn.disabled) btn.focus();
  }
  function remove(i) {
    var rows = readRows();
    if (rows.length <= 1) return;           // never remove the last row
    rows.splice(i, 1);
    renderRows(rows);
  }

  function validate() {
    var ok = true;
    rowEls().forEach(function (r) {
      var mv = $(".f-min", r).value.trim();
      var m = Number(mv);
      var bad = mv === "" || !isFinite(m) || !(m > 0) || !$(".f-title", r).value.trim();
      r.classList.toggle("invalid", bad);
      if (bad) ok = false;
    });
    $("#ed-error").hidden = ok;
    return ok;
  }

  function collect() {
    return {
      title: agenda.title,
      items: readRows().map(function (r) {
        return {
          minutes: Number(r.minutesRaw),
          title: r.title.trim(),
          points: r.pointsRaw.split("\n").map(function (s) { return s.trim(); }).filter(Boolean)
        };
      })
    };
  }

  function openEditor() {
    if (editorOpen) return;
    editorOpen = true;
    resumeAfterEditor = runningSince != null;
    stop(); render();
    showErrors = false;
    $("#ed-error").hidden = true;
    renderRows(agenda.items.map(rowFromItem));
    $("#editor").hidden = false;
    var first = $("#ed-rows .f-title");
    if (first) first.focus();
  }

  function closeEditor() {
    editorOpen = false;
    $("#editor").hidden = true;
    if (resumeAfterEditor) start();
    render();
    $("#btn-edit").focus();
  }

  function applyAgenda(data, persist) {
    agenda = data;
    if (persist) saveAgenda(agenda); else clearAgenda();
    var keep = current;
    build();
    current = Math.min(keep, agenda.items.length - 1);
    editorOpen = false;
    $("#editor").hidden = true;
    start();
    render();
  }

  $("#btn-edit").addEventListener("click", openEditor);
  $("#ed-cancel").addEventListener("click", closeEditor);
  $("#ed-add").addEventListener("click", function () {
    var rows = readRows();
    rows.push({ minutesRaw: "5", title: "", pointsRaw: "" });
    renderRows(rows);
    var titles = document.querySelectorAll("#ed-rows .f-title");
    titles[titles.length - 1].focus();
  });
  $("#ed-apply").addEventListener("click", function () {
    showErrors = true;
    if (!validate()) return;
    applyAgenda(collect(), true);
  });
  $("#ed-reset").addEventListener("click", function () {
    if (!window.confirm("Reset the agenda to the file defaults? Your saved changes in this browser will be discarded.")) return;
    applyAgenda(clone(FILE_DEFAULTS), false);
  });
  $("#ed-save").addEventListener("click", function () {
    showErrors = true;
    if (!validate()) return;
    var copy = PRISTINE.cloneNode(true);
    // Escape every "<" so a title containing a closing script tag cannot end the data block early.
    copy.querySelector("#agenda-data").textContent =
      "\n" + JSON.stringify(collect(), null, 2).replace(/</g, "\\u003c") + "\n";
    var html = "<!doctype html>\n" + copy.outerHTML + "\n";
    var url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    var a = document.createElement("a");
    a.href = url; a.download = "meeting-agenda.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  // ---------- go ----------
  build();
  current = 0;
  start();
  render();
  setInterval(function () { if (!editorOpen) render(); }, 250);
})();
</script>
</body>
</html>
