<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D3 slide engine browser fixture</title>
    <style>
      :root { color-scheme: dark; background: #0d1011; color: #eef7fa; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui, sans-serif; }
      #stage { width: min(92vw, 1200px); aspect-ratio: 16 / 9; }
      svg { width: 100%; height: 100%; display: block; background: #111a20; }
      text { fill: #eef7fa; font-size: 30px; font-weight: 700; }
      .slide-labels { pointer-events: none; }
    </style>
  </head>
  <body>
    <main id="stage" aria-label="Browser test stage"></main>
    <script src="/node_modules/d3/dist/d3.min.js"></script>
    <script type="module">
      import { createSlideEngine } from "/src/engine.js";

      const slides = [
        { id: "origin", title: "Origin", accent: "#7dd3fc", objects: [{ id: "core", x: 0, y: 0, z: 0, width: 90, depth: 90, height: 90 }] },
        { id: "trajectory", title: "Trajectory", accent: "#fbbf24", objects: [
          { id: "near", x: -180, y: 0, z: 0, width: 70, depth: 70, height: 120 },
          { id: "far", x: 180, y: 0, z: 0, width: 120, depth: 80, height: 180 }
        ] }
      ];

      window.slideEngine = createSlideEngine({ d3: window.d3, root: document.querySelector("#stage"), slides });
      window.slideEngine.mount();
      window.slides = slides;
    </script>
  </body>
</html>
