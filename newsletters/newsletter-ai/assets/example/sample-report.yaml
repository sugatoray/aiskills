    kind: home
    nav_label: "Overview"
    icon: home
    eyebrow: "Weekly Executive Brief"
    title: "Overview"
    lede: >-
      <b>The AI Intelligence Brief</b> — a ranked, sourced read on the AI
      developments that actually moved capability, cost, adoption, compute,
      and the global competitive balance — for people who don't have time to
      read everything themselves.
    callout:
      style: warn
      icon: alert
      html: >-
        <b>This is a sample / demonstration edition.</b> It was produced by
        the <code>newsletter-ai</code> skill from seven targeted web
        searches — a much lighter research pass than the skill's own brief
        (<code>assets/PROMPT.md</code>) calls for, which expects roughly
        twenty ranked, cross-checked, primary-sourced developments per week.
        Several sections below say plainly where the evidence ran out,
        rather than filling the gap. Full caveat under Part 15 →
        &ldquo;Scope &amp; Limitations.&rdquo;
    cards:
      - target: part1
        icon: trend
        badge: cyan
        title: "01 · Top Developments"
        desc: "Ten ranked stories — an IPO race, a talent exodus, a rack-scale hardware challenger, and China's memory-chip breakout."
      - target: part2
        icon: flask
        badge: purple
        title: "02 · Model Intelligence"
        desc: "Twelve-plus model releases in three weeks, compared in one table — with an honest note on how unverified the specifics are."
