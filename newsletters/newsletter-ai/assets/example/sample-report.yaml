meta:
  title: "The AI Intelligence Brief"
  eyebrow: "Weekly Executive Brief"
  window: "Week of August 19–25, 2026"
  generated: "August 25, 2026"
  coverage_line: "15 parts · 10 ranked developments"
  sample_edition: true
  scope_note: >-
    Produced by the <b>newsletter-ai</b> skill as a demonstration pass: a
    lighter research depth than the full editorial brief in
    <code>assets/PROMPT.md</code> calls for. Ten ranked developments instead
    of twenty, and several sections are marked as data gaps rather than
    filled with unverified claims. See &ldquo;Scope &amp; Limitations&rdquo;
    in Part 15 for the full caveat.

sections:
