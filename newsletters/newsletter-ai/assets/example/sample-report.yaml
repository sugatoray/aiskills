        icon: eye
        badge: indigo
        title: "03 · Open vs. Closed"
        desc: "Mixed signal this week — no confident call on whether the capability gap is widening or narrowing."
      - target: part4
        icon: people
        badge: purple
        title: "04 · Labs & Talent War"
        desc: "Jeff Dean's cluster exit from Google, and where the Shazeer/Jumper moves fit the bigger pattern."
