name: Verify banner update
on:
  pull_request:
    branches: [master]
    paths: [".github/workflows/verify-banner-temporary.yml"]
permissions:
  contents: read
jobs:
  banner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/packages/aiskills
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/banner-tools" playwright
          echo "NODE_PATH=$RUNNER_TEMP/banner-tools/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/banner-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render banner PNG
        run: npm run banner:png
      - name: Verify banner and site
        run: env -u GITHUB_ACTIONS node --test src/test/banner.test.mjs src/test/docs-html.test.mjs src/test/docs-site.test.mjs
      - name: Upload rendered banner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-banner
          path: src/packages/aiskills/docs/banner/banner_2x.png
