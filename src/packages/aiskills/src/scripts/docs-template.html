<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aiskills documentation</title>
<meta name="description" content="User documentation for @sugatoray-ai/aiskills: install Sugato Ray's agent skills into Claude Code, Codex, Cursor and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky header with section tabs; three columns below — page nav | article | on-this-page TOC. */
:root {
  --bg: #fbfcfc;
  --surface: #f1f5f5;
  --surface-2: #e6eded;
  --fg: #172225;
  --muted: #56676b;
  --line: #d6e0e1;
  --accent: #0b6d77;
  --accent-soft: #dcefef;
  --accent-fg: #ffffff;
  --code-bg: #f0f4f4;
  --code-fg: #1d2b2e;
  --tok-kw: #8a3ab9;
  --tok-str: #2c7a2c;
  --tok-num: #b0520b;
  --tok-com: #7b8b8e;
  --tok-attr: #0b6d77;
  --tok-fn: #2557b8;
  --note: #2557b8;
  --tip: #2c7a2c;
  --important: #8a3ab9;
  --warning: #9a6200;
  --caution: #b42318;
  --shadow: 0 1px 2px rgba(20, 40, 44, .06), 0 8px 24px rgba(20, 40, 44, .06);
  --font-display: "Bricolage Grotesque", "Public Sans", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --header-h: 104px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1719; --surface: #152023; --surface-2: #1c2a2e; --fg: #e3ecec; --muted: #93a6a9;
    --line: #26373b; --accent: #5cc6cf; --accent-soft: #163a3e; --accent-fg: #062326;
    --code-bg: #121d20; --code-fg: #dbe6e6; --tok-kw: #d39af5; --tok-str: #9fd88a; --tok-num: #f2b36b;
    --tok-com: #6f8589; --tok-attr: #5cc6cf; --tok-fn: #8fb4ff; --note: #8fb4ff; --tip: #8fd17a;
    --important: #d39af5; --warning: #e8b85a; --caution: #ff8a7a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1719; --surface: #152023; --surface-2: #1c2a2e; --fg: #e3ecec; --muted: #93a6a9;
  --line: #26373b; --accent: #5cc6cf; --accent-soft: #163a3e; --accent-fg: #062326;
  --code-bg: #121d20; --code-fg: #dbe6e6; --tok-kw: #d39af5; --tok-str: #9fd88a; --tok-num: #f2b36b;
  --tok-com: #6f8589; --tok-attr: #5cc6cf; --tok-fn: #8fb4ff; --note: #8fb4ff; --tip: #8fd17a;
  --important: #d39af5; --warning: #e8b85a; --caution: #ff8a7a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 16px); }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-row { display: flex; align-items: center; gap: 12px; height: 58px; max-width: 1440px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
.brand-ver {
  font-family: var(--font-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line);
  border-radius: 999px; padding: 1px 8px;
}
.cmd {
  font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; min-width: 0;
}
.cmd b { color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.search { position: relative; flex: 0 1 260px; min-width: 0; }
.search input {
  width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  color: var(--fg); padding: 0 34px 0 34px; font: inherit; font-size: 14px;
}
.search input::placeholder { color: var(--muted); }
.search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px;
  color: var(--muted); pointer-events: none;
}
.search kbd {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono);
  font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px;
  background: var(--bg);
}
.icon-btn {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  display: inline-grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn:hover { border-color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }
.gh-btn { color: var(--fg); }
.gh-btn svg { width: 19px; height: 19px; }
.menu-btn { display: none; }
.theme-btn .sun { display: none; }
:root[data-effective="dark"] .theme-btn .sun { display: block; }
:root[data-effective="dark"] .theme-btn .moon { display: none; }

.tabs {
  display: flex; gap: 4px; max-width: 1440px; margin: 0 auto; overflow-x: auto; scrollbar-width: none;
  height: 45px; align-items: stretch;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: none; padding: 0 14px; cursor: pointer; font-size: 14.5px; font-weight: 500;
  color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; display: flex;
  align-items: center; gap: 8px;
}
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tab .count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-weight: 400; }

/* Three-column body */
.shell {
  display: grid; grid-template-columns: 260px minmax(0, 1fr) 230px; gap: 40px; max-width: 1440px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.side, .toc {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--header-h)); align-self: start;
  max-height: calc(100vh - var(--header-h) - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding-block: 28px 40px; scrollbar-width: thin;
}
.side-label, .toc-label {
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  margin: 0 0 10px 10px;
}
.side-group + .side-group { margin-top: 22px; }
.nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.nav-list a {
  display: block; padding: 6px 10px; border-radius: 6px; color: var(--fg); text-decoration: none;
  font-size: 14.5px; line-height: 1.4;
}
.nav-list a:hover { background: var(--surface); }
.nav-list a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-list.other a { color: var(--muted); font-size: 14px; }
.step { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-right: 6px; }
.nav-list a[aria-current="page"] .step { color: var(--accent); }
.results .hit { display: block; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--fg); }
.results .hit:hover { background: var(--surface); }
.results .hit strong { display: block; font-size: 14px; }
.results .hit span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.results mark { background: var(--accent-soft); color: var(--accent); border-radius: 2px; }
.empty { color: var(--muted); font-size: 14px; padding: 0 10px; }

.toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
.toc a {
  display: block; padding: 4px 12px; margin-left: -1px; border-left: 2px solid transparent; color: var(--muted);
  text-decoration: none; font-size: 13.5px; line-height: 1.45;
}
.toc a.lvl3 { padding-left: 24px; font-size: 13px; }
.toc a:hover { color: var(--fg); }
.toc a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.toc-actions { margin-top: 18px; display: grid; gap: 6px; padding-left: 12px; font-size: 13px; }
.toc-actions a { color: var(--muted); text-decoration: none; }
.toc-actions a:hover { color: var(--accent); }

/* Article */
main { min-width: 0; padding-block: 28px 80px; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.doc { max-width: 780px; }
.doc h1 {
  font-family: var(--font-display); font-size: clamp(30px, 4vw, 40px); line-height: 1.12; letter-spacing: -.02em;
  margin: 0 0 18px; text-wrap: balance;
}
.doc h2 {
  font-family: var(--font-display); font-size: 25px; line-height: 1.25; letter-spacing: -.01em; margin: 48px 0 12px;
  padding-top: 20px; border-top: 1px solid var(--line); text-wrap: balance;
}
.doc h3 { font-size: 18.5px; line-height: 1.35; margin: 32px 0 8px; text-wrap: balance; }
.doc h4 { font-size: 16px; margin: 24px 0 6px; }
.doc h2 code, .doc h3 code { font-size: .88em; }
.doc :is(h2, h3, h4) { position: relative; }
.doc .anchor {
  position: absolute; left: -22px; padding-right: 6px; color: var(--muted); text-decoration: none; opacity: 0;
  font-weight: 400;
}
.doc :is(h2, h3, h4):hover .anchor, .doc .anchor:focus-visible { opacity: 1; }
.doc p, .doc ul, .doc ol { margin: 0 0 16px; }
.doc ul, .doc ol { padding-left: 24px; }
.doc li + li { margin-top: 4px; }
.doc li > ul, .doc li > ol { margin: 4px 0 0; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
.doc strong { font-weight: 650; }
.doc :not(pre) > code {
  font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); padding: .12em .38em;
  border-radius: 5px; overflow-wrap: anywhere;
}
.doc a code { color: var(--accent); }
.doc img {
  display: block; max-width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line);
  box-shadow: var(--shadow); margin: 8px 0;
}
.figure-wrap { overflow-x: auto; margin: 0 0 18px; }

.codeblock { position: relative; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--code-bg); }
.codeblock .lang {
  position: absolute; top: 0; right: 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  padding: 6px 10px; text-transform: lowercase; pointer-events: none; transition: opacity .15s;
}
.codeblock .copy {
  position: absolute; top: 6px; right: 6px; border: 1px solid var(--line); background: var(--bg);
  border-radius: 6px; font-size: 12px; padding: 3px 9px; cursor: pointer; opacity: 0; transition: opacity .15s;
}
.codeblock:hover .copy, .codeblock .copy:focus-visible { opacity: 1; }
.codeblock:hover .lang { opacity: 0; }
.codeblock.output { background: transparent; border-style: dashed; }
.codeblock.output::before {
  content: "Output"; display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); padding: 10px 16px 0;
}
.doc pre {
  margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 13.5px;
  line-height: 1.6; color: var(--code-fg); tab-size: 4;
}
.codeblock.output pre { padding-top: 4px; }
.codeblock:has(.lang) pre { padding-top: 28px; }
.doc pre, .doc code, .cmd { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
.doc pre code { font-family: inherit; background: none; padding: 0; }
.hljs-keyword, .hljs-built_in, .hljs-selector-tag, .hljs-literal { color: var(--tok-kw); }
.hljs-string, .hljs-regexp, .hljs-addition { color: var(--tok-str); }
.hljs-number, .hljs-symbol, .hljs-bullet { color: var(--tok-num); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--tok-com); font-style: italic; }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-section, .hljs-property { color: var(--tok-attr); }
.hljs-title, .hljs-title\.function_, .hljs-function { color: var(--tok-fn); }
.hljs-deletion { color: var(--caution); }

.table-wrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 10px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.doc th, .doc td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.doc th { background: var(--surface); font-weight: 650; font-size: 13.5px; white-space: nowrap; }
.doc tr:last-child td { border-bottom: 0; }
.doc td code { white-space: nowrap; }

.doc blockquote { margin: 0 0 18px; padding: 4px 18px; border-left: 3px solid var(--line); color: var(--muted); }
.alert { margin: 0 0 18px; padding: 12px 16px 2px; border: 1px solid var(--line); border-left: 4px solid var(--a); border-radius: 8px; background: var(--surface); }
.alert-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--a); margin-bottom: 4px; }
.alert-title svg { width: 16px; height: 16px; }
.alert p { margin-bottom: 10px; }
.alert.note { --a: var(--note); } .alert.tip { --a: var(--tip); } .alert.important { --a: var(--important); }
.alert.warning { --a: var(--warning); } .alert.caution { --a: var(--caution); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 56px; max-width: 780px; }
.pager a {
  display: block; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; text-decoration: none;
  color: var(--fg); min-width: 0;
}
.pager a:hover { border-color: var(--accent); }
.pager .dir { display: block; font-size: 12px; color: var(--muted); }
.pager .t { display: block; font-weight: 600; color: var(--accent); overflow-wrap: anywhere; }
.pager .next { text-align: right; grid-column: 2; }
.loading, .failed { color: var(--muted); padding: 40px 0; }

.scrim { display: none; }
.mobile-toc { display: none; }

@media (max-width: 1180px) {
  .shell { grid-template-columns: 240px minmax(0, 1fr); gap: 32px; }
  .toc { display: none; }
  .mobile-toc { display: block; margin: 0 0 24px; border: 1px solid var(--line); border-radius: 10px; max-width: 780px; }
  .mobile-toc summary { cursor: pointer; padding: 10px 14px; font-size: 14px; font-weight: 600; }
  .mobile-toc ol { list-style: none; margin: 0; padding: 0 14px 12px; columns: 2; column-gap: 24px; }
  .mobile-toc a { display: block; font-size: 13.5px; padding: 3px 0; color: var(--muted); text-decoration: none; break-inside: avoid; }
  .mobile-toc a.lvl3 { padding-left: 12px; }
  .mobile-toc a:hover { color: var(--accent); }
}
@media (max-width: 860px) {
  .cmd { display: none; }
  .menu-btn { display: inline-grid; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); max-height: none; z-index: 20;
    background: var(--bg); border-right: 1px solid var(--line); transform: translateX(-100%);
    transition: transform .2s ease; padding: calc(env(safe-area-inset-top, 0px) + 20px) 14px 40px max(14px, env(safe-area-inset-left, 0px));
  }
  body.nav-open .side { transform: none; box-shadow: var(--shadow); }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 15; }
  .doc .anchor { display: none; }
}
@media (max-width: 560px) {
  .search { flex-basis: auto; flex-grow: 1; }
  .search kbd { display: none; }
  .search input::placeholder { color: transparent; }
  .brand-ver { display: none; }
  .mobile-toc ol { columns: 1; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .next { grid-column: 1; }
  .doc h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* Landing-page banner: the static banner from docs/banner/aiskills-banner.html, drawn at its native
   1280x640 and scaled to the column width by the script. */
.hero { position: relative; max-width: 780px; aspect-ratio: 2 / 1; overflow: hidden; margin: 0 0 24px;
        border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.hero[hidden] { display: none; }
.hero-scaler { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; transform-origin: 0 0; }
/*__BANNER_CSS__*/
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open page list" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#home"><span class="brand-name">aiskills</span><span class="brand-ver">v{{VERSION}}</span></a>
    <span class="cmd">$ aiskills install <b>-G</b> scrolls <b>-a</b> claude-code</span>
    <span class="spacer"></span>
    <label class="search" for="q">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search the docs" autocomplete="off" aria-label="Search the docs">
      <kbd>/</kbd>
    </label>
    <a class="icon-btn gh-btn" href="{{REPO}}" target="_blank" rel="noopener" aria-label="aiskills on GitHub" title="aiskills on GitHub">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
    </a>
    <button class="icon-btn theme-btn" id="theme-btn" aria-label="Switch to dark theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Documentation sections"></nav>
</header>

<div class="shell">
  <aside class="side" id="side" aria-label="Pages"></aside>
  <main id="main">
    <div class="crumbs" id="crumbs"></div>
    <div class="hero" id="hero" role="img" hidden></div>
    <details class="mobile-toc" id="mobile-toc" hidden><summary>On this page</summary><ol></ol></details>
    <article class="doc" id="doc"><p class="loading">Loading the documentation…</p></article>
    <nav class="pager" id="pager" aria-label="Previous and next page"></nav>
  </main>
  <aside class="toc" id="toc" aria-label="On this page"></aside>
</div>
<div class="scrim" id="scrim"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const DATA = /*__DOCS_DATA__*/null;
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const root = document.documentElement;
  const byId = new Map(DATA.pages.map(p => [p.id, p]));
  const byPath = new Map(DATA.pages.map(p => [p.path, p]));
  const order = DATA.tabs.flatMap(t => t.pages.map(path => byPath.get(path)));
  const tabOf = id => DATA.tabs.find(t => t.id === byId.get(id).tab);
  let current = null, observer = null;

  /* ---------- theme ---------- */
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  function effectiveTheme() {
    const t = root.getAttribute("data-theme");
    return t === "dark" || t === "light" ? t : (mq.matches ? "dark" : "light");
  }
  function syncThemeUI() {
    const eff = effectiveTheme();
    root.setAttribute("data-effective", eff);
    $("#theme-btn").setAttribute("aria-label", eff === "dark" ? "Switch to light theme" : "Switch to dark theme");
  }
  const saved = store.get("aiskills-docs-theme");
  if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
  syncThemeUI();
  mq.addEventListener("change", syncThemeUI);
  new MutationObserver(syncThemeUI).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  $("#theme-btn").addEventListener("click", () => {
    const next = effectiveTheme() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    store.set("aiskills-docs-theme", next);
  });

  if (!window.marked) {
    $("#doc").innerHTML = '<p class="failed">The Markdown renderer could not load, so the pages can\'t be shown. Check your connection and reload.</p>';
    return;
  }

  /* ---------- markdown helpers ---------- */
  function slug(text) {
    return text.trim().toLowerCase().split("").filter(ch => /[\p{L}\p{N}]/u.test(ch) || " -_".includes(ch)).join("").replace(/ /g, "-");
  }
  function resolve(fromPath, href) {
    const u = new URL(href, "https://docs.invalid/root/" + fromPath);
    if (u.host !== "docs.invalid") return null;
    return { path: decodeURIComponent(u.pathname).replace(/^\/root\//, ""), hash: decodeURIComponent(u.hash.slice(1)), raw: u.pathname };
  }
  const ALERT_ICONS = {
    note: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    tip: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
    important: '<path d="M4 4h16v12H8l-4 4z"/><path d="M12 8v3M12 13.5h.01"/>',
    warning: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
    caution: '<path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/><path d="M12 8v5M12 16h.01"/>',
  };

  // The banner (only on the landing page), scaled from 1280px to the column width
  const hero = $("#hero");
  if (DATA.banner) {
    hero.innerHTML = `<div class="hero-scaler">${DATA.banner}</div>`;
    hero.setAttribute("aria-label", DATA.bannerLabel);
    const scaler = hero.firstElementChild;
    new ResizeObserver(() => { scaler.style.transform = `scale(${hero.clientWidth / 1280})`; }).observe(hero);
  }

  function render(page) {
    hero.hidden = !(DATA.banner && page.id === "home");
    const doc = $("#doc");
    doc.innerHTML = marked.parse(page.md, { gfm: true });

    // GitHub alerts
    doc.querySelectorAll("blockquote").forEach(bq => {
      const first = bq.firstElementChild;
      const m = first && first.tagName === "P" && first.innerHTML.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(<br>)?\s*/);
      if (!m) return;
      const kind = m[1].toLowerCase();
      first.innerHTML = first.innerHTML.slice(m[0].length);
      if (!first.innerHTML.trim()) first.remove();
      const box = document.createElement("div");
      box.className = "alert " + kind;
      box.setAttribute("role", "note");
      box.innerHTML = '<div class="alert-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        ALERT_ICONS[kind] + "</svg>" + kind + "</div>";
      while (bq.firstChild) box.appendChild(bq.firstChild);
      bq.replaceWith(box);
    });

    // Heading anchors (GitHub slugs, with -1, -2 for repeats)
    const seen = new Map();
    doc.querySelectorAll("h1, h2, h3, h4").forEach(h => {
      const base = slug(h.textContent);
      const n = seen.get(base) || 0;
      seen.set(base, n + 1);
      h.id = n ? `${base}-${n}` : base;
      if (h.tagName !== "H1") {
        const a = document.createElement("a");
        a.className = "anchor"; a.href = "#" + page.id; a.dataset.anchor = h.id; a.textContent = "#";
        a.setAttribute("aria-label", "Link to this section");
        h.prepend(a);
      }
    });

    // Images: embedded SVGs
    doc.querySelectorAll("img").forEach(img => {
      const r = resolve(page.path, img.getAttribute("src"));
      if (r && DATA.images[r.path]) img.src = DATA.images[r.path];
      img.loading = "lazy";
      const wrap = document.createElement("div");
      wrap.className = "figure-wrap";
      const host = img.parentElement.tagName === "P" && img.parentElement.childNodes.length === 1 ? img.parentElement : img;
      host.replaceWith(wrap); wrap.appendChild(img);
    });

    // Links: other pages become in-app routes; files outside the docs go to GitHub
    doc.querySelectorAll("a[href]").forEach(a => {
      if (a.classList.contains("anchor")) return;
      const href = a.getAttribute("href");
      if (/^[a-z]+:/i.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
      if (href.startsWith("#")) { a.href = "#" + page.id; a.dataset.anchor = decodeURIComponent(href.slice(1)); return; }
      const r = resolve(page.path, href);
      const target = r && byPath.get(r.path);
      if (target) { a.href = "#" + target.id; if (r.hash) a.dataset.anchor = r.hash; return; }
      const base = r.path.endsWith("/") ? DATA.treeBase : DATA.repoBase;
      a.href = new URL(href, base + page.path).href;
      a.target = "_blank"; a.rel = "noopener";
    });

    // Tables scroll on their own
    doc.querySelectorAll("table").forEach(t => {
      const w = document.createElement("div"); w.className = "table-wrap";
      t.replaceWith(w); w.appendChild(t);
    });

    // Code: highlight, label, copy; blocks that follow another block are output
    doc.querySelectorAll("pre > code").forEach(code => {
      const pre = code.parentElement;
      const lang = ((code.className.match(/language-([\w-]+)/) || [])[1] || "").toLowerCase();
      const box = document.createElement("div");
      box.className = "codeblock";
      const prev = pre.previousElementSibling;
      const isOutput = lang === "text" && prev && prev.classList.contains("codeblock");
      if (isOutput) box.classList.add("output");
      pre.replaceWith(box); box.appendChild(pre);
      if (window.hljs && lang && lang !== "text") {
        const l = lang === "toml" ? "ini" : lang === "sh" || lang === "shell" ? "bash" : lang;
        if (hljs.getLanguage(l)) { try { hljs.highlightElement(code); } catch (e) {} }
      }
      if (!isOutput && lang) {
        const tag = document.createElement("span"); tag.className = "lang"; tag.textContent = lang; box.appendChild(tag);
      }
      const btn = document.createElement("button");
      btn.className = "copy"; btn.type = "button"; btn.textContent = "Copy";
      btn.addEventListener("click", () => {
        const text = code.textContent;
        const done = ok => { btn.textContent = ok ? "Copied" : "Select and copy"; setTimeout(() => btn.textContent = "Copy", 1600); };
        const fallback = () => {
          const range = document.createRange(); range.selectNodeContents(code);
          const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); done(false);
        };
        try { navigator.clipboard.writeText(text).then(() => done(true), fallback); } catch (e) { fallback(); }
      });
      box.appendChild(btn);
    });
  }

  /* ---------- chrome: tabs, side nav, toc, pager ---------- */
  function drawTabs() {
    const tabs = $("#tabs");
    tabs.innerHTML = "";
    DATA.tabs.forEach(t => {
      const b = document.createElement("button");
      b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(current && tabOf(current.id).id === t.id));
      b.innerHTML = t.label + (t.pages.length > 1 ? `<span class="count">${t.pages.length}</span>` : "");
      b.addEventListener("click", () => go(byPath.get(t.pages[0]).id));
      tabs.appendChild(b);
    });
    const sel = $('.tab[aria-selected="true"]', tabs);
    if (sel) sel.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function navLabel(p) {
    const m = p.path.match(/^tutorial\/0?(\d+)-/);
    const title = m ? p.title.replace(/^\d+\.\s*/, "") : p.title;
    return (m ? `<span class="step">${m[1].padStart(2, "0")}</span>` : "") + escapeHtml(title);
  }
  function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function drawSide() {
    const side = $("#side");
    if ($("#q").value.trim()) return drawResults($("#q").value.trim());
    const tab = tabOf(current.id);
    let html = `<div class="side-group"><p class="side-label">${escapeHtml(tab.label)}</p><ul class="nav-list">`;
    tab.pages.forEach(path => {
      const p = byPath.get(path);
      html += `<li><a href="#${p.id}"${p.id === current.id ? ' aria-current="page"' : ""}>${navLabel(p)}</a></li>`;
    });
    html += `</ul></div><div class="side-group"><p class="side-label">Other sections</p><ul class="nav-list other">`;
    DATA.tabs.filter(t => t.id !== tab.id).forEach(t => {
      html += `<li><a href="#${byPath.get(t.pages[0]).id}">${escapeHtml(t.label)}</a></li>`;
    });
    side.innerHTML = html + "</ul></div>";
  }

  function plain(md) {
    return md.replace(/```[\s\S]*?```/g, " ").replace(/!?\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/[#>*`|_-]+/g, " ").replace(/\s+/g, " ");
  }
  const searchIndex = DATA.pages.map(p => ({ p, text: plain(p.md), lower: plain(p.md).toLowerCase() }));
  function drawResults(q) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = searchIndex
      .map(e => {
        const title = e.p.title.toLowerCase();
        if (!terms.every(t => e.lower.includes(t) || title.includes(t))) return null;
        const score = terms.reduce((s, t) => s + (title.includes(t) ? 10 : 0) + e.lower.split(t).length - 1, 0);
        return { e, score };
      })
      .filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 20);
    const mark = s => terms.reduce((acc, t) => acc.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`), escapeHtml(s));
    let html = `<div class="side-group"><p class="side-label">${hits.length} result${hits.length === 1 ? "" : "s"}</p><div class="results">`;
    if (!hits.length) html += `<p class="empty">No page mentions “${escapeHtml(q)}”.</p>`;
    hits.forEach(({ e }) => {
      const i = e.lower.indexOf(terms[0]);
      const snip = (i > 40 ? "…" : "") + e.text.slice(Math.max(0, i - 40), i + 90).trim() + "…";
      html += `<a class="hit" href="#${e.p.id}"><strong>${mark(e.p.title)}</strong><span>${mark(snip)}</span></a>`;
    });
    $("#side").innerHTML = html + "</div></div>";
  }

  function drawToc() {
    const heads = [...$("#doc").querySelectorAll("h2, h3")];
    const items = heads.map(h => {
      const text = escapeHtml(h.textContent.replace(/^#/, ""));
      return `<li><a href="#${current.id}" data-anchor="${h.id}" class="lvl${h.tagName[1]}">${text}</a></li>`;
    }).join("");
    const toc = $("#toc"), mtoc = $("#mobile-toc");
    if (!heads.length) { toc.innerHTML = ""; mtoc.hidden = true; }
    else {
      toc.innerHTML = `<p class="toc-label">On this page</p><ol>${items}</ol>`;
      mtoc.hidden = false; mtoc.open = false; $("ol", mtoc).innerHTML = items;
    }
    const src = DATA.repoBase + current.path;
    toc.insertAdjacentHTML("beforeend", `<div class="toc-actions"><a href="#${current.id}" data-anchor="top">Back to top ↑</a><a href="${src}" target="_blank" rel="noopener">View source on GitHub ↗</a></div>`);

    if (observer) observer.disconnect();
    const links = new Map([...toc.querySelectorAll("a[data-anchor]")].map(a => [a.dataset.anchor, a]));
    const visible = new Set();
    observer = new IntersectionObserver(entries => {
      entries.forEach(en => en.isIntersecting ? visible.add(en.target.id) : visible.delete(en.target.id));
      let active = null;
      for (const h of heads) { if (visible.has(h.id)) { active = h.id; break; } }
      if (!active) {
        const y = 140;
        for (const h of heads) { if (h.getBoundingClientRect().top < y) active = h.id; }
      }
      links.forEach((a, id) => a.classList.toggle("active", id === active));
    }, { rootMargin: "-100px 0px -60% 0px" });
    heads.forEach(h => observer.observe(h));
  }

  function drawPager() {
    const i = order.indexOf(current);
    const prev = order[i - 1], next = order[i + 1];
    $("#pager").innerHTML =
      (prev ? `<a class="prev" href="#${prev.id}"><span class="dir">← Previous</span><span class="t">${escapeHtml(prev.title)}</span></a>` : "") +
      (next ? `<a class="next" href="#${next.id}"><span class="dir">Next →</span><span class="t">${escapeHtml(next.title)}</span></a>` : "");
  }

  function drawCrumbs() {
    const tab = tabOf(current.id);
    const first = byPath.get(tab.pages[0]);
    $("#crumbs").innerHTML = current.id === "home" ? "" :
      `<a href="#home">aiskills</a><span>/</span>` + (first === current ? `<span>${escapeHtml(tab.label)}</span>` :
      `<a href="#${first.id}">${escapeHtml(tab.label)}</a><span>/</span><span>${escapeHtml(current.title)}</span>`);
  }

  /* ---------- routing (hash holds the page id only) ---------- */
  let pendingAnchor = null;
  function scrollToAnchor(anchor, smooth) {
    if (!anchor || anchor === "top") { window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" }); return; }
    const el = document.getElementById(anchor);
    if (el) el.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
  }
  function show(id) {
    const page = byId.get(id) || byId.get("home");
    const same = current === page;
    current = page;
    if (!same) {
      render(page); drawTabs(); drawSide(); drawToc(); drawPager(); drawCrumbs();
      document.title = page.id === "home" ? "aiskills documentation" : `${page.title} · aiskills documentation`;
    }
    scrollToAnchor(pendingAnchor, same);
    pendingAnchor = null;
    closeNav();
  }
  function go(id, anchor) {
    pendingAnchor = anchor || null;
    if (location.hash.slice(1) === id) show(id);
    else location.hash = id;
  }
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="#"]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
    const id = a.getAttribute("href").slice(1);
    if (!byId.has(id)) return;
    e.preventDefault();
    if ($("#q").value && a.classList.contains("hit")) { /* keep results open */ }
    go(id, a.dataset.anchor);
  });

  /* ---------- search + mobile nav ---------- */
  const q = $("#q");
  q.addEventListener("input", () => { if (current) { drawSide(); if (q.value.trim()) openNav(); } });
  q.addEventListener("keydown", e => {
    if (e.key === "Escape") { q.value = ""; drawSide(); q.blur(); }
    if (e.key === "Enter") { const hit = $(".hit"); if (hit) hit.click(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)) {
      e.preventDefault(); q.focus();
    }
  });
  const narrow = window.matchMedia("(max-width: 860px)");
  function openNav() { if (!narrow.matches) return; document.body.classList.add("nav-open"); $("#menu-btn").setAttribute("aria-expanded", "true"); }
  function closeNav() { document.body.classList.remove("nav-open"); $("#menu-btn").setAttribute("aria-expanded", "false"); }
  $("#menu-btn").addEventListener("click", () => document.body.classList.contains("nav-open") ? closeNav() : openNav());
  $("#scrim").addEventListener("click", closeNav);

  show(location.hash.slice(1) || "home");
})();
</script>
</body>
</html>
