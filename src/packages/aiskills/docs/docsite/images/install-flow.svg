<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>What aiskills install does, in order: parse, sync, select skills, expand agents, look up external skills, then npx skills add</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <g>
    <rect x="20" y="40" width="125" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="82" y="66" text-anchor="middle" font-weight="600" fill="#1e3a8a">1 Parse</text>
    <text x="82" y="90" text-anchor="middle" fill="#0f172a" font-size="13">options +</text>
    <text x="82" y="108" text-anchor="middle" fill="#0f172a" font-size="13">AISKILLS_*</text>

    <rect x="165" y="40" width="125" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="227" y="66" text-anchor="middle" font-weight="600" fill="#14532d">2 Sync</text>
    <text x="227" y="90" text-anchor="middle" fill="#0f172a" font-size="13">refresh the</text>
    <text x="227" y="108" text-anchor="middle" fill="#0f172a" font-size="13">install folder</text>

    <rect x="310" y="40" width="125" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="372" y="66" text-anchor="middle" font-weight="600" fill="#1e3a8a">3 Select</text>
    <text x="372" y="90" text-anchor="middle" fill="#0f172a" font-size="13">-s, -G and</text>
    <text x="372" y="108" text-anchor="middle" fill="#0f172a" font-size="13">patterns</text>

    <rect x="455" y="40" width="125" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="517" y="66" text-anchor="middle" font-weight="600" fill="#1e3a8a">4 Agents</text>
    <text x="517" y="90" text-anchor="middle" fill="#0f172a" font-size="13">expand -a</text>
    <text x="517" y="108" text-anchor="middle" fill="#0f172a" font-size="13">patterns</text>

    <rect x="600" y="40" width="125" height="90" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="662" y="66" text-anchor="middle" font-weight="600" fill="#334155">5 Look up</text>
    <text x="662" y="90" text-anchor="middle" fill="#0f172a" font-size="13">external names</text>
    <text x="662" y="108" text-anchor="middle" fill="#0f172a" font-size="13">(--route only)</text>

    <rect x="745" y="40" width="115" height="90" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="802" y="66" text-anchor="middle" font-weight="600" fill="#7c2d12">6 Install</text>
    <text x="802" y="90" text-anchor="middle" fill="#0f172a" font-size="13">npx skills</text>
    <text x="802" y="108" text-anchor="middle" fill="#0f172a" font-size="13">add</text>
  </g>
  <line x1="145" y1="85" x2="161" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="290" y1="85" x2="306" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="435" y1="85" x2="451" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="580" y1="85" x2="596" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="725" y1="85" x2="741" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="170" width="705" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="372" y="198" text-anchor="middle" font-weight="600" fill="#7f1d1d">Any problem in steps 1, 3, 4 or 5: stop with exit code 1</text>
  <text x="372" y="220" text-anchor="middle" fill="#0f172a" font-size="13">before anything is installed (bad option, unknown name, empty pattern, ambiguous lookup)</text>
  <line x1="82" y1="130" x2="82" y2="166" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="372" y1="130" x2="372" y2="166" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="517" y1="130" x2="517" y2="166" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="662" y1="130" x2="662" y2="166" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="20" y="280" fill="#475569" font-size="13">npm install runs none of this: these steps start only when you run aiskills install.</text>
</svg>
