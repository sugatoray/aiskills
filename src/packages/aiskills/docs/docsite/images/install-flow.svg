<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 880 300"><title>What aiskills install does, in order: parse, sync, select skills, expand agents, look up external skills, then npx skills add</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#334155" d="M0,0 L10,5 L0,10 z"/></marker></defs><g><rect width="125" height="90" x="20" y="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/><text x="82" y="66" fill="#1e3a8a" font-weight="600" text-anchor="middle">1 Parse</text><text x="82" y="90" fill="#0f172a" font-size="13" text-anchor="middle">options +</text><text x="82" y="108" fill="#0f172a" font-size="13" text-anchor="middle">AISKILLS_*</text><rect width="125" height="90" x="165" y="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="8"/><text x="227" y="66" fill="#14532d" font-weight="600" text-anchor="middle">2 Sync</text><text x="227" y="90" fill="#0f172a" font-size="13" text-anchor="middle">refresh the</text><text x="227" y="108" fill="#0f172a" font-size="13" text-anchor="middle">install folder</text><rect width="125" height="90" x="310" y="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/><text x="372" y="66" fill="#1e3a8a" font-weight="600" text-anchor="middle">3 Select</text><text x="372" y="90" fill="#0f172a" font-size="13" text-anchor="middle">-s, -G and</text><text x="372" y="108" fill="#0f172a" font-size="13" text-anchor="middle">patterns</text><rect width="125" height="90" x="455" y="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/><text x="517" y="66" fill="#1e3a8a" font-weight="600" text-anchor="middle">4 Agents</text><text x="517" y="90" fill="#0f172a" font-size="13" text-anchor="middle">expand -a</text><text x="517" y="108" fill="#0f172a" font-size="13" text-anchor="middle">patterns</text><rect width="125" height="90" x="600" y="40" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 4" stroke-width="1.5" rx="8"/><text x="662" y="66" fill="#334155" font-weight="600" text-anchor="middle">5 Look up</text><text x="662" y="90" fill="#0f172a" font-size="13" text-anchor="middle">external names</text><text x="662" y="108" fill="#0f172a" font-size="13" text-anchor="middle">(--route only)</text><rect width="115" height="90" x="745" y="40" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" rx="8"/><text x="802" y="66" fill="#7c2d12" font-weight="600" text-anchor="middle">6 Install</text><text x="802" y="90" fill="#0f172a" font-size="13" text-anchor="middle">npx skills</text><text x="802" y="108" fill="#0f172a" font-size="13" text-anchor="middle">add</text></g><line x1="145" x2="161" y1="85" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="290" x2="306" y1="85" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="435" x2="451" y1="85" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="580" x2="596" y1="85" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="725" x2="741" y1="85" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><rect width="705" height="70" x="20" y="170" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8"/><text x="372" y="198" fill="#7f1d1d" font-weight="600" text-anchor="middle">Any problem in steps 1, 3, 4 or 5: stop with exit code 1</text><text x="372" y="220" fill="#0f172a" font-size="13" text-anchor="middle">before anything is installed (bad option, unknown name, empty pattern, ambiguous lookup)</text><line x1="82" x2="82" y1="130" y2="166" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a)"/><line x1="372" x2="372" y1="130" y2="166" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a)"/><line x1="517" x2="517" y1="130" y2="166" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a)"/><line x1="662" x2="662" y1="130" y2="166" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a)"/><text x="20" y="280" fill="#475569" font-size="13">npm install runs none of this: these steps start only when you run aiskills install.</text></svg>