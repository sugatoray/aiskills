<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 880 470"><title>How aiskills works: the npm package, the install folder, npx skills and the agents&apos; folders</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#334155" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="230" height="170" x="20" y="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/><text x="135" y="64" fill="#1e3a8a" font-weight="600" text-anchor="middle">npm package</text><text x="135" y="84" fill="#1e3a8a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">@sugatoray-ai/aiskills</text><text x="36" y="114" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">skills/&lt;name&gt;/</text><text x="36" y="136" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">.aiskills/layout.json</text><text x="36" y="158" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">marketplace.json</text><text x="36" y="186" fill="#0f172a">aiskills · ais · aix</text><rect width="280" height="170" x="305" y="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="8"/><text x="445" y="64" fill="#14532d" font-weight="600" text-anchor="middle">install folder</text><text x="445" y="84" fill="#14532d" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">~/.config/sugatoray/aiskills</text><text x="321" y="114" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">skills/ (flat or nested)</text><text x="321" y="136" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">.aiskills/layout.json</text><text x="321" y="158" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">.claude-plugin/marketplace.json</text><text x="321" y="180" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">aiskills.json</text><rect width="220" height="170" x="640" y="40" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" rx="8"/><text x="750" y="64" fill="#7c2d12" font-weight="600" text-anchor="middle">npx skills</text><text x="750" y="84" fill="#7c2d12" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">skills@1.7.6 (pinned)</text><text x="656" y="114" fill="#0f172a">add · remove · list</text><text x="656" y="136" fill="#0f172a">find (with --route)</text><text x="656" y="158" fill="#0f172a">keeps the record of</text><text x="656" y="178" fill="#0f172a">what is installed</text><rect width="220" height="140" x="640" y="300" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" rx="8"/><text x="750" y="324" fill="#581c87" font-weight="600" text-anchor="middle">agents&apos; skill folders</text><text x="656" y="352" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">~/.claude/skills/</text><text x="656" y="374" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">~/.agents/skills/</text><text x="656" y="396" fill="#0f172a">… or ./.claude/skills/</text><text x="656" y="418" fill="#0f172a">with -p (project)</text><rect width="250" height="140" x="320" y="300" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 4" stroke-width="1.5" rx="8"/><text x="445" y="324" fill="#334155" font-weight="600" text-anchor="middle">external sources</text><text x="336" y="352" fill="#0f172a">skills.sh registry (find)</text><text x="336" y="374" fill="#0f172a">GitHub: owner/repo@skill</text><text x="336" y="396" fill="#0f172a">only with --route / aix</text><line x1="250" x2="301" y1="125" y2="125" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="277" y="113" fill="#334155" font-size="13" text-anchor="middle">1 sync</text><line x1="585" x2="636" y1="125" y2="125" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="611" y="113" fill="#334155" font-size="13" text-anchor="middle">2 add</text><line x1="750" x2="750" y1="210" y2="296" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="760" y="258" fill="#334155" font-size="13">3 install</text><line x1="636" x2="560" y1="190" y2="296" stroke="#64748b" stroke-dasharray="6 4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="560" y="250" fill="#64748b" font-size="13" text-anchor="end">find / add</text><text x="20" y="460" fill="#475569" font-size="13">aiskills never writes to agent folders itself: it saves skills (1), then asks npx skills to install them (2, 3).</text></svg>