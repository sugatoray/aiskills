<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" viewBox="0 0 820 360"><title>The two layouts of the install folder&apos;s skills/ directory: flat (default) and nested (the repo&apos;s own folders)</title><rect width="100%" height="100%" fill="#fff"/><rect width="370" height="290" x="20" y="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="8"/><text x="205" y="46" fill="#14532d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">--flat (default)</text><text x="40" y="80" fill="#0f172a">skills/</text><text x="40" y="102" fill="#0f172a">├── create-lib-docs/SKILL.md</text><text x="40" y="124" fill="#0f172a">├── prodigy/SKILL.md</text><text x="40" y="146" fill="#0f172a">├── scrolls-help/SKILL.md</text><text x="40" y="168" fill="#0f172a">├── scrolls-setup/SKILL.md</text><text x="40" y="190" fill="#0f172a">├── stata-recipes/SKILL.md</text><text x="40" y="212" fill="#0f172a">└── …</text><text x="40" y="250" fill="#14532d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">One folder per skill, named after</text><text x="40" y="270" fill="#14532d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">its name:, as the package ships it.</text><rect width="370" height="290" x="430" y="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/><text x="615" y="46" fill="#1e3a8a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">--nested</text><text x="450" y="80" fill="#0f172a">skills/</text><text x="450" y="102" fill="#0f172a">├── docs/create-lib-docs/SKILL.md</text><text x="450" y="124" fill="#0f172a">├── personas/prodigy/SKILL.md</text><text x="450" y="146" fill="#0f172a">├── scrolls/</text><text x="450" y="168" fill="#0f172a">│ ├── README.md</text><text x="450" y="190" fill="#0f172a">│ ├── scrolls-help/SKILL.md</text><text x="450" y="212" fill="#0f172a">│ └── …</text><text x="450" y="234" fill="#0f172a">└── stata/stata-recipes/SKILL.md</text><text x="450" y="270" fill="#1e3a8a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">The repo&apos;s skills/ folder, with group files.</text><text x="20" y="340" fill="#475569" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">npx skills add finds the same 13 skills in either layout. Choose with --flat / --nested or AISKILLS_LAYOUT.</text></svg>