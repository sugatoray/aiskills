<style>
/* Layout: sticky header with section tabs; three columns below — page nav | article | on-this-page TOC. */

  --surface-2: #e6eded;
  --fg: #172225;

  --code-bg: #f0f4f4;

  --header-h: 104px;
}
@media (prefers-color-scheme: dark) {

    --line: #26373b; --accent: #5cc6cf; --accent-soft: #163a3e; --accent-fg: #062326;
    --code-bg: #121d20; --code-fg: #dbe6e6; --tok-kw: #d39af5; --tok-str: #9fd88a; --tok-num: #f2b36b;
    --tok-com: #6f8589; --tok-attr: #5cc6cf; --tok-fn: #8fb4ff; --note: #8fb4ff; --tip: #8fd17a;

:root[data-theme="dark"] {

  --line: #26373b; --accent: #5cc6cf; --accent-soft: #163a3e; --accent-fg: #062326;
  --code-bg: #121d20; --code-fg: #dbe6e6; --tok-kw: #d39af5; --tok-str: #9fd88a; --tok-num: #f2b36b;

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 16px); }
body {

  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-row { display: flex; align-items: center; gap: 12px; height: 58px; max-width: 1440px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
.brand-ver {
  font-family: var(--font-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line);
  border-radius: 999px; padding: 1px 8px;
}
.cmd {
  font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; min-width: 0;
}
.cmd b { color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.search { position: relative; flex: 0 1 260px; min-width: 0; }
.search input {

}

}

.icon-btn svg { width: 18px; height: 18px; }

.menu-btn { display: none; }
.theme-btn .sun { display: none; }
:root[data-effective="dark"] .theme-btn .sun { display: block; }
:root[data-effective="dark"] .theme-btn .moon { display: none; }

.tabs {

  height: 45px; align-items: stretch;
}

.tab {
  border: 0; background: none; padding: 0 14px; cursor: pointer; font-size: 14.5px; font-weight: 500;
  color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; display: flex;
  align-items: center; gap: 8px;
}

.tab .count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-weight: 400; }

/* Three-column body */
.shell {
  display: grid; grid-template-columns: 260px minmax(0, 1fr) 230px; gap: 40px; max-width: 1440px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.side, .toc {

  padding-block: 28px 40px; scrollbar-width: thin;
}
.side-label, .toc-label {

  margin: 0 0 10px 10px;
}
.side-group + .side-group { margin-top: 22px; }
.nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.nav-list a {
  display: block; padding: 6px 10px; border-radius: 6px; color: var(--fg); text-decoration: none;
  font-size: 14.5px; line-height: 1.4;
}
.nav-list a:hover { background: var(--surface); }
.nav-list a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-list.other a { color: var(--muted); font-size: 14px; }
.step { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-right: 6px; }
.nav-list a[aria-current="page"] .step { color: var(--accent); }
.results .hit { display: block; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--fg); }
.results .hit:hover { background: var(--surface); }
.results .hit strong { display: block; font-size: 14px; }
.results .hit span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.results mark { background: var(--accent-soft); color: var(--accent); border-radius: 2px; }
.empty { color: var(--muted); font-size: 14px; padding: 0 10px; }

.toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
.toc a {
  display: block; padding: 4px 12px; margin-left: -1px; border-left: 2px solid transparent; color: var(--muted);
  text-decoration: none; font-size: 13.5px; line-height: 1.45;
}
.toc a.lvl3 { padding-left: 24px; font-size: 13px; }
.toc a:hover { color: var(--fg); }
.toc a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.toc-actions { margin-top: 18px; display: grid; gap: 6px; padding-left: 12px; font-size: 13px; }
.toc-actions a { color: var(--muted); text-decoration: none; }
.toc-actions a:hover { color: var(--accent); }

/* Article */
main { min-width: 0; padding-block: 28px 80px; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.doc { max-width: 780px; }
.doc h1 {

}

.doc h4 { font-size: 16px; margin: 24px 0 6px; }
.doc h2 code, .doc h3 code { font-size: .88em; }
.doc :is(h2, h3, h4) { position: relative; }
.doc .anchor {

.doc p, .doc ul, .doc ol { margin: 0 0 16px; }
.doc ul, .doc ol { padding-left: 24px; }
.doc li + li { margin-top: 4px; }
.doc li > ul, .doc li > ol { margin: 4px 0 0; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
.doc strong { font-weight: 650; }
.doc :not(pre) > code {
  font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); padding: .12em .38em;
  border-radius: 5px; overflow-wrap: anywhere;
}
.doc a code { color: var(--accent); }
.doc img {
  display: block; max-width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line);
  box-shadow: var(--shadow); margin: 8px 0;
}
.figure-wrap { overflow-x: auto; margin: 0 0 18px; }

.codeblock { position: relative; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--code-bg); }
.codeblock .lang {
  position: absolute; top: 0; right: 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  padding: 6px 10px; text-transform: lowercase; pointer-events: none; transition: opacity .15s;
}
.codeblock .copy {
  position: absolute; top: 6px; right: 6px; border: 1px solid var(--line); background: var(--bg);
  border-radius: 6px; font-size: 12px; padding: 3px 9px; cursor: pointer; opacity: 0; transition: opacity .15s;
}
.codeblock:hover .copy, .codeblock .copy:focus-visible { opacity: 1; }
.codeblock:hover .lang { opacity: 0; }
.codeblock.output { background: transparent; border-style: dashed; }
.codeblock.output::before {
  content: "Output"; display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); padding: 10px 16px 0;
}
.doc pre {
  margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 13.5px;
  line-height: 1.6; color: var(--code-fg); tab-size: 4;
}
.codeblock.output pre { padding-top: 4px; }
.codeblock:has(.lang) pre { padding-top: 28px; }
.doc pre, .doc code, .cmd { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
.doc pre code { font-family: inherit; background: none; padding: 0; }
.hljs-keyword, .hljs-built_in, .hljs-selector-tag, .hljs-literal { color: var(--tok-kw); }
.hljs-string, .hljs-regexp, .hljs-addition { color: var(--tok-str); }

.hljs-comment, .hljs-quote, .hljs-meta { color: var(--tok-com); font-style: italic; }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-section, .hljs-property { color: var(--tok-attr); }
.hljs-title, .hljs-title\.function_, .hljs-function { color: var(--tok-fn); }

.table-wrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 10px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.doc th, .doc td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.doc th { background: var(--surface); font-weight: 650; font-size: 13.5px; white-space: nowrap; }
.doc tr:last-child td { border-bottom: 0; }
.doc td code { white-space: nowrap; }

.doc blockquote { margin: 0 0 18px; padding: 4px 18px; border-left: 3px solid var(--line); color: var(--muted); }
.alert { margin: 0 0 18px; padding: 12px 16px 2px; border: 1px solid var(--line); border-left: 4px solid var(--a); border-radius: 8px; background: var(--surface); }
.alert-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--a); margin-bottom: 4px; }
.alert-title svg { width: 16px; height: 16px; }
.alert p { margin-bottom: 10px; }
.alert.note { --a: var(--note); } .alert.tip { --a: var(--tip); } .alert.important { --a: var(--important); }
.alert.warning { --a: var(--warning); } .alert.caution { --a: var(--caution); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 56px; max-width: 780px; }
.pager a {
  display: block; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; text-decoration: none;
  color: var(--fg); min-width: 0;
}
.pager a:hover { border-color: var(--accent); }
.pager .dir { display: block; font-size: 12px; color: var(--muted); }
.pager .t { display: block; font-weight: 600; color: var(--accent); overflow-wrap: anywhere; }
.pager .next { text-align: right; grid-column: 2; }
.loading, .failed { color: var(--muted); padding: 40px 0; }

.scrim { display: none; }
.mobile-toc { display: none; }

@media (max-width: 1180px) {

  .toc { display: none; }

  .mobile-toc summary { cursor: pointer; padding: 10px 14px; font-size: 14px; font-weight: 600; }
  .mobile-toc ol { list-style: none; margin: 0; padding: 0 14px 12px; columns: 2; column-gap: 24px; }
  .mobile-toc a { display: block; font-size: 13.5px; padding: 3px 0; color: var(--muted); text-decoration: none; break-inside: avoid; }

}
@media (max-width: 860px) {

  .menu-btn { display: inline-grid; }

  .doc .anchor { display: none; }
}
@media (max-width: 560px) {
  .search { flex-basis: auto; flex-grow: 1; }
  .search kbd { display: none; }
  .search input::placeholder { color: transparent; }
  .brand-ver { display: none; }
  .mobile-toc ol { columns: 1; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .next { grid-column: 1; }
  .doc h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* Theme menu (the gear at the top right) */
.top-row { position: relative; }
.skin-menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; width: 340px; max-width: calc(100vw - 32px);
  max-height: min(72vh, 600px); overflow-y: auto; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 16px 48px rgba(0, 0, 0, .22); padding: 6px; display: grid; gap: 2px;
}
.skin-menu[hidden] { display: none; }
.skin-menu-head { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); padding: 6px 10px 8px; }
.skin-item {
  display: grid; grid-template-columns: auto 1fr auto; gap: 1px 10px; align-items: center; width: 100%; text-align: left;
  background: none; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; color: var(--fg);
}
.skin-item:hover, .skin-item:focus-visible { background: var(--surface-2); outline: none; }
.skin-item:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.skin-item .sw { grid-row: span 2; display: flex; }
.skin-item .sw i { display: block; width: 9px; height: 26px; }
.skin-item .sw i:first-child { border-radius: 5px 0 0 5px; } .skin-item .sw i:last-child { border-radius: 0 5px 5px 0; }
.skin-item .nm { font-weight: 600; font-size: 14px; }
.skin-item .ds { grid-column: 2 / 4; font-size: 12px; line-height: 1.4; color: var(--muted); }

/* ── Lights Out: the page itself changes, not only its colours ── */
:root[data-skin="lightsout"] { --shadow: none; }
:root[data-skin="lightsout"][data-effective="dark"] { --note: #1d9bf0; --tip: #00ba7c; --important: #a78bfa; --warning: #ffd400; --caution: #f4212e; }
:root[data-skin="lightsout"] body {
  background: radial-gradient(1100px 380px at 50% -220px, color-mix(in srgb, var(--accent) 14%, transparent), transparent 72%) no-repeat, var(--bg); }
:root[data-skin="lightsout"] .top {
  background: color-mix(in srgb, var(--bg) 72%, transparent); -webkit-backdrop-filter: saturate(180%) blur(14px); backdrop-filter: saturate(180%) blur(14px); }
:root[data-skin="lightsout"] .brand-name { letter-spacing: -.04em; font-weight: 700; }
:root[data-skin="lightsout"] .brand-ver, :root[data-skin="lightsout"] .search kbd { border-radius: 6px; background: var(--surface); }
:root[data-skin="lightsout"] .search input { border-radius: 999px; background: var(--surface-2); border-color: transparent; }
:root[data-skin="lightsout"] .search input:focus { background: var(--bg); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
:root[data-skin="lightsout"] .icon-btn { border-radius: 999px; background: transparent; border-color: var(--line); }
:root[data-skin="lightsout"] .icon-btn:hover { background: var(--surface-2); border-color: var(--line); }
:root[data-skin="lightsout"] .tab { position: relative; border-bottom: 0; font-weight: 500; transition: background .15s, color .15s; }
:root[data-skin="lightsout"] .tab:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
:root[data-skin="lightsout"] .tab[aria-selected="true"] { font-weight: 700; }
:root[data-skin="lightsout"] .tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 4px; border-radius: 999px; background: var(--accent); }
:root[data-skin="lightsout"] .tab .count { border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; line-height: 16px; }
:root[data-skin="lightsout"] .nav-list a { border-radius: 8px; color: var(--muted); }
:root[data-skin="lightsout"] .nav-list a:hover { background: var(--surface-2); color: var(--fg); }
:root[data-skin="lightsout"] .nav-list a[aria-current="page"] { background: var(--surface-2); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
:root[data-skin="lightsout"] .nav-list a[aria-current="page"] .step { color: var(--accent); }
:root[data-skin="lightsout"] .side-label, :root[data-skin="lightsout"] .toc-label { letter-spacing: .02em; text-transform: none; font-size: 13px; font-weight: 600; color: var(--fg); }
:root[data-skin="lightsout"] .toc a.active { border-left-color: var(--fg); color: var(--fg); }
:root[data-skin="lightsout"] .doc h1 { font-weight: 700; letter-spacing: -.045em; line-height: 1.05; }
:root[data-skin="lightsout"] .doc h2 { font-weight: 650; letter-spacing: -.03em; border-top: 0; padding-top: 8px; }
:root[data-skin="lightsout"] .doc h3 { letter-spacing: -.02em; }
:root[data-skin="lightsout"] .doc a { text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }
:root[data-skin="lightsout"] .doc a:hover { text-decoration-color: var(--accent); }
:root[data-skin="lightsout"] .doc :not(pre) > code { background: var(--surface-2); border: 1px solid color-mix(in srgb, var(--line) 55%, transparent); padding: .05em .36em; border-radius: 6px; }
:root[data-skin="lightsout"] .codeblock { border-radius: 12px; transition: border-color .2s, box-shadow .2s; }
:root[data-skin="lightsout"] .codeblock:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 10%, transparent); }
:root[data-skin="lightsout"] .codeblock .copy { border-radius: 999px; background: var(--surface-2); }
:root[data-skin="lightsout"] .codeblock.output { background: color-mix(in srgb, var(--surface) 60%, transparent); border-style: solid; }
:root[data-skin="lightsout"] .codeblock.output::before { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; }
:root[data-skin="lightsout"] .table-wrap { border-radius: 12px; }
:root[data-skin="lightsout"] .doc th { background: transparent; color: var(--muted); font-weight: 500; }
:root[data-skin="lightsout"] .doc tr:hover td { background: color-mix(in srgb, var(--fg) 3%, transparent); }
:root[data-skin="lightsout"] .alert { border-left-width: 1px; border-radius: 12px; background: color-mix(in srgb, var(--a) 7%, var(--bg)); border-color: color-mix(in srgb, var(--a) 35%, var(--line)); }
:root[data-skin="lightsout"] .pager a { border-radius: 14px; transition: background .15s, border-color .15s; }
:root[data-skin="lightsout"] .pager a:hover { background: var(--surface); border-color: var(--line); }
:root[data-skin="lightsout"] .hero { border-radius: 16px; border-color: var(--line); }
:root[data-skin="lightsout"] .crumbs { font-size: 13px; }
@media (prefers-reduced-motion: reduce) { :root[data-skin="lightsout"] * { transition: none !important; } }

/* Landing-page banner: the static banner from docs/banner/aiskills-banner.html, drawn at its native
   1280x640 and scaled to the column width by the script. */
.hero { position: relative; max-width: 780px; aspect-ratio: 2 / 1; overflow: hidden; margin: 0 0 24px;
        border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.hero[hidden] { display: none; }
.hero-scaler { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; transform-origin: 0 0; }
  #banner {
    --bg: #0d1517;
    --fg: #e8f0f0;
    --muted: #93a6a9;
    --line: rgba(147, 166, 169, .22);
    --teal: #5cc6cf;
    --violet: #d39af5;
    --blue: #8fb4ff;
    --green: #9fd88a;
    --amber: #f2b36b;
    --coral: #ff8a7a;
    --term-bg: #0a1113;
    --term-fg: #dbe6e6;
    --term-line: #26373b;

    position: relative; width: 1280px; height: 640px; overflow: hidden;
    color: var(--fg); font-family: "Public Sans", system-ui, sans-serif;
    background: var(--bg);
  }
  /* Light ink, used when exporting on white (and in "Ink: dark" mode). */
  #banner.ink-dark {
    --fg: #122023; --muted: #4c5f63; --line: rgba(18, 32, 35, .16);
    --teal: #0b6d77; --violet: #8a3ab9; --blue: #2557b8; --green: #2c7a2c; --amber: #9a6200; --coral: #b42318;
  }
  #banner .bg-layer { position: absolute; inset: 0; pointer-events: none; }
  #banner .bg-glow {
    background:
      radial-gradient(620px 420px at 8% 0%, rgba(92, 198, 207, .22), transparent 70%),
      radial-gradient(560px 460px at 100% 100%, rgba(211, 154, 245, .20), transparent 70%),
      radial-gradient(420px 300px at 70% 10%, rgba(143, 180, 255, .10), transparent 70%);
  }
  #banner .bg-grid {
    background-image: radial-gradient(rgba(147, 166, 169, .20) 1px, transparent 1.2px);
    background-size: 24px 24px;
    -webkit-mask-image: linear-gradient(115deg, transparent 10%, #000 55%, transparent 95%);
            mask-image: linear-gradient(115deg, transparent 10%, #000 55%, transparent 95%);
  }
  /* Export background overrides */
  #banner.bg-white { background: #ffffff; }
  #banner.bg-black { background: #000000; }
  #banner.bg-transparent { background: transparent; }
  #banner.bg-white .bg-layer, #banner.bg-black .bg-layer, #banner.bg-transparent .bg-layer { display: none; }

  #banner .content {
    position: absolute; inset: 0; padding: 64px 72px 56px;
    display: grid; grid-template-columns: 1fr 520px; grid-template-rows: 1fr auto; column-gap: 48px; row-gap: 36px;
  }
  #banner .left { display: flex; flex-direction: column; justify-content: center; min-width: 0; }

  #banner .badges { display: flex; gap: 8px; margin-bottom: 26px; }
  #banner .badge {
    font: 500 13px/1 "JetBrains Mono", monospace; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; white-space: nowrap;
  }
  #banner .badge b { color: var(--teal); font-weight: 700; }

  #banner .wordmark { display: flex; align-items: center; gap: 20px; }
  #banner .mark {
    width: 88px; height: 88px; border-radius: 22px; flex: none; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--teal), var(--violet));
    box-shadow: 0 10px 30px rgba(92, 198, 207, .25);
  }
  #banner .mark span { font: 800 40px/1 "JetBrains Mono", monospace; color: #071a1d; letter-spacing: -2px; transform: translateY(-2px); }
  #banner .name {
    font: 800 108px/0.95 "JetBrains Mono", monospace; letter-spacing: -5px; margin: 0;
    color: var(--fg);
  }
  #banner .name .grad {
    background: linear-gradient(90deg, var(--teal), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  #banner .tagline {
    font: 700 38px/1.12 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -.5px;
    margin: 26px 0 0; max-width: 620px;
  }
  #banner .sub { font-size: 19px; line-height: 1.45; color: var(--muted); margin: 14px 0 0; max-width: 600px; }

  #banner .install {
    margin-top: 28px; align-self: flex-start; display: inline-flex; align-items: center; gap: 12px;
    font: 500 19px/1 "JetBrains Mono", monospace; color: var(--term-fg); font-variant-ligatures: none;
    background: var(--term-bg); border: 1px solid var(--term-line); border-radius: 12px; padding: 14px 18px;
  }
  #banner .install .dollar { color: #5cc6cf; }
  /* Option A: one box, a line per command. Option B: a chip per command, stacked. */
  #banner .install-box { flex-direction: column; align-items: flex-start; gap: 10px; }
  #banner .install-box .line { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  #banner .install-chips { margin-top: 28px; align-self: flex-start; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  #banner .install-chips .install { margin-top: 0; }

  /* Terminal */
  #banner .terminal {
    align-self: center; background: var(--term-bg); border: 1px solid var(--term-line); border-radius: 16px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .02) inset; overflow: hidden;
    font: 400 15.5px/1.7 "JetBrains Mono", monospace; color: var(--term-fg);
  }
  #banner .term-bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--term-line); }
  #banner .term-bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  #banner .term-bar .t { margin-left: 10px; color: #93a6a9; font-size: 13px; }
  #banner .term-body { padding: 18px 20px 20px; white-space: pre; font-variant-ligatures: none; }
  #banner .term-body .p { color: #5cc6cf; }
  #banner .term-body .f { color: #d39af5; }
  #banner .term-body .s { color: #9fd88a; }
  #banner .term-body .c, #banner .install .cmt { color: #6f8386; white-space: pre; }
  #banner .term-body .h { color: #8fb4ff; font-weight: 700; }
  #banner .term-body .ok { color: #9fd88a; }
  #banner .term-body .cursor { display: inline-block; width: 9px; height: 18px; background: #5cc6cf; vertical-align: -3px; }

  /* Harness row */
  #banner .harnesses { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
  #banner .harnesses .label { font: 500 14px/1 "JetBrains Mono", monospace; color: var(--muted); margin-right: 4px; white-space: nowrap; }
  #banner .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  #banner .pill {
    display: inline-flex; align-items: center; gap: 9px; white-space: nowrap;
    font: 500 16px/1 "JetBrains Mono", monospace; color: var(--fg);
    border: 1px solid var(--line); border-radius: 999px; padding: 9px 15px 9px 12px;
  }
  #banner .pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dot, var(--teal)); }
  #banner .pill:nth-child(6n+1) { --dot: var(--teal); }
  #banner .pill:nth-child(6n+2) { --dot: var(--violet); }
  #banner .pill:nth-child(6n+3) { --dot: var(--blue); }
  #banner .pill:nth-child(6n+4) { --dot: var(--green); }
  #banner .pill:nth-child(6n+5) { --dot: var(--amber); }
  #banner .pill:nth-child(6n+6) { --dot: var(--coral); }
  #banner .harnesses .url { margin-left: auto; font: 500 15px/1 "JetBrains Mono", monospace; color: var(--muted); white-space: nowrap; }

  #banner .term-body .o { color: #93a6a9; }
  #banner .name { letter-spacing: -6px; }
  #banner .pills { gap: 8px; }
  #banner .pill { font-size: 15px; padding: 8px 13px 8px 11px; }

const DATA = {"tabs":[{"id":"home","label":"Home","pages":["README.md"]},{"id":"getting-started","label":"Getting started","pages":["getting-started/why-aiskills.md","getting-started/installation.md","getting-started/quickstart.md"]},{"id":"skills","label":"Skills","pages":["skills/README.md","skills/artwallbg.md","skills/commentdrop.md","skills/create-issues-update-pr.md","skills/create-lib-docs.md","skills/dynamic-promo-video.md","skills/network-flow.md","skills/prodigy.md","skills/scrolls-help.md","skills/scrolls-hide.md","skills/scrolls-remove.md","skills/scrolls-restore.md","skills/scrolls-setup.md","skills/scrolls-unhide.md","skills/scrolls-update.md","skills/stata-recipes.md"]},{"id":"tutorial","label":"Tutorial","pages":["tutorial/01-install-a-group.md","tutorial/02-pick-skills-and-agents.md","tutorial/03-install-into-a-project.md","tutorial/04-add-external-skills.md","tutorial/05-uninstall.md"]},{"id":"guides","label":"Guides","pages":["guides/set-defaults.md","guides/use-experimental-sync.md","guides/keep-the-nested-layout.md","guides/run-npx-skills-directly.md","guides/remove-everything.md","guides/use-from-an-agent.md","guides/choose-the-skills-cli-version.md","guides/leave-files-out.md"]},{"id":"concepts","label":"Concepts","pages":["concepts/how-it-works.md","concepts/skill-groups.md","concepts/layouts.md","concepts/bundled-and-external.md","concepts/security.md","concepts/install-count.md"]},{"id":"reference","label":"Reference","pages":["reference/cli.md","reference/patterns.md","reference/environment.md","reference/files.md","reference/skillsignore.md","reference/errors.md"]},{"id":"faq","label":"FAQ","pages":["faq.md"]},{"id":"license","label":"License","pages":["license.md"]}],"pages":[{"id":"home","path":"README.md","title":"@sugatoray-ai/aiskills","tab":"home","md":"# @sugatoray-ai/aiskills\n\n`@sugatoray-ai/aiskills` installs Sugato Ray's agent skills (scrolls, stata, personas, diagrams, docs, development, video) into Claude Code, Codex, Cursor and every other agent the [`skills`](https://www.npmjs.com/package/skills) CLI supports.\n\nThe skills ship inside the npm package, are saved to `~/.config/sugatoray/aiskills/skills/`, and are registered with your agents by `npx skills add`. The `aiskills` command then installs, lists and removes them by name, by group or by pattern, and with `--route` it manages skills from other sources too.\n\n```bash\nnpm install -g @sugatoray-ai/aiskills\naiskills install\n```\n\nThat is all most people need: `npm install` only adds the `aiskills` command, and `aiskills install` saves the skills and registers every one with the agents it finds. To choose a group and an agent yourself:\n\n<!-- verify -->\n```bash\naiskills install -G scrolls -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: scrolls-help, scrolls-hide, scrolls-remove, scrolls-restore, scrolls-setup, scrolls-unhide, scrolls-update\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill scrolls-help --skill scrolls-hide --skill scrolls-remove --skill scrolls-restore --skill scrolls-setup --skill scrolls-unhide --skill scrolls-update --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\n`npx skills` then prints its own progress and installs the seven skills for Claude Code.\n\n## Features\n\n- **Skills in one package**: 15 skills in 8 groups, at the version you installed.\n- **Nothing happens behind your back**: `npm install` runs no install step. Your agents change only when you run `aiskills install`, so it works the same under npm, pnpm and bun.\n- **Counted on skills.sh**: installs through `aiskills` count towards each skill's installs on skills.sh, like `npx skills add` does; off with `--no-stats`. See [The skills.sh install count](concepts/install-count.md).\n- **Pick what you want**: by skill (`-s`), by group (`-G scrolls`), by agent (`-a codex`), with glob patterns (`-s 'scrolls-*'`), from a list (`-i`), or for the agents you picked last time (`-l`).\n- **Global or per project**: `-g` (default) or `-p`.\n- **Clean uninstall**: full, partial, per agent or per project, with `--dry-run` and `--purge`.\n- **External skills too**: `--route` (or the `aix` command) looks up and installs skills that aren't bundled.\n- **Two layouts**: flat (one folder per skill) or `--nested` (the repo's own folders).\n- **Check your setup and new releases**: `aiskills info` shows versions, folders and every setting with where it comes from; `aiskills rel` lists the latest releases on npm, with download counts and a chart via `--downloads`.\n- **One-step upgrades**: `aiskills upgrade` installs the latest aiskills and updates the skills your agents have; `--check` only looks.\n- **Short commands**: `ais` is `aiskills`; `aix` is `aiskills --route`; `i`, `r`, `ls`, `g`, `f`, `p`, `h` are aliases.\n- **Safe by default**: a pinned `skills` CLI, checked registry results, and no runtime dependencies.\n\n## Documentation\n\n### Getting started\n\n- [Why aiskills](getting-started/why-aiskills.md): what the package adds on top of `npx skills`, and when you don't need it.\n- [Installation](getting-started/installation.md): install with npm, run `aiskills install`, and check it worked.\n- [Quickstart](getting-started/quickstart.md): see the groups, install one for one agent, check it, and remove it.\n\n### Skills\n\n<!-- skills:start -->\n- [Bundled skills](skills/README.md): every skill in the package, by group, with what it does.\n- [artwallbg](skills/artwallbg.md): Create a vivid illustrated image of a subject in front of a huge spray-painted wall.\n- [commentdrop](skills/commentdrop.md): Add simulated social-media comment overlays to a still image in the floating comment-drop style used in video editing.\n- [create-issues-update-pr](skills/create-issues-update-pr.md): Files GitHub issue(s) for work already done (or about to be done) on a branch/PR, grouping related issues under a parent epic when there's a genuine…\n- [create-lib-docs](skills/create-lib-docs.md): Writes top-grade, verified user documentation for a library, CLI or framework as a folder of Markdown pages plus SVG diagrams, structured the way FastAPI,…\n- [dynamic-promo-video](skills/dynamic-promo-video.md): Build a short narrated promo/intro video (HTML scenes, zoom/tilt, voiceover, music) for a library, app or product.\n- [network-flow](skills/network-flow.md): Create working interactive network and architecture diagrams with moving packets, orthogonal connections, scenario playback, and selectable nodes.\n- [prodigy](skills/prodigy.md): Act as the top performer in a given role or field and produce a five-part playbook: (1) how they understand the problem, constraints, stakeholders and…\n- [scrolls-help](skills/scrolls-help.md): Shows a crisp, example-driven reference for the whole scrolls skill family (/scrolls-setup, /scrolls-update, /scrolls-hide, /scrolls-unhide,…\n- [scrolls-hide](skills/scrolls-hide.md): Converts an already-set-up docs/scrolls/ working-memory folder from visible (scrolls) to dotfile-hidden (.scrolls), renaming the folder and rewriting the…\n- [scrolls-remove](skills/scrolls-remove.md): Removes a docs/.scrolls/ (or docs/scrolls/) project-memory system from a git repository — the exact opposite of /scrolls-setup.\n- [scrolls-restore](skills/scrolls-restore.md): Restores a docs/.scrolls/ (or docs/scrolls/) project-memory system from git history — the counterpart to /scrolls-remove.\n- [scrolls-setup](skills/scrolls-setup.md): Sets up a minimal docs/.scrolls/ working-memory system for a project — a small set of cross-session memory files (STARTER.md, SPEC.md, HANDOFF.md,…\n- [scrolls-unhide](skills/scrolls-unhide.md): Converts an already-set-up docs/.scrolls/ working-memory folder from dotfile-hidden (.scrolls) to visible (scrolls), renaming the folder and rewriting the…\n- [scrolls-update](skills/scrolls-update.md): Updates an existing docs/.scrolls/ project-memory system (STARTER.md, SPEC.md, HANDOFF.md, GAP_ANALYSIS.md, GAP_CONTEXT.md, PLAN.md, WISDOM.md, and any…\n- [stata-recipes](skills/stata-recipes.md): Turns a plain-language description of a data/statistics task into correct, runnable Stata code — a .do file or command sequence, not pseudocode.\n<!-- skills:end -->\n\n### Tutorial\n\n- [1. Install a group](tutorial/01-install-a-group.md): list the groups and install one for one agent.\n- [2. Pick skills and agents](tutorial/02-pick-skills-and-agents.md): choose skills by name and pattern, and send them to several agents.\n- [3. Install into a project](tutorial/03-install-into-a-project.md): install skills for one project instead of for your user.\n- [4. Add external skills](tutorial/04-add-external-skills.md): install skills that aren't bundled with `--route` and `aix`.\n- [5. Uninstall](tutorial/05-uninstall.md): preview and remove some or all of the skills.\n\n### How-to guides\n\n- [Set default choices](guides/set-defaults.md): make skills, agents and scope the defaults with `AISKILLS_*` variables.\n- [Use the package with `npx skills experimental_sync`](guides/use-experimental-sync.md): install the skills from a project's `node_modules`, pinned by your lockfile.\n- [Keep the repo's nested layout](guides/keep-the-nested-layout.md): browse or edit the skills in the folders they have in the repo.\n- [Run any `npx skills` command](guides/run-npx-skills-directly.md): pass arguments straight to `npx skills`, with `:root` for the install folder.\n- [Remove everything](guides/remove-everything.md): uninstall the skills, the folder and the npm package, in the right order.\n- [Use aiskills from an AI agent or a script](guides/use-from-an-agent.md): run it non-interactively, read its output and exit codes, and handle failures.\n- [Choose the `skills` CLI version](guides/choose-the-skills-cli-version.md): run a different `skills` release than the pinned one.\n- [Leave files out of the package](guides/leave-files-out.md): for maintainers: keep files or whole skills out with `.skillsignore`.\n\n### Concepts\n\n- [How aiskills works](concepts/how-it-works.md): the package, the install folder and `npx skills`, and who owns what.\n- [Skill groups](concepts/skill-groups.md): where groups and their aliases come from, and how membership is worked out.\n- [Layouts: flat and nested](concepts/layouts.md): the two shapes of the install folder and how the choice is made.\n- [Bundled and external skills](concepts/bundled-and-external.md): what `--route` changes for install, uninstall and listing.\n- [Security model](concepts/security.md): what the package touches, and the protections that are tested.\n- [The skills.sh install count](concepts/install-count.md): how installs through aiskills are counted on skills.sh, and how to turn it off.\n\n### Reference\n\n- [CLI](reference/cli.md): every command, alias and option of `aiskills`, `ais` and `aix`.\n- [Patterns](reference/patterns.md): the glob syntax for `-s`, `-G` and `-a`, and what each matches against.\n- [Environment variables](reference/environment.md): every variable `aiskills` reads.\n- [Files and schemas](reference/files.md): what is written where, and the fields of `aiskills.json`, `layout.json` and `npx skills list --json`.\n- [`.skillsignore`](reference/skillsignore.md): the rule syntax for leaving files out of the package.\n- [Errors and exit codes](reference/errors.md): every error and warning, with its cause and fix.\n\n### Help\n\n- [FAQ and troubleshooting](faq.md): answers to common questions and fixes for common problems.\n\n### License\n\n- [License](license.md): the package's license, and a table of the license each bundled skill uses.\n\n## Ways to read these docs\n\n- **These Markdown pages**, on GitHub or in your editor.\n- **One web page** with tabs, search and 11 colour themes, online at <https://sugatoray.github.io/aiskills/>, or open `docs/docsite/index.html` (in the repo, next to this page) in a browser. The gear at its top right picks a theme (Lights Out by default), and the moon/sun button switches light and dark.\n- **For AI agents:** [`llms.txt`](llms.txt) (an index of every page) or [`llms-full.txt`](llms-full.txt) (every page in one file).\n\nAlso see the package [CHANGELOG](../../CHANGELOG.md) and [SECURITY.md](../../SECURITY.md).\n"},{"id":"getting-started-why-aiskills","path":"getting-started/why-aiskills.md","title":"Why aiskills","tab":"getting-started","md":"# Why aiskills\n\n`aiskills` gives you Sugato Ray's skills as one versioned npm package, and lets you install them by group or pattern instead of one by one.\n\nThe [`skills`](https://www.npmjs.com/package/skills) CLI (`npx skills`) already installs agent skills from GitHub, URLs and local folders into Claude Code, Codex, Cursor and many other agents. `aiskills` doesn't replace it. It sits on top of it and adds what `npx skills` doesn't know about this collection of skills.\n\n## What it adds\n\n| You want to | With `npx skills` alone | With `aiskills` |\n| --- | --- | --- |\n| Get all the skills | `npx skills add sugatoray/aiskills --global` (latest `master`) | `npm install -g @sugatoray-ai/aiskills`, then `aiskills install` (a released, versioned set) |\n| Install a related set | List each skill with `--skill` | `-G scrolls` (groups come from the repo's `marketplace.json`) |\n| Pick by pattern | Not supported | `-s 'scrolls-*'`, `-a 'claude*'` |\n| Remove only these skills | Name each one; same-named skills from other sources go too | `aiskills uninstall` removes exactly what it installed |\n| Work offline after install | Needs GitHub for each add | Skills are already on disk in `~/.config/sugatoray/aiskills` |\n| Install other people's skills too | Yes | Yes, with `--route` or `aix` |\n\n## When you don't need it\n\n- You want only one or two skills and don't mind naming them: `npx skills add sugatoray/aiskills --skill <name> --global` is enough.\n- You want skills that track the repo's `master` branch, not releases.\n- You install skills only per project from `node_modules`: then you need the package, but not the `aiskills` command. See [Use the package with `npx skills experimental_sync`](../guides/use-experimental-sync.md).\n\n## What it doesn't do\n\n- It doesn't copy skills into agent folders itself. `npx skills` does that, and keeps its own record of what is installed.\n- It doesn't install Claude Code plugins. It reads the repo's `.claude-plugin/marketplace.json` only to group the skills.\n- It doesn't update skills by itself. Install a newer package version (`npm install -g @sugatoray-ai/aiskills@latest`) and run `aiskills install` again to get newer skills.\n\nSee also: [How aiskills works](../concepts/how-it-works.md) · [Installation](installation.md)\n"},{"id":"getting-started-installation","path":"getting-started/installation.md","title":"Installation","tab":"getting-started","md":"# Installation\n\nInstall the `aiskills` command with npm, then run `aiskills install` to save the skills and register them with your agents.\n\n**You'll need:** Node.js 18.17 or newer, and npm. `npx` (which comes with npm) must be able to reach the npm registry the first time it downloads the `skills` CLI.\n\n## Install\n\n```bash\nnpm install -g @sugatoray-ai/aiskills\naiskills install\n```\n\nThe first command only installs the package and its commands. It runs no install step: nothing is written to your home folder and no agent is changed. pnpm (`pnpm add -g`) and bun (`bun add -g`) work the same way.\n\n`aiskills install`:\n\n1. saves the skills to `~/.config/sugatoray/aiskills/skills/`, replacing any older copy, and\n2. runs `npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill '*' --yes`, which installs every skill for every agent `npx skills` detects (see [which agents](../faq.md#does-aiskills-install-put-the-skills-in-every-agents-folder)). To pick the skills and agents from a list instead, run `aiskills install -i`.\n\nTo choose, pass options. For example, only the scrolls group, only for Claude Code:\n\n```bash\naiskills install -G scrolls -a claude-code\n```\n\nTo save the skills without registering them, run `aiskills sync`. Every option is in the [CLI reference](../reference/cli.md).\n\n## Check it worked\n\nThe package adds three commands: `aiskills`, `ais` (the same, shorter) and `aix` (the same as `aiskills --route`).\n\n<!-- verify -->\n```bash\naiskills --version\naiskills path\n```\n\n```text\n0.9.0\n~/.config/sugatoray/aiskills\n```\n\n`aiskills installed` lists the skills that `npx skills` has recorded as installed from that folder. See [Quickstart](quickstart.md).\n\n## Without a global install\n\n`npx` runs the package's `aiskills` command without a global install:\n\n```bash\nnpx @sugatoray-ai/aiskills install -G scrolls\n```\n\n## Update\n\nInstall the newer version, then run `aiskills install` again. It replaces `~/.config/sugatoray/aiskills/skills/` with the new skills and runs `npx skills add` again:\n\n```bash\nnpm install -g @sugatoray-ai/aiskills@latest\naiskills install\n```\n\nIf you had chosen particular skills, agents or flags, run that `aiskills install ...` command instead.\n\n## Remove\n\nRemove the skills first, then the package:\n\n```bash\naiskills uninstall --purge\nnpm uninstall -g @sugatoray-ai/aiskills\n```\n\nSee [Remove everything](../guides/remove-everything.md).\n\nSee also: [Quickstart](quickstart.md) · [Set default choices](../guides/set-defaults.md)\n"},{"id":"getting-started-quickstart","path":"getting-started/quickstart.md","title":"Quickstart","tab":"getting-started","md":"# Quickstart\n\nIn five commands: see what's in the package, install a group for one agent, check it, and remove it.\n\n**You'll need:** the package installed ([Installation](installation.md)).\n\n## 1. See the groups\n\n```bash\naiskills groups\n```\n\nEach group lists its alias and its skills. The full output is in [Tutorial step 1](../tutorial/01-install-a-group.md).\n\n## 2. Install a group for one agent\n\n<!-- verify -->\n```bash\naiskills install -G personas -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: prodigy\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill prodigy --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\n`npx skills` then prints its own progress. In Claude Code, the skill is now available as `/prodigy`.\n\n## 3. Check what's installed\n\n<!-- verify: list=prodigy -->\n```bash\naiskills installed\n```\n\n```text\nprodigy                    personas-skills        Claude Code\n```\n\nThe columns are the skill, its group, and the agents it is installed for.\n\n## 4. Preview the removal\n\n<!-- verify: list=prodigy -->\n```bash\naiskills uninstall -n\n```\n\n```text\n[aiskills] [dry-run] would remove (global): prodigy\n[aiskills] [dry-run] npx -y skills@1.7.6 remove prodigy --global --yes\n[aiskills] skill files kept in ~/.config/sugatoray/aiskills/skills (re-add with 'aiskills install'; delete with --purge).\n```\n\n## 5. Remove it\n\n```bash\naiskills uninstall\n```\n\nAs the preview said, the skill files stay in `~/.config/sugatoray/aiskills/skills/`, so `aiskills install` can add them back offline.\n\n## Recap\n\n- `aiskills groups` shows what you can install.\n- `aiskills install -G <group> -a <agent>` installs a group for an agent.\n- `aiskills installed` and `aiskills uninstall -n` show what is there and what would go.\n\nNext: the [Tutorial](../tutorial/01-install-a-group.md) covers patterns, projects, external skills and uninstalling in more depth.\n\nSee also: [CLI reference](../reference/cli.md)\n"},{"id":"skills","path":"skills/README.md","title":"Bundled skills","tab":"skills","md":"# Bundled skills\n\nEvery skill in this version of the package (15 skills in 8 gr iption of a data/statistics task into correct, runnable Stata code — a .do file or command sequence, not pseudocode. |\n\n## repo-related-skills\n\nAlias `repo-related`. Install the group with `aiskills install -G repo-related`.\n\n| Skill | Version | What it does |\n| --- | --- | --- |\n| [`create-issues-update-pr`](create-issues-update-pr.md) | 1.3.0 | Files GitHub issue(s) for work already done (or about to be done) on a branch/PR, grouping related issues under a parent epic when there's a genuine… |\n\n## docs-skills\n\nAlias `docs`. Install the group with `aiskills install -G docs`.\n\n| Skill | Version | What it does |\n| --- | --- | --- |\n| [`create-lib-docs`](create-lib-docs.md) | 1.2.0 | Writes top-grade, verified user documentation for a library, CLI or framework as a folder of Markdown pages plus SVG diagrams, structured the way FastAPI,… |\n\n## diagrams-skills\n\nAlias `diagrams`. Install the group with `aiskills install -G diagrams`.\n\n| Skill | Version | What it does |\n| --- | --- | --- |\n| [`network-flow`](network-flow.md) | 1.0.0 | Create working interactive network and architecture diagrams with moving packets, orthogonal connections, scenario playback, and selectable nodes. |\n\n## personas-skills\n\nAlias `personas`. Install the group with `aiskills install -G personas`.\n\n| Skill | Version | What it does |\n| --- | --- | --- |\n| [`prodigy`](prodigy.md) | 1.0.0 | Act as the top performer in a given role or field and produce a five-part playbook: (1) how they understand the problem, constraints, stakeholders and… |\n\n## video-related-skills\n\nAlias `video-related`. Install the group with `aiskills install -G video-related`.\n\n| Skill | Version | What it does |\n| --- | --- | --- |\n| [`dynamic-promo-video`](dynamic-promo-video.md) | 1.6.2 | Build a short narrated promo/intro video (HTML scenes, zoom/tilt, voiceover, music) for a library, app or product. |\n\n## image-styles-skills\n\nAlias `image-styles`. Install the group with `aiskills install -G image-styles`.\n\n| Skill | Version | What it does |\n| --- | --- | --- |\n| [`artwallbg`](artwallbg.md) | 1.0.0 | Create a vivid illustrated image of a subject in front of a huge spray-painted wall. |\n| [`commentdrop`](commentdrop.md) | 1.0.0 | Add simulated social-media comment overlays to a still image in the floating comment-drop style used in video editing. |\n\nThis section is generated from the skills' own `SKILL.md` files by `npm run docs:skills`.\n\nSee also: [Skill groups](../concepts/skill-groups.md) · [1. Install a group](../tutorial/01-install-a-group.md)\n"},{"id":"skills-artwallbg","path":"skills/artwallbg.md","title":"artwallbg","tab":"skills","md":"# artwallbg\n\nCreate a vivid illustrated image of a subject in front of a huge spray-painted wall. Use when the user invokes /artwallbg or requests this art-wall background visual.\n\n| Property | Value |\n| --- | --- |\n| Group | `image-styles-skills` (alias `image-styles`) |\n| Version | 1.0.0 |\n| Starts | When you ask for it: you type `/artwallbg` (your agent doesn't start it on its own) |\n| Needs | An image-generation or image-editing tool capable of returning rendered images |\n| License | MIT |\n| Source | [skills/image-styles/artwallbg](https://github.com/sugatoray/aiskills/tree/master/skills/image-styles/artwallbg) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s artwallbg -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: artwallbg\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill artwallbg --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `image-styles-skills` group:\n\n```bash\naiskills install -G image-styles -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove  the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s commentdrop\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/commentdrop/`:\n\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n- `agents/openai.yaml`\n- `assets/EXAMPLE.md`\n- `meta/MAINTAINERS.md`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/image-styles/commentdrop/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/image-styles/commentdrop/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"skills-create-issues-update-pr","path":"skills/create-issues-update-pr.md","title":"create-issues-update-pr","tab":"skills","md":"# create-issues-update-pr\n\nFiles GitHub issue(s) for work already done (or about to be done) on a branch/PR, grouping related issues under a parent epic when there's a genuine hierarchy — using GitHub's native parent/child issue relationship, not just labels — and then updates that pull request's title (kept short) and description so the description lists every issue in the exact format '- Closes #{{issue-number}} -- {{issue-title}}', indented to match parent-child nesting. Use this whenever the user asks to file issue(s) for a PR, 'add gh issues for this', 'track this as issues', link a PR to tracking issues, or update a PR's title/description to list the issues covering its changes — including when they invoke /create-issues-update-pr directly. Also trigger when a PR description is stale or generic relative to its actual current commits and the user wants it brought up to date alongside issue creation.\n\n| Property | Value |\n| --- | --- |\n| Group | `repo-related-skills` (alias `repo-related`) |\n| Version | 1.3.0 |\n| Starts | When you type `/create-issues-update-pr`, or your agent uses it when a task fits its description |\n| Needs | GitHub MCP server tools with write access to the target repository: issue_write, sub_issue_write, list_issue_types, search_issues/list_issues, pull_request_read, update_pull_request. Works against any GitHub repository the current session has push/write access to, not just this one. |\n| License | MIT |\n| Source | [skills/development/repo-related/create-issues-update-pr](https://github.com/sugatoray/aiskills/tree/master/skills/development/repo-related/create-issues-update-pr) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s create-issues-update-pr -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: create-issues-update-pr\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill create-issues-update-pr --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `repo-related-skills` group:\n\n```bash\naiskills install -G repo-related -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s create-issues-update-pr\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/create-issues-update-pr/`:\n\n- `.claude-plugin/plugin.json`\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n- `agents/claude-code.yaml`\n- `agents/openai.yaml`\n- `meta/MAINTAINERS.md`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/development/repo-related/create-issues-update-pr/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/development/repo-related/create-issues-update-pr/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"skills-create-lib-docs","path":"skills/create-lib-docs.md","title":"create-lib-docs","tab":"skills","md":"# create-lib-docs\n\nWrites top-grade, verified user documentation for a library, CLI or framework as a folder of Markdown pages plus SVG diagrams, structured the way FastAPI, Pydantic, DuckDB and Effect structure theirs: a landing page with a 30-second example, Getting Started, a progressive Tutorial with runnable steps, task-oriented How-to Guides, Concepts (explanations with diagrams), an exhaustive Reference (CLI flags, API, config, output schemas, one anchor per error with cause and fix), FAQ/troubleshooting, and llms.txt / llms-full.txt so AI agents can load the docs. Every fact is taken from the code, --help output and tests (never from memory), and every snippet is run before it is published. Use this whenever the user asks to write, create, restructure or overhaul documentation / docs / a user guide / a manual / API reference for a library, package, CLI or framework, wants docs 'like FastAPI's / Pydantic's / DuckDB's / Effect's', wants docs that help both humans and AI agents, or invokes /create-lib-docs.\n\n| Property | Value |\n| --- | --- |\n| Group | `docs-skills` (alias `docs`) |\n| Version | 1.2.0 |\n| Starts | When you ask for it: you type `/create-lib-docs` (your agent doesn't start it on its own) |\n| License | MIT |\n| Source | [skills/docs/create-lib-docs](https://github.com/sugatoray/aiskills/tree/master/skills/docs/create-lib-docs) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s create-lib-docs -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: create-lib-docs\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill create-lib-docs --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `docs-skills` group:\n\n```bash\naiskills install -G docs -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s create-lib-docs\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/create-lib-docs/`:\n\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n- `agents/openai.yaml`\n- `meta/MAINTAINERS.md`\n- `references/patterns.md`\n- `references/templates.md`\n- `scripts/build_llms_txt.py`\n- `scripts/check_docs.py`\n- `tests/test_scripts.py`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/docs/create-lib-docs/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/docs/create-lib-docs/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"skills-dynamic-promo-video","path":"skills/dynamic-promo-video.md","title":"dynamic-promo-video","tab":"skills","md":"# dynamic-promo-video\n\nBuild a short narrated promo/intro video (HTML scenes, zoom/tilt, voiceover, music) for a library, app or product. Use for explainer or launch videos made from code, real screenshots and TTS.\n\n| Property | Value |\n| --- | --- |\n| Group | `video-related-skills` (alias `video-related`) |\n| Version | 1.6.2 |\n| Starts | When you type `/dynamic-promo-video`, or your agent uses it when a task fits its description |\n| License | MIT |\n| Source | [skills/video-related/dynamic-promo-video](https://github.com/sugatoray/aiskills/tree/master/skills/video-related/dynamic-promo-video) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s dynamic-promo-video -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: dynamic-promo-video\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill dynamic-promo-video --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n``  invokes /network-flow or asks for live flowing diagrams, animated system architecture, request flows, RAG pipelines, or agent workflow visualizations. Accept descriptions, reference images, source material, or graph JSON. Deliver a self-contained HTML file with a working preview when supported; complete rendering, browser verification, and file delivery rather than stopping at a diagram description.\n\n| Property | Value |\n| --- | --- |\n| Group | `diagrams-skills` (alias `diagrams`) |\n| Version | 1.0.0 |\n| Starts | When you ask for it: you type `/network-flow` (your agent doesn't start it on its own) |\n| Needs | Python 3.9+ (stdlib only) for validation and HTML generation; modern browser with SVG and ResizeObserver for playback; optional Node.js and Playwright for browser checks |\n| License | MIT |\n| Source | [skills/diagrams/network-flow](https://github.com/sugatoray/aiskills/tree/master/skills/diagrams/network-flow) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s network-flow -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: network-flow\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill network-flow --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `diagrams-skills` group:\n\n```bash\naiskills install -G diagrams -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s network-flow\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/network-flow/`:\n\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n- `agents/openai.yaml`\n- `assets/examples/rag/README.md`\n- `assets/examples/rag/generated/rag.html`\n- `assets/examples/rag/generated/rag.json`\n- `assets/examples/rag/original/rag_demo.html`\n- `assets/examples/rag/original/rag_prompt.md`\n- `assets/runtime/renderer.js`\n- `assets/runtime/style.css`\n- `assets/template.html`\n- `meta/MAINTAINERS.md`\n- `references/graph-schema.md`\n- `references/layout.md`\n- `references/telemetry.md`\n- `references/verification.md`\n- `scripts/network_flow.py`\n- `scripts/render.py`\n- `scripts/validate_graph.py`\n- `tests/check_browser.cjs`\n- `tests/test_graph.py`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/diagrams/network-flow/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/diagrams/network-flow/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"skills-prodigy","path":"skills/prodigy.md","title":"prodigy","tab":"skills","md":"# prodigy\n\nAct as the top performer in a given role or field and produce a five-part playbook: (1) how they understand the problem, constraints, stakeholders and success metrics; (2) how they design, break down and deliver a solution, including iteration, validation and communication; (3) the biggest pitfalls and how they avoid them; (4) a short set of operating principles and decision rules; (5) a practical learning plan with daily habits, projects and feedback loops for someone to level up. Use when the user invokes /prodigy, optionally with a role or field (e.g. /prodigy product manager, /prodigy SRE, /prodigy negotiation), or asks how the best person in a role thinks and works.\n\n| Property | Value |\n| --- | --- |\n| Group | `personas-skills` (alias `personas`) |\n| Version | 1.0.0 |\n| Starts | When you type `/prodigy`, or your agent uses it when a task fits its description |\n| License | MIT |\n| Source | [skills/personas/prodigy](https://github.com/sugatoray/aiskills/tree/master/skills/personas/prodigy) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s prodigy -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: prodigy\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill prodigy --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `personas-skills` group:\n\n```bash\naiskills install -G personas -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s prodigy\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/prodigy/`:\n\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/personas/prodigy/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/personas/prodigy/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"skills-scrolls-help","path":"skills/scrolls-help.md","title":"scrolls-help","tab":"skills","md":"# scrolls-help\n\nShows a crisp, example-driven reference for the whole scrolls skill family (/scrolls-setup, /scrolls-update, /scrolls-hide, /scrolls-unhide, /scrolls-remove, /scrolls-restore) — what each command does, their shared -p/-t/-l/-r/-u/-x/--onto flags, and common usage examples (new project, monorepo, running from a subdirectory, toggling hidden/visible, removing and restoring scrolls). Use this whenever the user runs /scrolls-help, or asks what the scrolls commands do, how to use them, what flags they take, which one they need, or seems unsure about docs/.scrolls setup — even if they only name one of the six commands rather than 'scrolls' generally. Supports -e/--online to render it as a styled page served on an OS-assigned localhost port instead of chat text, with light/dark and colorize/plain toggles. Works on macOS, Linux, and Windows (bash or PowerShell).\n\n| Property | Value |\n| --- | --- |\n| Group | `scrolls-skills` (alias `scrolls`) |\n| Version | 2.4.0 |\n| Starts | When you ask for it: you type `/scrolls-help` (your agent doesn't start it on its own) |\n| Needs | bash (macOS/Linux/WSL) or PowerShell 7+ (pwsh) or PowerShell (older versions: powershell.exe); Python 3.9+ (stdlib only, no dependencies) |\n| License | MIT |\n| Source | [skills/scrolls/scrolls-help](https://github.com/sugatoray/aiskills/tree/master/skills/scrolls/scrolls-help) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s scrolls-help -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: scrolls-help\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill scrolls-help --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `scrolls-skills` group:\n\n```bash\naiskills install -G scrolls -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s scrolls-help\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/scrolls-help/`:\n\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n- `agents/openai.yaml`\n- `assets/EXAMPLES.md`\n- `meta/MAINTAINERS.md`\n- `meta/SECURITY.md`\n- `references/HELP.md`\n- `scripts/open_help.ps1`\n- `scripts/open_help.sh`\n- `scripts/serve_help.py`\n- `tests/test_open_help.ps1`\n- `tests/test_open_help.sh`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-help/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-help/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"skills-scrolls-hide","path":"skills/scrolls-hide.md","title":"scrolls-hide","tab":"skills","md":"# scrolls-hide\n\nConverts an already-set-up docs/scrolls/ working-memory folder from visible (scrolls) to dotfile-hidden (.scrolls), renaming the folder and rewriting the path references inside it and in SCROLLS.md so nothing breaks. Use this whenever the user runs /scrolls-hide, or asks to hide, dot, or re-hide the scrolls folder, go back to hiding project memory / docs/.scrolls, or rename scrolls to .scrolls. This is the retrofit path for a project that was set up visible and now wants it hidden — for a brand-new project, /scrolls-setup's default (no -u/--unhide flag) already creates it hidden and this skill isn't needed. By default checks one exact location (docs/scrolls under the current directory); supports -r/--recurse to sweep an entire directory tree instead (e.g. every package in a monorepo in one run), repeatable -p/--path to target specific locations, -t/--reporoot to target the git repository's top level regardless of which subdirectory you're in, -l/--local to target the current directory explicitly, and the DEFAULT_SCROLLS_RELPATH environment variable to change the default location. Works on macOS, Linux, and Windows (bash or PowerShell). The opposite of /scrolls-unhide.\n\n| Property | Value |\n| --- | --- |\n| Group | `scrolls-skills` (alias `scrolls`) |\n| Version | 2.4.0 |\n| Starts | When you ask for it: you type `/scrolls-hide` (your agent doesn't start it on its own) |\n| Needs | bash (macOS/Linux/WSL) or PowerShell 7+ (pwsh) or PowerShell (older versions: powershell.exe); Python 3.9+ (stdlib only, no dependencies) |\n| License | MIT |\n| Source | [skills/scrolls/scrolls-hide](https://github.com/sugatoray/aiskills/tree/master/skills/scrolls/scrolls-hide) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s scrolls-hide -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: scrolls-hide\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill scrolls-hide --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `scrolls-skills` group:\n\n```bash\naiskills install -G scrolls -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s scrolls-hide\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/scrolls-hide/`:\n\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n- `agents/openai.yaml`\n- `assets/EXAMPLES.md`\n- `meta/MAINTAINERS.md`\n- `scripts/hide.ps1`\n- `scripts/hide.sh`\n- `tests/test_hide.ps1`\n- `tests/test_hide.sh`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-hide/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-hide/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"skills-scrolls-remove","path":"skills/scrolls-remove.md","title":"scrolls-remove","tab":"skills","md":"# scrolls-remove\n\nRemoves a docs/.scrolls/ (or docs/scrolls/) project-memory system from a git repository — the exact opposite of /scrolls-setup. Deletes the scrolls folder, deletes SCROLLS.md, strips the scrolls pointer stub out of CLAUDE.md (and the dangling pointer out of AGENTS.md), deleting either file outright only when nothing else is left in it, and records the whole removal as ONE git commit whose message names the commit just before the removal, so it can always be undone. Use this whenever the user runs /scrolls-remove, or asks to remove, delete, uninstall, tear down, or get rid of the scrolls / project memory / docs/.scrolls. Supports -p/--path (repeatable), -t/--reporoot, -l/--local, -r/--recurse to find and remove every scrolls folder under a directory in one commit, -x/--purge [CLAUDE.md|AGENTS.md|SCROLLS.md|<other file>|all] to delete pointer files outright even when they hold other content, -n/--dry-run, -y/--yes to skip the confirmation, and --no-commit. Refuses to run when anything it would remove has uncommitted changes, since those could not be restored. Works on macOS, Linux, and Windows (bash or PowerShell).\n\n| Property | Value |\n| --- | --- |\n| Group | `scrolls-skills` (alias `scrolls`) |\n| Version | 2.4.0 |\n| Starts | When you ask for it: you type `/scrolls-remove` (your agent doesn't start it on its own) |\n| Needs | bash (macOS/Linux/WSL) or PowerShell 7+ (pwsh) or PowerShell (older versions: powershell.exe); Python 3.9+ (stdlib only, no dependencies); git |\n| License | MIT |\n| Source | [skills/scrolls/scrolls-remove](https://github.com/sugatoray/aiskills/tree/master/skills/scrolls/scrolls-remove) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s scrolls-remove -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: scrolls-remove\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill scrolls-remove --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `scrolls-skills` group:\n\n```bash\naiskills install -G scrolls -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s scrolls-remove\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/scrolls-remove/`:\n\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n- `agents/openai.yaml`\n- `assets/EXAMPLES.md`\n- `meta/MAINTAINERS.md`\n- `scripts/remove.ps1`\n- `scripts/remove.py`\n- `scripts/remove.sh`\n- `tests/test_remove.ps1`\n- `tests/test_remove.sh`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-remove/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-remove/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"skills-scrolls-restore","path":"skills/scrolls-restore.md","title":"scrolls-restore","tab":"skills","md":"# scrolls-restore\n\nRestores a docs/.scrolls/ (or docs/scrolls/) project-memory system from git history — the counterpart to /scrolls-remove. By default finds the newest /scrolls-remove checkpoint in HEAD's history and brings back exactly what it removed; or takes any COMMIT (a removal commit, or an ordinary commit containing a scrolls folder). Restores ONLY the agentic memory — the scrolls folders plus the SCROLLS.md/CLAUDE.md/AGENTS.md pointer stubs, re-inserted into those files as they are today — never rolling back anything else in the repository, and records it as one git commit. --onto REF mounts the memory onto another branch (or, with -b, a new branch at any commit) through a temporary worktree, without touching the current checkout. Use this whenever the user runs /scrolls-restore, or asks to restore, bring back, recover, undo the removal of, or re-mount the scrolls / project memory / docs/.scrolls. Supports -p/--path (repeatable), -t/--reporoot, -l/--local, -r/--recurse, --onto, -b/--branch, --full, -f/--force, --list [--all], -n/--dry-run, -y/--yes, and --no-commit. Works on macOS, Linux, and Windows (bash or PowerShell).\n\n| Property | Value |\n| --- | --- |\n| Group | `scrolls-skills` (alias `scrolls`) |\n| Version | 2.4.0 |\n| Starts | When you ask for it: you type `/scrolls-restore` (your agent doesn't start it on its own) |\n| Needs | bash (macOS/Linux/WSL) or PowerShell 7+ (pwsh) or PowerShell (older versions: powershell.exe); Python 3.9+ (stdlib only, no dependencies); git |\n| License | MIT |\n| Source | [skills/scrolls/scrolls-restore](https://github.com/sugatoray/aiskills/tree/master/skills/scrolls/scrolls-restore) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s scrolls-restore -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: scrolls-restore\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill scrolls-restore --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `scrolls-skills` group:\n\n```bash\naiskills install -G scrolls -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s scrolls-restore\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/scrolls-restore/`:\n\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n- `agents/openai.yaml`\n- `assets/EXAMPLES.md`\n- `meta/MAINTAINERS.md`\n- `scripts/restore.ps1`\n- `scripts/restore.py`\n- `scripts/restore.sh`\n- `tests/test_restore.ps1`\n- `tests/test_restore.sh`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-restore/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-restore/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"skills-scrolls-setup","path":"skills/scrolls-setup.md","title":"scrolls-setup","tab":"skills","md":"# scrolls-setup\n\nSets up a minimal docs/.scrolls/ working-memory system for a project — a small set of cross-session memory files (STARTER.md, SPEC.md, HANDOFF.md, GAP_ANALYSIS.md, GAP_CONTEXT.md, PLAN.md, WISDOM.md) plus a SCROLLS.md file that points future sessions at STARTER.md, a short CLAUDE.md pointer to SCROLLS.md, and a matching AGENTS.md pointer to CLAUDE.md for other agent harnesses. Use this whenever the user runs /scrolls-setup, or asks to set up 'scrolls', a project-memory system, session handoff notes, a docs/.scrolls folder, or a CLAUDE.md/AGENTS.md/SCROLLS.md that points new sessions at persistent project docs. Trigger even if the project has no docs/ folder, no CLAUDE.md, no AGENTS.md, or no SCROLLS.md yet — creating them is part of the job. Supports -p/--path for a custom docs location, -t/--reporoot to pin everything to the git repository's top level regardless of which subdirectory you're in, -l/--local to pin it explicitly to the current directory, -r/--recurse to scan recursively for an existing scrolls folder before creating a new one (avoiding accidental duplicates), and -u/--unhide to name the folder scrolls instead of .scrolls. Defaults to the current directory, but warns first if that differs from the repo root so a subdirectory invocation doesn't silently create a second, disconnected scrolls system. Works on macOS, Linux, and Windows (bash or PowerShell).\n\n| Property | Value |\n| --- | --- |\n| Group | `scrolls-skills` (alias `scrolls`) |\n| Version | 2.4.0 |\n| Starts | When you ask for it: you type `/scrolls-setup` (your agent doesn't start it on its own) |\n| Needs | bash (macOS/Linux/WSL) or PowerShell 7+ (pwsh) or PowerShell (older versions: powershell.exe); Python 3.9+ (stdlib only, no dependencies) |\n| License | MIT |\n| Source | [skills/scrolls/scrolls-setup](https://github.com/sugatoray/aiskills/tree/master/skills/scrolls/scrolls-setup) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s scrolls-setup -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: scrolls-setup\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill scrolls-setup --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `scrolls-skills` group:\n\n```bash\naiskills install -G scrolls -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s scrolls-setup\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/scrolls-setup/`:\n\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n- `agents/openai.yaml`\n- `assets/EXAMPLES.md`\n- `assets/templates/AGENTS_MD_BLOCK.md`\n- `assets/templates/CLAUDE_MD_BLOCK.md`\n- `assets/templates/GAP_ANALYSIS.md`\n- `assets/templates/GAP_CONTEXT.md`\n- `assets/templates/HANDOFF.md`\n- `assets/templates/PLAN.md`\n- `assets/templates/SCROLLS_MD_BLOCK.md`\n- `assets/templates/SPEC.md`\n- `assets/templates/STARTER.md`\n- `assets/templates/WISDOM.md`\n- `meta/MAINTAINERS.md`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-setup/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-setup/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"skills-scrolls-unhide","path":"skills/scrolls-unhide.md","title":"scrolls-unhide","tab":"skills","md":"# scrolls-unhide\n\nConverts an already-set-up docs/.scrolls/ working-memory folder from dotfile-hidden (.scrolls) to visible (scrolls), renaming the folder and rewriting the path references inside it and in SCROLLS.md so nothing breaks. Use this whenever the user runs /scrolls-unhide, or asks to unhide, un-dot, or show the scrolls folder, stop hiding project memory / docs/.scrolls, or rename .scrolls to scrolls. This is the retrofit path for a project that was set up hidden and now wants it visible — for a brand-new project, /scrolls-setup's own -u/--unhide flag does this in one step and this skill isn't needed. By default checks one exact location (docs/.scrolls under the current directory); supports -r/--recurse to sweep an entir
