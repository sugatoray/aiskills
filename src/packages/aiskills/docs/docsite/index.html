e directory tree instead (e.g. every package in a monorepo in one run), repeatable -p/--path to target specific locations, -t/--reporoot to target the git repository's top level regardless of which subdirectory you're in, -l/--local to target the current directory explicitly, and the DEFAULT_SCROLLS_RELPATH environment variable to change the default location. Works on macOS, Linux, and Windows (bash or PowerShell). The opposite of /scrolls-hide.\n\n| Property | Value |\n| --- | --- |\n| Group | `scrolls-skills` (alias `scrolls`) |\n| Version | 2.4.0 |\n| Starts | When you ask for it: you type `/scrolls-unhide` (your agent doesn't start it on its own) |\n| Needs | bash (macOS/Linux/WSL) or PowerShell 7+ (pwsh) or PowerShell (older versions: powershell.exe); Python 3.9+ (stdlib only, no dependencies) |\n| License | MIT |\n| Source | [skills/scrolls/scrolls-unhide](https://github.com/sugatoray/aiskills/tree/master/skills/scrolls/scrolls-unhide) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s scrolls-unhide -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: scrolls-unhide\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill scrolls-unhide --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `scrolls-skills` group:\n\n```bash\naiskills install -G scrolls -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s scrolls-unhide\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/scrolls-unhide/`:\n\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n- `agents/openai.yaml`\n- `assets/EXAMPLES.md`\n- `meta/MAINTAINERS.md`\n- `scripts/unhide.ps1`\n- `scripts/unhide.sh`\n- `tests/test_unhide.ps1`\n- `tests/test_unhide.sh`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-unhide/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-unhide/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"skills-scrolls-update","path":"skills/scrolls-update.md","title":"scrolls-update","tab":"skills","md":"# scrolls-update\n\nUpdates an existing docs/.scrolls/ project-memory system (STARTER.md, SPEC.md, HANDOFF.md, GAP_ANALYSIS.md, GAP_CONTEXT.md, PLAN.md, WISDOM.md, and any project-specific scrolls beyond that core set) to reflect what actually happened in the current session, following each file's own update rule instead of appending blindly. Also backfills SCROLLS.md/CLAUDE.md/AGENTS.md if the project predates them (idempotent — safe every run, never overwrites existing CLAUDE.md content). Use this whenever the user runs /scrolls-update, or asks to update the scrolls, refresh HANDOFF.md, write session handoff notes, record what was just done, close out or wrap up a session, log a new gap or trap, or update project memory / STARTER.md's docs. This is the counterpart to /scrolls-setup (which creates the system once) — use this one for every session afterward. Supports -p/--path for a custom docs location, -t/--reporoot to look under the git repository's top level regardless of which subdirectory you're in, -l/--local to look explicitly in the current directory, and -r/--recurse to search recursively for the scrolls folder if it isn't at the obvious exact location. Defaults to the current directory, but warns first if that differs from the repo root so a subdirectory invocation doesn't silently miss the real scrolls. Works on macOS, Linux, and Windows (bash or PowerShell). If no scrolls folder is found, say so and point at /scrolls-setup instead of inventing files here.\n\n| Property | Value |\n| --- | --- |\n| Group | `scrolls-skills` (alias `scrolls`) |\n| Version | 2.4.0 |\n| Starts | When you ask for it: you type `/scrolls-update` (your agent doesn't start it on its own) |\n| Needs | bash (macOS/Linux/WSL) or PowerShell 7+ (pwsh) or PowerShell (older versions: powershell.exe); Python 3.9+ (stdlib only, no dependencies) |\n| License | MIT |\n| Source | [skills/scrolls/scrolls-update](https://github.com/sugatoray/aiskills/tree/master/skills/scrolls/scrolls-update) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s scrolls-update -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: scrolls-update\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill scrolls-update --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `scrolls-skills` group:\n\n```bash\naiskills install -G scrolls -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s scrolls-update\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/scrolls-update/`:\n\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n- `agents/openai.yaml`\n- `assets/EXAMPLES.md`\n- `meta/MAINTAINERS.md`\n- `scripts/session_diff.ps1`\n- `scripts/session_diff.sh`\n- `tests/test_session_diff.ps1`\n- `tests/test_session_diff.sh`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-update/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-update/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"skills-stata-recipes","path":"skills/stata-recipes.md","title":"stata-recipes","tab":"skills","md":"# stata-recipes\n\nTurns a plain-language description of a data/statistics task into correct, runnable Stata code — a .do file or command sequence, not pseudocode. Use this whenever the user asks how to do something in Stata, wants a Stata command or .do file written or fixed, mentions Stata alongside a modeling task (regression, panel data, time series, ARDL, fixed effects, diff-in-diff, matching, etc.), or wants Stata and Python working together (running Python from inside a .do file, pulling Stata's dataset into pandas, or driving Stata from a Python script via pystata/stata_setup or batch mode). Also trigger when the user pastes Stata code that errors or gives wrong-looking results and wants it debugged, or asks 'is this good Stata style' / 'what's wrong with this command'. Covers a growing library of named recipes for common econometric workflows (ARDL modeling shipped now; more added over time) that produce a ready-to-run script, not just an explanation.\n\n| Property | Value |\n| --- | --- |\n| Group | `stata-skills` (alias `stata`) |\n| Version | 1.3.2 |\n| Starts | When you type `/stata-recipes`, or your agent uses it when a task fits its description |\n| Needs | Stata 16+ (Stata 17+ recommended — modern `ardl` command and built-in Python integration); optionally Python 3.9+ with the `pystata`/`stata_setup` package (bundled with Stata 17+) for Stata<->Python interop |\n| License | MIT |\n| Source | [skills/stata/stata-recipes](https://github.com/sugatoray/aiskills/tree/master/skills/stata/stata-recipes) |\n\n## Install\n\nFor one agent (leave out `-a` for every agent `npx skills` finds):\n\n<!-- verify -->\n```bash\naiskills install -s stata-recipes -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: stata-recipes\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill stata-recipes --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nOr the whole `stata-skills` group:\n\n```bash\naiskills install -G stata -a claude-code\n```\n\nInto the current project instead: add `-p`. To remove it:\n\n```bash\naiskills uninstall -s stata-recipes\n```\n\n## What's inside\n\nThe files that ship with the skill, in `~/.config/sugatoray/aiskills/skills/stata-recipes/`:\n\n- `.claude-plugin/plugin.json`\n- `CHANGELOG.md`\n- `README.md`\n- `SKILL.md`\n- `agents/claude-code.yaml`\n- `agents/openai.yaml`\n- `meta/MAINTAINERS.md`\n- `references/good-bad-examples.md`\n- `references/python-interop.md`\n- `references/recipes/README.md`\n- `references/recipes/models/ardl.md`\n- `references/recipes/models/regression-panel.md`\n- `references/recipes/models/regression-timeseries.md`\n- `references/recipes/tests/test-dickey-fuller.md`\n- `references/recipes/tests/test-im-pesaran-shin.md`\n- `references/recipes/tests/test-unit-root.md`\n\nSee also: [All skills](README.md) · [README](https://github.com/sugatoray/aiskills/blob/master/skills/stata/stata-recipes/README.md) · [CHANGELOG](https://github.com/sugatoray/aiskills/blob/master/skills/stata/stata-recipes/CHANGELOG.md) · [Skill groups](../concepts/skill-groups.md)\n"},{"id":"tutorial-01-install-a-group","path":"tutorial/01-install-a-group.md","title":"1. Install a group","tab":"tutorial","md":"# 1. Install a group\n\nAfter this step you can find a group of skills and install it for one agent.\n\n**You'll need:** the package installed ([Installation](../getting-started/installation.md)), and at least one agent that `npx skills` supports, such as Claude Code.\n\n## See the groups\n\n<!-- verify -->\n```bash\naiskills groups\n```\n\n```text\nscrolls-skills  (alias: scrolls)\n  Scrolls: a git-native markdown system for agentic memory that persists project state across sessions and ag...\n  skills: scrolls-help, scrolls-hide, scrolls-remove, scrolls-restore, scrolls-setup, scrolls-unhide, scrolls-update\n\nstata-skills  (alias: stata)\n  Stata skills: turns a plain-language data/statistics task into correct, runnable Stata code, with good-vs-b...\n  skills: stata-recipes\n\nrepo-related-skills  (alias: repo-related)\n  Repo-related skills: acting on a repository's own hosted state (issues, pull requests, releases, and simila...\n  skills: create-issues-update-pr\n\ndocs-skills  (alias: docs)\n  Docs skills: writes verified user documentation for a library, CLI or framework, structured like FastAPI, P...\n  skills: create-lib-docs\n\ndiagrams-skills  (alias: diagrams)\n  Animated architecture and network diagrams with flowing packets, orthogonal routing, selectable nodes, and ...\n  skills: network-flow\n\npersonas-skills  (alias: personas)\n  Persona skills: /prodigy acts as the top performer in any role or field and shares how they frame problems,...\n  skills: prodigy\n\nvideo-related-skills  (alias: video-related)\n  Video skills: /dynamic-promo-video builds a short narrated promo or intro video (HTML scenes with zoom/tilt...\n  skills: dynamic-promo-video\n\nimage-styles-skills  (alias: image-styles)\n  Skills for generating images in a variety of styles and applying visual styles or effects to existing image...\n  skills: artwallbg, commentdrop\n\nInstall a group:  aiskills install --group <name|alias> --global --agent <agent>\n```\n\nEach group has a name (`scrolls-skills`) and a shorter alias (`scrolls`, the name without `-skills`). Either works. Every bundled skill is in a group; a skill that wasn't would be listed under `(ungrouped; use -s or -G all)`, to install by name or with the built-in group `all`.\n\n## Install one group for one agent\n\n<!-- verify -->\n```bash\naiskills install --group scrolls --agent claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: scrolls-help, scrolls-hide, scrolls-remove, scrolls-restore, scrolls-setup, scrolls-unhide, scrolls-update\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill scrolls-help --skill scrolls-hide --skill scrolls-remove --skill scrolls-restore --skill scrolls-setup --skill scrolls-unhide --skill scrolls-update --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nWhat happened, in order:\n\n1. `aiskills` refreshed the skill files in `~/.config/sugatoray/aiskills/skills/` from the package.\n2. It turned the group into its seven skills (`bundled: ...`).\n3. It ran `npx skills add` on that folder with one `--skill` per skill and your agent. `--global` is the default scope, and `--yes` skips `npx skills`' prompts.\n\n`npx skills` prints its own progress after that line, and the skills appear in Claude Code as `/scrolls-setup`, `/scrolls-update` and so on.\n\n> [!TIP]\n> The same command, shorter: `ais i -G scrolls -a claude-code`. `ais` is `aiskills`, `i` is `install`, and `-G`/`-a` are the short forms of `--group`/`--agent`.\n\n## Install several groups\n\nSeparate groups with commas, or repeat `-G`:\n\n```bash\naiskills install -G scrolls,personas -a claude-code\naiskills install -G scrolls -G personas -a claude-code\n```\n\n## Recap\n\n- `aiskills groups` lists groups, their aliases and their skills.\n- `aiskills install -G <group> -a <agent>` installs a group for one agent; `-G` takes the name or the alias.\n- `aiskills` always refreshes the saved skills, then hands the install to `npx skills add`.\n\nReference: [`install`](../reference/cli.md#install) · [`-G`, `--group`](../reference/cli.md#-g---group---groups) · [Skill groups](../concepts/skill-groups.md)\n\nNext: [2. Pick skills and agents](02-pick-skills-and-agents.md)\n"},{"id":"tutorial-02-pick-skills-and-agents","path":"tutorial/02-pick-skills-and-agents.md","title":"2. Pick skills and agents","tab":"tutorial","md":"# 2. Pick skills and agents\n\nAfter this step you can choose skills by name or pattern and install them for several agents at once.\n\n**You'll need:** the previous step.\n\n## Name the skills\n\n`-s` (`--skill`) takes skill names, separated by commas:\n\n<!-- verify -->\n```bash\naiskills install -s scrolls-setup,scrolls-update -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: scrolls-setup, scrolls-update\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill scrolls-setup --skill scrolls-update --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\n## Use a pattern\n\n`-s`, `-G` and `-a` accept glob patterns: `*` for any text, `?` for one character, `[abc]` for one of a set. Quote them so your shell leaves them alone:\n\n<!-- verify -->\n```bash\naiskills install -s 'scrolls-[hu]*' -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: scrolls-help, scrolls-hide, scrolls-unhide, scrolls-update\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill scrolls-help --skill scrolls-hide --skill scrolls-unhide --skill scrolls-update --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nThe `bundled:` line shows what the pattern matched, before anything is installed. A pattern that matches nothing stops the command:\n\n<!-- verify -->\n```bash\naiskills install -s 'scroll-*'\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] no skill matches: scroll-*\n  available: artwallbg, commentdrop, create-issues-update-pr, create-lib-docs, dynamic-promo-video, network-flow, prodigy, scrolls-help, scrolls-hide, scrolls-remove, scrolls-restore, scrolls-setup, scrolls-unhide, scrolls-update, stata-recipes\n```\n\n## Mix skills and groups\n\n`-s` and `-G` add up. This installs the personas group plus one skill:\n\n<!-- verify -->\n```bash\naiskills install -G personas -s create-lib-docs -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: create-lib-docs, prodigy\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill create-lib-docs --skill prodigy --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\n## Several agents\n\n`-a` takes several agents, and patterns too. Plain agent names are passed to `npx skills`, which checks them. A pattern is expanded against the agent list that `npx skills` itself reports, and the result is printed:\n\n```bash\naiskills install -G stata -a claude-code,codex\naiskills install -G stata -a 'claude*,codex'\n```\n\nLeave out `-a` and `npx skills` installs for every agent it detects on your machine: each agent whose folder exists (such as `~/.claude` or `~/.codex`), plus the agents that share `~/.config/agents/skills`. If it detects none, it installs for every agent it supports.\n\n## Pick from a list (`-i`)\n\n`-i` (`--interactive`) lets `npx skills add` ask you, the way it does when you run it yourself:\n\n```bash\naiskills install -i\n```\n\nIt shows three pickers: the skills (all checked; uncheck what you don't want), the agents (the ones you picked last time are already checked) and how to install (symlink or copy). `-s`, `-G` and `-a` still work and skip the matching picker, so `aiskills install -i -G scrolls` only asks about agents. `-i` needs a terminal.\n\n## Reuse your last pick (`-l`)\n\n`npx skills` remembers the agents you picked in its agent picker. `-l` (`--last-agents`) installs for exactly those, without asking:\n\n<!-- verify: last=claude-code,codex -->\n```bash\naiskills install -l -G stata\n```\n\n```text\n[aiskills] last-picked agents: claude-code, codex\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: stata-recipes\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill stata-recipes --agent claude-code --agent codex --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nIf you have never picked agents in `npx skills add`, `-l` stops before installing anything:\n\n<!-- verify -->\n```bash\naiskills install -l\n```\n\n```text\n[aiskills] --last-agents: no agents recorded in ~/.agents/.skill-lock.json\n  pick them once with 'aiskills install -i' (or 'npx skills add'), or use -a <agents>\n```\n\nA good habit: run `aiskills install -i` once to choose your agents, then `aiskills install -l` for later updates.\n\n## Recap\n\n- `-s` picks skills, `-G` picks groups, and they combine.\n- Patterns work in `-s`, `-G` and `-a`; quote them.\n- The `bundled:` line shows exactly what will be installed.\n- `-i` lets you pick from a list; `-l` reuses the agents you picked last time.\n\nReference: [`-s`, `--skill`](../reference/cli.md#-s---skill) · [`-a`, `--agent`](../reference/cli.md#-a---agent) · [`-i`, `--interactive`](../reference/cli.md#-i---interactive) · [`-l`, `--last-agents`](../reference/cli.md#-l---last-agents) · [Patterns](../reference/patterns.md)\n\nNext: [3. Install into a project](03-install-into-a-project.md) · Previous: [1. Install a group](01-install-a-group.md)\n"},{"id":"tutorial-03-install-into-a-project","path":"tutorial/03-install-into-a-project.md","title":"3. Install into a project","tab":"tutorial","md":"# 3. Install into a project\n\nAfter this step you can install skills for one project only, so they travel with that project instead of applying to every project you open.\n\n**You'll need:** the previous steps, and a project folder.\n\n## Install with `-p`\n\nRun the command from the project's folder and add `-p` (`--project`):\n\n<!-- verify -->\n```bash\naiskills install -p -G stata -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: stata-recipes\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --skill stata-recipes --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nCompare it with the global install in step 1: the command has no `--global`, and `aiskills` runs it from your current folder. `npx skills` then installs the skill into that project's agent folders (for Claude Code, `.claude/skills/`) and records it there.\n\nThe skill's source is still `~/.config/sugatoray/aiskills`, so `aiskills` can recognise it later.\n\n## List and remove project skills\n\n`installed` and `uninstall` take `-p` too, and look at the current folder:\n\n```bash\naiskills installed -p\naiskills uninstall -p -G stata\n```\n\nGlobal and project installs are separate. A skill can be installed in both, and removing one leaves the other.\n\n## Make project scope the default\n\n`AISKILLS_SCOPE=project` makes every command work on the current project without `-p`. Set it in the project's shell (or a tool like direnv):\n\n```bash\nexport AISKILLS_SCOPE=project\naiskills install -G stata\n```\n\n`-g` still works for a single command. See [Set default choices](../guides/set-defaults.md).\n\nFor a project dependency, [`npx skills experimental_sync`](../guides/use-experimental-sync.md) is another way to install the skills, pinned by your lockfile.\n\n## Recap\n\n- `-p` installs, lists and removes skills in the current project.\n- The default, `-g`, is for your user, in every project.\n- `AISKILLS_SCOPE=project` makes project scope the default.\n\nReference: [`-p`, `--project`](../reference/cli.md#-p---project) · [`AISKILLS_SCOPE`](../reference/environment.md#aiskills_scope)\n\nNext: [4. Add external skills](04-add-external-skills.md) · Previous: [2. Pick skills and agents](02-pick-skills-and-agents.md)\n"},{"id":"tutorial-04-add-external-skills","path":"tutorial/04-add-external-skills.md","title":"4. Add external skills","tab":"tutorial","md":"# 4. Add external skills\n\nAfter this step you can install skills that aren't in this package, from the skills registry or GitHub, with the same command.\n\n**You'll need:** the previous steps, and network access to `skills.sh` and GitHub.\n\n## Without `--route`, only bundled skills\n\n`aiskills` refuses a skill name it doesn't bundle, before it installs anything:\n\n<!-- verify -->\n```bash\naiskills install -s pdf\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] not provided by this package: pdf\n  available: artwallbg, commentdrop, create-issues-update-pr, create-lib-docs, dynamic-promo-video, network-flow, prodigy, scrolls-help, scrolls-hide, scrolls-remove, scrolls-restore, scrolls-setup, scrolls-unhide, scrolls-update, stata-recipes\n  add --route to look them up with 'npx skills' instead\n```\n\n## Look it up with `--route`\n\nWith `--route`, a bare name that isn't bundled is looked up with `npx skills find`. If exactly one result has exactly that name, `aiskills` shows it and asks before installing anything. In a terminal, answering `y`:\n\n<!-- verify: find=anthropics/skills@pdf tty=y -->\n```bash\naiskills --route install -s pdf -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] 'pdf' is not bundled; looking it up with 'npx skills find pdf' ...\n[aiskills] found anthropics/skills@pdf\n[aiskills] found in the skills registry (not bundled; third-party code your agents may run):\n    anthropics/skills@pdf  (1.2K installs)  for 'pdf'\nInstall 1 external skill from the registry? [y/N] y\n[aiskills] external: anthropics/skills@pdf\n[aiskills] running: npx -y skills@1.7.6 add anthropics/skills@pdf --global --agent claude-code --yes\n```\n\nCheck the source (`anthropics/skills`) before you answer. Only `y` or `yes` installs; Enter or anything else stops with `nothing installed: not confirmed`. This is a safety check: an external skill is code from someone else that your agents may run.\n\nIn a script, or once you've checked the source, `-y` (`--yes`) answers yes in advance. Without a terminal and without `-y`, `aiskills` stops and installs nothing:\n\n<!-- verify: find=anthropics/skills@pdf -->\n```bash\naiskills --route install -s pdf -a claude-code -y\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] 'pdf' is not bundled; looking it up with 'npx skills find pdf' ...\n[aiskills] found anthropics/skills@pdf\n[aiskills] found in the skills registry (not bundled; third-party code your agents may run):\n    anthropics/skills@pdf  (1.2K installs)  for 'pdf'\n[aiskills] external: anthropics/skills@pdf\n[aiskills] running: npx -y skills@1.7.6 add anthropics/skills@pdf --global --agent claude-code --yes\n```\n\nThe example outputs above were produced with a stand-in registry that returns one result, `anthropics/skills@pdf` with 1.2K installs; the real registry may return other results and counts. If several results share the exact name, `aiskills` stops and lists them, and you pick one. It never chooses for you. To see what would be installed without installing anything, add `-n` (`--dry-run`).\n\n`aix` is a shorter way to write `aiskills --route`:\n\n```bash\naix i -s pdf -a claude-code\n```\n\n## Name the source yourself\n\nAn `owner/repo@skill` (or `owner/repo`, a git URL, or a local path) skips the lookup and goes straight to `npx skills add`. It isn't asked about, because you named the source:\n\n<!-- verify -->\n```bash\naix install -s anthropics/skills@docx\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] external: anthropics/skills@docx\n[aiskills] running: npx -y skills@1.7.6 add anthropics/skills@docx --global --yes\n```\n\nThis is the safer choice for third-party skills: you decide exactly which source is used.\n\n## Bundled and external together\n\n`-s` can mix both, and `-G` still selects bundled groups. Every lookup runs before anything is installed, so a failed lookup changes nothing:\n\n```bash\naix install -G scrolls -s pdf -a claude-code\n```\n\n## See both kinds\n\n`installed --route` lists every installed skill with its source: `bundled` for this package's skills, otherwise the source `npx skills` recorded.\n\n<!-- verify: list=scrolls-setup,anthropics/skills@docx -->\n```bash\naix installed\n```\n\n```text\ndocx                       anthropics/skills              -                      Claude Code\nscrolls-setup              bundled                        scrolls-skills         Claude Code\n```\n\n## Recap\n\n- Without `--route`, `aiskills` only manages bundled skills.\n- With `--route` (or `aix`), a bare name is looked up, and installed only on a unique exact match that you confirm (`y` at the prompt, or `-y` in advance); `owner/repo@skill` is used as given, without asking.\n- External skills are installed from their source; they are never copied into `~/.config/sugatoray/aiskills`.\n\nReference: [`--route`](../reference/cli.md#--route) · [`-y`](../reference/cli.md#-y---yes) · [Bundled and external skills](../concepts/bundled-and-external.md)\n\nNext: [5. Uninstall](05-uninstall.md) · Previous: [3. Install into a project](03-install-into-a-project.md)\n"},{"id":"tutorial-05-uninstall","path":"tutorial/05-uninstall.md","title":"5. Uninstall","tab":"tutorial","md":"# 5. Uninstall\n\nAfter this step you can remove some or all of the skills, and preview a removal first.\n\n**You'll need:** the previous steps.\n\n## Preview with `-n`\n\n`-n` (`--dry-run`) prints what would be removed and the exact command, and changes nothing. Suppose `npx skills` has `scrolls-setup` and `prodigy` installed from this package, and `docx` from elsewhere:\n\n<!-- verify: list=scrolls-setup,prodigy,anthropics/skills@docx -->\n```bash\naiskills uninstall -n\n```\n\n```text\n[aiskills] [dry-run] would remove (global): prodigy, scrolls-setup\n[aiskills] [dry-run] npx -y skills@1.7.6 remove prodigy scrolls-setup --global --yes\n[aiskills] skill files kept in ~/.config/sugatoray/aiskills/skills (re-add with 'aiskills install'; delete with --purge).\n```\n\nA full uninstall removes only what `npx skills` recorded as installed from `~/.config/sugatoray/aiskills`. `docx` isn't touched.\n\n## Remove some skills\n\n`-s` and `-G` work as they do for install, patterns included. With a pattern or a group, only skills that are actually installed are removed:\n\n<!-- verify: list=scrolls-help,scrolls-hide,scrolls-setup -->\n```bash\naiskills uninstall -s 'scrolls-[hu]*' -n\n```\n\n```text\n[aiskills] [dry-run] would remove (global): scrolls-help, scrolls-hide\n[aiskills] [dry-run] npx -y skills@1.7.6 remove scrolls-help scrolls-hide --global --yes\n```\n\nDrop `-n` to remove them:\n\n```bash\naiskills uninstall -s 'scrolls-[hu]*'\n```\n\n## Remove from one agent\n\n`-a` unlinks the skills from those agents only:\n\n```bash\naiskills uninstall -a codex\n```\n\n## Remove an external skill\n\nWithout `--route`, `uninstall` refuses names this package doesn't provide. With it, names also match skills from other sources:\n\n```bash\naix uninstall -s docx\n```\n\n## Remove everything, files included\n\n`--purge` runs a full uninstall and then deletes `~/.config/sugatoray/aiskills`:\n\n<!-- verify: list=scrolls-setup -->\n```bash\naiskills uninstall --purge -n\n```\n\n```text\n[aiskills] [dry-run] would remove (global): scrolls-setup\n[aiskills] [dry-run] npx -y skills@1.7.6 remove scrolls-setup --global --yes\n[aiskills] [dry-run] would delete ~/.config/sugatoray/aiskills\n```\n\n## Recap\n\n- `-n` previews any uninstall.\n- No `-s`/`-G` removes exactly what this package installed; `-s`/`-G`/`-a` narrow it.\n- `--route` (or `aix`) lets names match skills from other sources.\n- `--purge` also deletes the install folder.\n\nReference: [`uninstall`](../reference/cli.md#uninstall) · [Remove everything](../guides/remove-everything.md)\n\nPrevious: [4. Add external skills](04-add-external-skills.md) · Back to the [docs home](../README.md)\n"},{"id":"guides-set-defaults","path":"guides/set-defaults.md","title":"How to set default choices with environment variables","tab":"guides","md":"# How to set default choices with environment variables\n\nUse `AISKILLS_*` environment variables when you run `aiskills` with the same choices every time, or when a script or CI job should not have to repeat them.\n\n`aiskills install`, `uninstall`, `installed` and `sync` read these variables as defaults. An option on the command line replaces the matching variable.\n\n## Steps\n\n1. Pick the variables for what you want:\n\n   | You want | Set | Same as |\n   | --- | --- | --- |\n   | Some groups | `AISKILLS_GROUPS=scrolls,personas` | `-G` |\n   | Some skills | `AISKILLS_SKILLS='scrolls-*,prodigy'` | `-s` |\n   | Some agents | `AISKILLS_AGENTS=claude-code,codex` | `-a` |\n   | The current project, not your user | `AISKILLS_SCOPE=project` | `-p` |\n   | Copies instead of symlinks | `AISKILLS_COPY=1` | `--copy` |\n   | The repo's folder layout | `AISKILLS_LAYOUT=nested` | `--nested` |\n   | Also external skills in `-s` | `AISKILLS_ROUTE=1` | `--route` |\n\n2. Set them for one command:\n\n   ```bash\n   AISKILLS_GROUPS=scrolls AISKILLS_AGENTS='claude*' aiskills install\n   ```\n\n3. Check the result:\n\n   ```bash\n   aiskills installed\n   ```\n\n## Variations\n\n### Make them your defaults everywhere\n\nPut them in your shell profile (`~/.bashrc`, `~/.zshrc`, ...):\n\n```bash\nexport AISKILLS_AGENTS=claude-code,codex\n```\n\n### Override a default for one command\n\nOptions win over variables. With `AISKILLS_AGENTS=claude-code` set, this installs for Codex only:\n\n```bash\naiskills install -a codex\n```\n\n## Troubleshooting\n\n- **A command installs for fewer agents or skills than expected**: a variable is set in your shell. `env | grep AISKILLS_` shows them.\n- **A name in `AISKILLS_SKILLS` isn't bundled**: `aiskills install` stops with `not provided by this package`. Fix the name, or set `AISKILLS_ROUTE=1` to look it up in the skills registry.\n\nSee also: [Environment variables](../reference/environment.md) · [Installation](../getting-started/installation.md)\n"},{"id":"guides-use-experimental-sync","path":"guides/use-experimental-sync.md","title":"How to use the package with `npx skills experimental_sync`","tab":"guides","md":"# How to use the package with `npx skills experimental_sync`\n\nUse this when you want a project's skills pinned by its lockfile, installed from `node_modules`, without the `aiskills` command or `~/.config/sugatoray/aiskills`.\n\nThe `skills` CLI has an `experimental_sync` command that installs skills found in a project's `node_modules`. It looks for `<package>/skills/<name>/SKILL.md`, one level deep. This package ships its skills exactly that way.\n\n## Steps\n\n1. Add the package as a dev dependency:\n\n   ```bash\n   npm install --save-dev @sugatoray-ai/aiskills\n   ```\n\n2. Install its skills into the project:\n\n   ```bash\n   npx skills experimental_sync --agent claude-code --yes\n   ```\n\n3. Commit the lockfile. Everyone who runs steps 1–2 gets the same skills.\n\n## Variations\n\n### Update\n\n```bash\nnpm install --save-dev @sugatoray-ai/aiskills@latest\nnpx skills experimental_sync --agent claude-code --yes\n```\n\n## Troubleshooting\n\n- **Nothing is installed**: check that `node_modules/@sugatoray-ai/aiskills/skills/` exists. It is created by `npm pack`, so it's there in the published package but not in a git checkout of the repo.\n- **The command changed**: `experimental_sync` is marked experimental by the `skills` CLI and may change. `aiskills install -p` is the stable alternative.\n\nSee also: [Layouts: flat and nested](../concepts/layouts.md) · [3. Install into a project](../tutorial/03-install-into-a-project.md)\n"},{"id":"guides-keep-the-nested-layout","path":"guides/keep-the-nested-layout.md","title":"How to keep the repo's nested layout","tab":"guides","md":"# How to keep the repo's nested layout\n\nUse `--nested` when you want `~/.config/sugatoray/aiskills/skills/` to look exactly like the repo's `skills/` folder, for browsing or editing.\n\n## Steps\n\n1. Rewrite the folder in the nested layout:\n\n   <!-- verify -->\n   ```bash\n   aiskills sync --nested\n   ```\n\n   ```text\n   [aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (nested layout)\n   ```\n\n2. Browse it: skills are now under their group folders, e.g. `skills/scrolls/scrolls-setup/`, with the groups' `README.md` and `.claude-plugin/plugin.json` files next to them.\n\nThe choice is saved in `~/.config/sugatoray/aiskills/aiskills.json`, so later `install`, `sync`, `list` and `groups` keep using it.\n\n## Variations\n\n### Install and nest in one go\n\n```bash\naiskills --nested\naiskills install --nested -G scrolls\n```\n\n`aiskills --nested` on its own means `aiskills install --nested`.\n\n### Go back to flat\n\n<!-- verify -->\n```bash\naiskills sync --flat\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n```\n\n### Nested by default\n\nSet `AISKILLS_LAYOUT=nested` in your shell profile, and every sync uses the nested layout without `--nested`:\n\n```bash\nexport AISKILLS_LAYOUT=nested\n```\n\n## Troubleshooting\n\n- **My edits disappeared**: every sync replaces `skills/`. Edit a copy elsewhere, or contribute the change to the repo.\n- **Skills behave differently**: they don't; `npx skills add` finds the same skills in either layout.\n\nSee also: [Layouts: flat and nested](../concepts/layouts.md) · [`--nested`](../reference/cli.md#--nested)\n"},{"id":"guides-run-npx-skills-directly","path":"guides/run-npx-skills-directly.md","title":"How to run any `npx skills` command","tab":"guides","md":"# How to run any `npx skills` command\n\nUse `aiskills skills <args>` when you need a `skills` command or flag that `aiskills` doesn't wrap, such as `update`, `use` or `init`.\n\nIt passes the arguments to `npx skills` unchanged, with two extras: the pinned `skills` version, and `:root` replaced by the install folder.\n\n## Steps\n\n1. Write the `npx skills` command you want, and put `aiskills skills` in front instead of `npx skills`:\n\n   <!-- verify -->\n   ```bash\n   aiskills skills list -g\n   ```\n\n   ```text\n   [aiskills] running: npx -y skills@1.7.6 list -g\n   ```\n\n   The `npx skills` output follows that line.\n\n2. Use `:root` where you need the install folder:\n\n   <!-- verify -->\n   ```bash\n   aiskills skills add :root -s prodigy -g -y\n   ```\n\n   ```text\n   [aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills -s prodigy -g -y\n   ```\n\n## Variations\n\n### Extra flags on `install` and `uninstall`\n\nAnything after `--` is added to the end of the `npx skills` command. For example, `--json` makes `npx skills add` print its result as JSON:\n\n<!-- verify -->\n```bash\naiskills install -G stata -a claude-code -- --json\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: stata-recipes\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill stata-recipes --agent claude-code --yes --json\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\n### Search the registry\n\n`aiskills find <query>` is `npx skills find <query>`:\n\n<!-- verify -->\n```bash\naiskills find pdf\n```\n\n```text\n[aiskills] running: npx -y skills@1.7.6 find pdf\n…\n```\n\nSee also: [`skills`](../reference/cli.md#skills) · [Choose the `skills` CLI version](choose-the-skills-cli-version.md)\n"},{"id":"guides-remove-everything","path":"guides/remove-everything.md","title":"How to remove everything","tab":"guides","md":"# How to remove everything\n\nUse this to take the skills, the install folder and the npm package off your machine.\n\nnpm runs nothing when a package is uninstalled, so remove the skills **before** the package.\n\n## Steps\n\n1. Preview:\n\n   ```bash\n   aiskills uninstall --purge -n\n   ```\n\n2. Remove every skill this package installed, then delete `~/.config/sugatoray/aiskills`:\n\n   ```bash\n   aiskills uninstall --purge\n   ```\n\n3. If you installed into projects, repeat in each project:\n\n   ```bash\n   aiskills uninstall -p\n   ```\n\n4. Remove the package:\n\n   ```bash\n   npm uninstall -g @sugatoray-ai/aiskills\n   ```\n\n## Variations\n\n### The package is already gone\n\nRun the CLI once through `npx`:\n\n```bash\nnpx @sugatoray-ai/aiskills uninstall --purge\n```\n\nOr do it by hand with `npx skills`:\n\n```bash\nnpx skills list -g\nnpx skills remove <skill...> --global --yes\nrm -rf ~/.config/sugatoray/aiskills\n```\n\n### External skills too\n\nA full uninstall never removes skills from other sources, even with `--route`. Name them:\n\n```bash\naix uninstall -s pdf,docx\n```\n\n## Troubleshooting\n\n- **`--purge only applies to a full uninstall`**: drop `-s`/`-G`.\n- **`... is not an aiskills folder ...`**: `AISKILLS_HOME` points at a folder that `aiskills` didn't create, so it refuses to delete it. See [Errors](../reference/errors.md#not-an-aiskills-folder).\n\nSee also: [5. Uninstall](../tutorial/05-uninstall.md) · [`--purge`](../reference/cli.md#--purge)\n"},{"id":"guides-use-from-an-agent","path":"guides/use-from-an-agent.md","title":"How to use aiskills from an AI agent or a script","tab":"guides","md":"# How to use aiskills from an AI agent or a script\n\nUse this page when a program, not a person, runs `aiskills`: an AI coding agent, a setup script, or CI.\n\n## Steps\n\n1. **Never wait for input.** `aiskills` never prompts, and it passes `--yes` to every `npx skills add` and `npx skills remove`. `npx -y` also skips npx's own download prompt.\n\n2. **Check before you change.** Read the groups as JSON, and preview removals with `-n`:\n\n   <!-- verify -->\n   ```bash\n   aiskills groups --json\n   ```\n\n   ```text\n   {\n     \"groups\": [\n       {\n         \"name\": \"scrolls-skills\",\n         \"alias\": \"scrolls\",\n   …\n     \"ungrouped\": []\n   }\n   ```\n\n   The shape is `{ \"groups\": [{ \"name\", \"alias\", \"description\", \"skills\": [string] }], \"ungrouped\": [string] }`. See [Files and schemas](../reference/files.md#aiskills-groups---json).\n\n3. **Install with explicit choices.** Name the skills or groups, the agents and the scope, so the result doesn't depend on what happens to be detected:\n\n   ```bash\n   aiskills install -g -G scrolls -a claude-code\n   ```\n\n   Don't pass `-i`: it waits for a person to pick from a list, and without a terminal it stops with exit `1`. `-l` (the agents last picked in `npx skills add`) runs without asking, but depends on what a person picked before; `-a` is more predictable.\n\n4. **Branch on the exit code**, not on the text:\n\n   | Exit code | Meaning |\n   | --- | --- |\n   | `0` | Success. For `uninstall`, also when there was nothing to remove. |\n   | `1` | `aiskills` refused or failed: a bad option, an unknown name, a pattern that matched nothing, a failed lookup, an unsafe folder. No skill was installed or removed (the saved copy in `~/.config/sugatoray/aiskills/skills/` may have been refreshed). The message is on stderr and starts with `[aiskills]`. |\n   | other | The exit code of `npx skills`, passed through. |\n\n   <!-- verify -->\n   ```bash\n   aiskills install -G nope\n   ```\n\n   ```text\n   [aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n   [aiskills] no group matches: nope\n     available: scrolls-skills (scrolls), stata-skills (stata), repo-related-skills (repo-related), docs-skills (docs), diagrams-skills (diagrams), personas-skills (personas), video-related-skills (video-related), image-styles-skills (image-styles), all\n     see 'aiskills groups'\n   ```\n\n   Every error is listed, with its cause and fix, in [Errors and exit codes](../reference/errors.md).\n\n5. **Read what's installed as JSON** with the passthrough. `aiskills` prints one `[aiskills] running: ...` line before the JSON, so parse from the first `[` of the JSON array, or call `npx -y skills@1.7.6 list --json -g` yourself:\n\n   <!-- verify -->\n   ```bash\n   aiskills skills list --json -g\n   ```\n\n   ```text\n   [aiskills] running: npx -y skills@1.7.6 list --json -g\n   []\n   ```\n\n   Each row has `name`, `source`, `sourceType`, `scope` and `agents`. A row with `sourceType` `local` and `source` equal to `aiskills path` was installed by `aiskills`. See [Files and schemas](../reference/files.md#npx-skills-list---json-rows).\n\n6. **Check the setup and the latest version as JSON.** `aiskills info --json` is offline and prints the version, folders and each setting with its source (`{ \"aiskills\", \"installRoot\", \"saved\", \"settings\": { \"<name>\": { \"value\", \"source\" } }, \"skillsLock\", \"env\" }`; `--full` adds `\"full\": { \"npm\": { \"latest\", \"status\" }, \"installed\": {...} }`). `aiskills rel 1 --json` gives the latest release: `.releases[0].version`, and `.installed` is this version. `aiskills upgrade --check --json` answers \"is there a newer one?\" in `.upgradable` (exit `0` either way); `aiskills upgrade -y` upgrades without asking even for a downgrade. See [`info`](../reference/cli.md#info) and [`releases`](../reference/cli.md#releases).\n\n## Variations\n\n### Unattended install from npm\n\n`npm install` only adds the command, so run `aiskills install` after it. Its exit code tells a script whether it worked:\n\n```bash\nnpm install -g @sugatoray-ai/aiskills\naiskills install -G scrolls -a claude-code\n```\n\nOr without a global install: `npx -y @sugatoray-ai/aiskills install -G scrolls -a claude-code`.\n\n### No telemetry\n\n`npx skills` sends anonymous usage data to `skills.sh` unless `DISABLE_TELEMETRY` or `DO_NOT_TRACK` is set. `aiskills` passes both through:\n\n```bash\nDO_NOT_TRACK=1 aiskills install -G scrolls -a claude-code\n```\n\n### External skills\n\nPrefer `owner/repo@skill` over a bare name with `--route`. A bare name fails when the registry has several exact matches, the registry can change between runs, and a skill found by a lookup must be confirmed: with no terminal, `aiskills` stops with `not installing external skills without confirmation` unless you pass `-y`. Check what a lookup would install first with `-n`:\n\n```bash\naix i -n -s pdf\n```\n\nThen pin what it found (`aix i -s anthropics/skills@pdf`), or pass `-y` once you've checked the source.\n\n## Troubleshooting\n\n- **Exit code 1 with `could not read the agent list from 'npx skills'`**: an `-a` pattern needs `npx skills`. Pass plain agent names instead of patterns.\n- **The output has `npx skills` progress mixed in**: `npx skills` writes to the same terminal. Use the exit code, and `aiskills installed` afterwards.\n\nSee also: [CLI reference](../reference/cli.md) · [Errors and exit codes](../reference/errors.md) · [`llms.txt`](../llms.txt)\n"},{"id":"guides-choose-the-skills-cli-version","path":"guides/choose-the-skills-cli-version.md","title":"How to choose the `skills` CLI version","tab":"guides","md":"# How to choose the `skills` CLI version\n\nUse this when you need a different release of the `skills` CLI than the one `aiskills` pins, or when npm's release-age rule (`min-release-age`, `before`) refuses the pinned one.\n\nEvery `npx` call that `aiskills` makes runs one tested version of the `skills` CLI, `skills@1.7.6`, so a new release (or a compromised one) is never picked up without testing. `AISKILLS_SKILLS_LIB_VERSION` (the `skills` CLI library's version, not the bundled skills') overrides it with a version, a tag, an npm range or an interval. Its old name, `AISKILLS_SKILLS_VERSION`, still works but is deprecated, and is removed in 1.0.0.\n\n## Steps\n\n1. Set the version for one command:\n\n   <!-- verify -->\n   ```bash\n   AISKILLS_SKILLS_LIB_VERSION=latest aiskills skills --version\n   ```\n\n   ```text\n   [aiskills] using skills@latest from AISKILLS_SKILLS_LIB_VERSION, not the tested 1.7.6\n   [aiskills] running: npx -y skills@latest --version\n   ```\n\n2. Or give a range, and npm picks the newest version in it that its own rules allow. Interval notation is turned into an npm range:\n\n   <!-- verify -->\n   ```bash\n   AISKILLS_SKILLS_LIB_VERSION='[1.7.4, 1.8.0)' aiskills skills --version\n   ```\n\n   ```text\n   [aiskills] using skills@>=1.7.4 <1.8.0 from AISKILLS_SKILLS_LIB_VERSION, not the tested 1.7.6\n   [aiskills] running: npx -y 'skills@>=1.7.4 <1.8.0' --version\n   ```\n\n3. Or set it for every command, in your shell profile:\n\n   ```bash\n   export AISKILLS_SKILLS_LIB_VERSION='(..., 1.7.6]'\n   ```\n\n## Variations\n\n| Form | Example | npm gets | Means |\n| --- | --- | --- | --- |\n| Exact version (the default) | `1.7.6`, `1.8.0-beta.1` | the same | Exactly this release |\n| Tag | `latest`, `next` | the same | Whatever the tag points at now |\n| npm range | `~1.7.4`, `^1.7.0`, `1.7.x`, `>=1.7.4 <1.8.0`, `1.7.4 - 1.7.6`, `~1.7.4 \\|\\| 2.x` | the same | The newest version in the range |\n| `[x, ...)` | `[1.7.4, ...)`, `[1.7.4, ?)`, `[1.7.4, *)` | `>=1.7.4` | x or newer |\n| `(x, ...)` | `(1.7.4, ...)` | `>1.7.4` | Newer than x |\n| `[x, y)` | `[1.7.4, 1.8.0)` | `>=1.7.4 <1.8.0` | From x, up to but not including y |\n| `(x, y]`, `[x, y]` | `(1.7.0, 1.7.6]` | `>1.7.0 <=1.7.6` | `[`/`]` include the bound, `(`/`)` exclude it |\n| `(..., x]` | `(..., 1.7.6]`, `(?, 1.7.6]`, `(*, 1.7.6]` | `<=1.7.6` | x or older |\n| `(..., x)` | `(..., 1.7.6)` | `<1.7.6` | Older than x |\n\nAn open end is exactly one of `...` (three plain dots), `?` or `*`, and takes `(` or `)`. They can't be combined: `?*` or `*...` is refused. A typographic `…`, as autocorrect makes it from three dots, is read as `...`. All three are plain ASCII, so they type the same in every shell and Windows console. Quote the value in your shell: brackets, `?`, `*`, `<`, `>` and `|` mean something to it.\n\nAnything else is refused before `npx` runs, so a typo can't turn into a different package or a shell command:\n\n<!-- verify -->\n```bash\nAISKILLS_SKILLS_LIB_VERSION='1.7 && calc' aiskills find pdf\n```\n\n```text\n[aiskills] AISKILLS_SKILLS_LIB_VERSION must be a version (e.g. 1.7.6), \"latest\", \"next\", an npm range (e.g. ~1.7.4) or an interval (e.g. [1.7.4, 1.8.0)); got '1.7 && calc'\n```\n\nAn interval that no version fits, such as `[1.8.0, 1.7.0)`, is refused too, and so are tabs, line breaks and non-ASCII spaces between the parts of a range: only plain spaces separate them, because a range is passed to `npx` (and on Windows to `cmd.exe`) as typed. Spaces or a line break at the very start or end are dropped.\n\nWhenever `AISKILLS_SKILLS_LIB_VERSION` overrides the pinned version, `aiskills` says so once per command, even for commands that don't print the `npx` command (`ls`, `find`):\n\n<!-- verify -->\n```bash\nAISKILLS_SKILLS_LIB_VERSION='(..., 1.7.6]' aiskills skills --version\n```\n\n```text\n[aiskills] using skills@<=1.7.6 from AISKILLS_SKILLS_LIB_VERSION, not the tested 1.7.6\n[aiskills] running: npx -y 'skills@<=1.7.6' --version\n```\n\nSo a version set by a shell profile, a project's `.envrc` or a CI variable can't replace the tested one without a trace.\n\nOn Windows, set it the way your shell quotes:\n\n```powershell\n$env:AISKILLS_SKILLS_LIB_VERSION = '(..., 1.7.6]'   # PowerShell\n```\n\n```bat\nset \"AISKILLS_SKILLS_LIB_VERSION=(..., 1.7.6]\"      & rem Command Prompt: no single quotes, they'd become part of the value\n```\n\nGit Bash and WSL work like macOS and Linux. `npx` then runs through `cmd.exe`: a range's package argument (`skills@<=1.7.6`) is passed in double quotes, where `cmd.exe` reads `<`, `>`, `|` and `^` as plain text; every other argument still may not contain them.\n\n## When npm's release-age rule blocks the pinned version\n\nWith `min-release-age=7` (or `before=<date>`) in your `.npmrc`, npm refuses a version published more recently than that. If the pinned `skills` CLI is that new, every command that runs `npx` fails, and `aiskills` adds what to do after npm's own error:\n\n```text\n[aiskills] npm's release-age rule (min-release-age or before) blocked skills@1.7.6: npm only installs versions published before 11/2/2026, 9:53:24 AM, and this one is newer.\n[aiskills]   - wait until it is old enough ('npm view skills time' shows when each version came out), or\n[aiskills]   - relax the rule for one run: npm_config_min_release_age=0 aiskills <command>, or\n[aiskills]   - allow an older, untested skills CLI: AISKILLS_SKILLS_LIB_VERSION='(..., 1.7.6]' (npm picks the newest it may)\n```\n\n- **Wait.** The pinned version qualifies once it's old enough.\n- **Relax the rule for one run:** `npm_config_min_release_age=0 aiskills installed`. `aiskills` passes `npm_config_min_release_age`, `npm_config_min_release_age_exclude` and `npm_config_before` on to `npx`.\n- **Allow an older version:** `AISKILLS_SKILLS_LIB_VERSION='(..., 1.7.6]'` lets npm fall back to the newest version your rule allows.\n\n`min-release-age-exclude[]=skills` in `.npmrc` doesn't help here: `npm install` honours it, but `npx` (npm 11.21 and 12.2 tested) ignores it.\n\n## Troubleshooting\n\n- **`-a` patterns or `--route` stop working on another version**: `aiskills` reads two pieces of `npx skills` text output (the \"Valid agents:\" list and `find` results). If a release changes them, go back to the pinned version and report it.\n\n> [!WARNING]\n> `latest`, ranges and intervals give up the protection of the pinned, tested version: npm may pick a release nobody has tested with `aiskills`. Use them to try a release or to get past an age rule, not as a permanent setting.\n\nSee also: [`AISKILLS_SKILLS_LIB_VERSION`](../reference/environment.md#aiskills_skills_lib_version) · [Security model](../concepts/security.md)\n"},{"id":"guides-leave-files-out","path":"guides/leave-files-out.md","title":"How to leave files out of the package","tab":"guides","md":"# How to leave files out of the package\n\nThis guide is for maintainers of the [sugatoray/aiskills](https://github.com/sugatoray/aiskills) repo: use a `.skillsignore` to keep files, folders or whole skills out of the npm package.\n\nThe package is built from the repo's `skills/` folder when it is packed. A `.skillsignore` file, in `skills/` or any folder below it, lists what to leave out, in `.gitignore` syntax.\n\n## Steps\n\n1. Create or edit a `.skillsignore`, for example `skills/.skillsignore`:\n\n   ```gitignore\n   # every tests/ folder, at any depth\n   **/tests/\n   # all .log files except keep.log\n   *.log\n   !keep.log\n   # ignoring a skill's folder drops the whole skill\n   scrolls/wip-skill/\n   ```\n\n2. Build the package contents and look at them:\n\n   ```bash\n   cd src/packages/aiskills\n   npm run vendor\n   ```\n\n   What was left out is listed under `ignored` in `.aiskills/layout.json`.\n\n3. Run the tests, which compare the package with every git-tracked file under `skills/` that no `.skillsignore` excludes, then clean up:\n\n   ```bash\n   npm test\n   npm run clean\n   ```\n\n## Variations\n\n### Rules for one folder\n\nA `.skillsignore` deeper down applies to its own folder and below, after the outer rules. Its `!` rules can re-include files an outer rule left out.\n\n## Troubleshooting\n\n- **`.skillsignore ignores <group>/<skill>/SKILL.md; to drop a skill, ignore the folder (<group>/<skill>/) instead`**: ignoring only a `SKILL.md` would leave a skill without a definition. Ignore the folder.\n- **A pattern with a `/` in the middle doesn't match deeper files**: like `.gitignore`, a `/` in the middle anchors the pattern to the `.skillsignore`'s folder. Write `**/meta/MAINTAINERS.md` for any depth.\n- **A `#` after a pattern**: is part of the pattern. Put comments on their own lines.\n\nSee also: [`.skillsignore` reference](../reference/skillsignore.md) · [Files and schemas](../reference/files.md#aiskillslayoutjson)\n"},{"id":"concepts-how-it-works","path":"concepts/how-it-works.md","title":"How aiskills works","tab":"concepts","md":"# How aiskills works\n\n`aiskills` saves the bundled skills to one folder on your machine and asks `npx skills` to install them from there; it never writes into agent folders itself. Installing the npm package does neither: both happen only when you run `aiskills install`.\n\n![Architecture: the npm package syncs its skills to ~/.config/sugatoray/aiskills (1), aiskills runs npx skills add on that folder (2), and npx skills installs into the agents' skill folders (3); with --route, npx skills also finds and adds skills from the skills.sh registry and GitHub](../images/architecture.svg)\n\nThe same, as steps:\n\n1. **Sync.** The npm package carries the skills (one folder per skill), a map of their original folders (`.aiskills/layout.json`) and the repo's `marketplace.json`. `aiskills` copies them to the **install folder**, `~/.config/sugatoray/aiskills` (or `AISKILLS_HOME`), replacing `skills/` each time.\n2. **Add.** It runs `npx -y skills@1.7.6 add <install folder>` with your skills, agents and scope.\n3. **Install.** `npx skills` installs the skills into each agent's folder (`~/.claude/skills/`, `~/.agents/skills/`, or the project's folders with `-p`) and records where each one came from.\n\nWith `--route`, step 2 also runs `npx skills find` and `npx skills add <owner/repo@skill>` for skills that aren't bundled.\n\n## Who owns what\n\n| Thing | Owner | `aiskills` |\n| --- | --- | --- |\n| The skills in the package | The package version you installed | Reads |\n| `~/.config/sugatoray/aiskills/` | `aiskills` | Writes; `skills/` is replaced on every sync |\n| Agents' skill folders | `npx skills` | Never touches |\n| The record of installed skills | `npx skills` (`npx skills list --json`) | Reads, to know what it installed |\n\nA skill counts as installed **by `aiskills`** when `npx skills list --json` reports it with `sourceType` `local` and `source` equal to the install folder. That is how a full `aiskills uninstall` removes exactly its own skills and leaves same-named skills from other sources alone.\n\n## What a command does\n\n![Install flow: parse options, sync the install folder, select skills, expand agent patterns, look up external skills (with --route), then npx skills add; a problem in parsing, selection, agents or lookup stops with exit code 1 before anything is installed](../images/install-flow.svg)\n\n`aiskills install`, step by step:\n\n1. Parse the options. `AISKILLS_*` variables give the defaults; options replace them.\n2. Sync the install folder.\n3. Turn `-s` and `-G` (names, aliases, patterns) into exact skill names.\n4. Expand `-a` patterns against the agent list `npx skills` reports.\n5. With `--route`, look up every external name.\n6. Run `npx skills add` for the bundled skills, then once per external skill.\n\nEvery check and lookup in steps 1, 3, 4 and 5 runs before step 6. A problem stops the command with exit code 1 and installs nothing.\n\n`uninstall` reads `npx skills list --json`, keeps the rows from the install folder (or any source with `--route`), matches `-s`/`-G` against them, and runs `npx skills remove`.\n\n## Why it works this way\n\n- **One tool owns the agent folders.** `npx skills` already knows every agent's folder layout and keeps a record. Delegating to it keeps `aiskills` small and gives it new agents for free.\n- **A local folder works offline.** After the npm install, `aiskills install` needs no network except to fetch the `skills` CLI the first time. (The [skills.sh install count](install-count.md) afterwards uses github.com, and is skipped silently without it.)\n- **No runtime dependencies.** The package is plain Node.js.\n\n## Trade-offs and limits\n\n- **`npx skills` output is mixed in.** `aiskills` lets `npx skills` print to your terminal. Use exit codes and `aiskills installed` to check results.\n- **Two pieces of `npx skills` text are parsed**: the \"Valid agents:\" list (for `-a` patterns) and `find` results (for `--route`). A new `skills` release could change them, which is one reason the version is pinned.\n- **Updates come with the package, and you apply them.** Skills change when you install a newer `@sugatoray-ai/aiskills` and run `aiskills install` again; installing the package by itself never changes your agents.\n\nSee also: [Layouts](layouts.md) · [Security model](security.md) · [Files and schemas](../reference/files.md)\n"},{"id":"concepts-skill-groups","path":"concepts/skill-groups.md","title":"Skill groups","tab":"concepts","md":"# Skill groups\n\nA skill group is a named set of related skills, taken from the repo's `.claude-plugin/marketplace.json`; `-G` installs or removes a whole group at once.\n\n## Where groups come from\n\nThe package bundles the repo's `.claude-plugin/marketplace.json` (the Claude Code plugin marketplace file) and saves it to the install folder. `aiskills` reads it only to group the skills. Nothing is installed as a Claude Code plugin.\n\n| Part | Where it comes from |\n| --- | --- |\n| **Group name** | An entry's `name` under `plugins`, exactly as written, e.g. `scrolls-skills`. |\n| **Skills in the group** | Every skill whose original folder in the repo is under the entry's `source` (relative to `metadata.pluginRoot`, `./skills`). |\n| **Alias** | Not in the file. `aiskills` removes a trailing `-skills`: `scrolls-skills` → `scrolls`. A name without `-skills` is its own alias. |\n| **`all`** | Not in the file. A built-in group with every bundled skill, grouped or not. `-G '*'` is the same. |\n\nEntries whose `source` isn't a local folder (a git URL, say) are skipped, because their skills aren't in the package.\n\n## The groups in this version\n\n| Group | Alias | Skills |\n| --- | --- | --- |\n| `scrolls-skills` | `scrolls` | scrolls-help, scrolls-hide, scrolls-remove, scrolls-restore, scrolls-setup, scrolls-unhide, scrolls-update |\n| `stata-skills` | `stata` | stata-recipes |\n| `repo-related-skills` | `repo-related` | create-issues-update-pr |\n| `docs-skills` | `docs` | create-lib-docs |\n| `diagrams-skills` | `diagrams` | network-flow |\n| `personas-skills` | `personas` | prodigy |\n| `video-related-skills` | `video-related` | dynamic-promo-video |\n| `image-styles-skills` | `image-styles` | artwallbg, commentdrop |\n| `all` (built in) | | all 15 skills |\n\nEvery bundled skill is in a group. A skill in no group would be listed as ungrouped and installed with `-s <name>` or `-G all`. `aiskills groups` always shows the list for the version you have.\n\n## How names are matched\n\n- Name or alias, in any letter case: `scrolls-skills`, `scrolls` and `Scrolls` are the same group.\n- Patterns match both the name and the alias: `-G 'd*'` selects `docs-skills` and `diagrams-skills`.\n- A name or pattern that matches no group stops the command and lists the valid ones.\n- `-G` and `-s` add up: you get the union.\n\n## Why membership uses the original folders\n\nThe install folder can be [flat or nested](layouts.md). Group membership is worked out from each skill's original folder, recorded in `.aiskills/layout.json`, so a group has the same skills in either layout.\n\n## Adding a group\n\nFor maintainers: add a `plugins` entry to the repo's `.claude-plugin/marketplace.json` whose `source` is a folder under `skills/`, and publish a new package version. No code changes.\n\nSee also: [`groups`](../reference/cli.md#groups) · [`-G`, `--group`](../reference/cli.md#-g---group---groups) · [1. Install a group](../tutorial/01-install-a-group.md)\n"},{"id":"concepts-layouts","path":"concepts/layouts.md","title":"Layouts: flat and nested","tab":"concepts","md":"# Layouts: flat and nested\n\nThe install folder's `skills/` can be written flat (one folder per skill, the default) or nested (the repo's own folders); agents get the same skills either way.\n\n![Two layouts: --flat writes skills/<skill>/ for every skill; --nested writes the repo's skills/<group>/<skill>/ folders, with group files such as README.md](../images/layouts.svg)\n\n| Layout | `skills/` looks like | Use it when |\n| --- | --- | --- |\n| `flat` (default) | `skills/scrolls-setup/SKILL.md`, `skills/prodigy/SKILL.md`, … | You just want the skills |\n| `nested` | `skills/scrolls/scrolls-setup/SKILL.md`, `skills/scrolls/README.md`, `skills/personas/prodigy/SKILL.md`, … | You browse or edit the skills, or a tool expects the repo's layout |\n\n## How the choice is made\n\nThe first of these that is set wins:\n\n1. `--flat` or `--nested` on the command line;\n2. `AISKILLS_LAYOUT` (`flat` or `nested`);\n3. the layout of the last sync, saved as `layout` in `aiskills.json`;\n4. `flat`.\n\nSo a choice is remembered until you pass the other flag.\n\n## Why the package ships flat\n\n- `npx skills experimental_sync` finds skills in a `node_modules` package only one level deep, at `skills/<name>/SKILL.md`. Shipping flat makes the package work with it. See [the guide](../guides/use-experimental-sync.md).\n- Each folder is named after the skill's `name:`, so names are unique and easy to find.\n\n## How nested is rebuilt\n\nThe package also carries `.aiskills/layout.json` (each skill's original folder, e.g. `scrolls-setup` → `scrolls/scrolls-setup`) and `.aiskills/nested/` (every file outside a skill folder, such as group READMEs and `plugin.json` files). `--nested` puts the skills back in their original folders and adds those files, which gives the repo's `skills/` folder byte for byte, minus anything a `.skillsignore` left out.\n\nnpm drops files named `.gitignore` and `.npmignore` from packages, so the package stores them as `_gitignore` and `_npmignore`, and every sync renames them back.\n\n## Trade-offs and limits\n\n- Every sync replaces `skills/` completely. Don't keep your own files there.\n- The layout changes only the install folder. Agent folders get the same skills, named the same way.\n\nSee also: [Keep the repo's nested layout](../guides/keep-the-nested-layout.md) · [`--nested`](../reference/cli.md#--nested) · [`AISKILLS_LAYOUT`](../reference/environment.md#aiskills_layout)\n"},{"id":"concepts-bundled-and-external","path":"concepts/bundled-and-external.md","title":"Bundled and external skills","tab":"concepts","md":"# Bundled and external skills\n\nBundled skills ship in this package; external skills come from anywhere else, and `aiskills` manages them only when you add `--route` (or use `aix`).\n\n## The difference\n\n| | Bundled | External |\n| --- | --- | --- |\n| Where it comes from | This package, via `~/.config/sugatoray/aiskills` | The skills.sh registry, GitHub, a URL or a path |\n| Installed by | `npx skills add <install folder> --skill <name>` | `npx skills add <owner/repo@skill>` |\n| Needs `--route` | No | Yes |\n| Shown by `installed` | Yes | Only with `--route` |\n| Removed by a full `uninstall` | Yes | Never; name it with `--route` |\n\n## What `--route` changes\n\n**install.** Each `-s` entry that isn't bundled is handed to `npx skills`:\n\n| `-s` entry | What happens |\n| --- | --- |\n| A bundled name or a pattern | Installed from the install folder, as without `--route`. Patterns only match bundled skills. |\n| A bare name that isn't bundled, e.g. `pdf` | `npx skills find pdf`; installed only if exactly one result is named exactly `pdf`, and only after you confirm it (`y` at the prompt, or `-y`). |\n| `owner/repo@skill` | `npx skills add owner/repo@skill`, no lookup. |\n| `owner/repo`, a URL or a path | `npx skills add <spec>`, which installs the skills found there. |\n\n**uninstall.** Names and patterns also match skills from other sources. `owner/repo@skill` is reduced to `skill`; a bare `owner/repo` is refused because it names no skill. Names that aren't installed are skipped with a warning. A full uninstall still removes only bundled skills.\n\n**installed.** Lists every skill in the scope, with a source column: `bundled`, or the source `npx skills` recorded.\n\n## Why a bare name needs exactly one match\n\nThe registry is shared and changes. If two repositories both publish a skill called `pdf`, picking one would be a guess about which code you trust. `aiskills` stops and lists the candidates so you can choose with `owner/repo@skill`. It also ignores results whose `owner/repo@skill` contains anything but letters, digits, `.`, `_` and `-`.\n\n## Why a found skill is confirmed\n\nEven a unique exact match is the registry's choice, not yours: anyone can publish a skill called `pdf`. So `aiskills` shows what the lookup found (`owner/repo@skill`, its install count, and the name you typed) and asks `Install <n> external skill(s) from the registry? [y/N]` before installing anything, bundled skills included. Only `y` or `yes` installs.\n\n- With no terminal to ask in (a script, CI, an agent), it stops instead, unless you pass `-y` (`--yes`).\n- `-n` (`--dry-run`) shows the matches and the exact commands without installing.\n- An `owner/repo@skill`, URL or path is never asked about: you named the source yourself.\n\n## Trade-offs and limits\n\n- `npx skills remove` removes by name, so `--route uninstall -s pdf` removes `pdf` whichever source it came from.\n- External skills aren't copied into the install folder, and `--purge` doesn't remove them.\n- Lookups need network access to `skills.sh`.\n\nSee also: [4. Add external skills](../tutorial/04-add-external-skills.md) · [`--route`](../reference/cli.md#--route) · [Security model](security.md)\n"},{"id":"concepts-security","path":"concepts/security.md","title":"Security model","tab":"concepts","md":"# Security model\n\n`aiskills` writes only to its install folder, starts only a pinned `npx skills`, and checks anything from the registry before using it; the skills themselves are code your agent may run.\n\nThe full policy, including how to report a vulnerability, is in the package's [SECURITY.md](../../../SECURITY.md). This page explains the model.\n\n## What it touches\n\n| What | When |\n| --- | --- |\n| `~/.config/sugatoray/aiskills/` (or `AISKILLS_HOME`) | Written by `install`, `sync`, `list` and `groups`. `skills/` is replaced each time. `--purge` deletes the folder. |\n| Agents' skill folders | Only through `npx skills add` / `remove`. |\n| An empty temporary folder | While reading the agent list for `-a` patterns; deleted straight after. |\n| A temporary `aiskills-stats-*` folder | The [skills.sh install count](install-count.md) after `install`: a throwaway project install from GitHub, deleted when it ends. |\n| The network | Never directly. `npx` downloads the `skills` CLI; `npx skills` talks to `skills.sh` and GitHub, including for the [skills.sh install count](install-count.md). |\n\n## Protections\n\nEach one is covered by the test suite.\n\n- **No install step.** The package has no `preinstall`, `install` or `postinstall` script, so `npm install` (or pnpm, or bun) only puts files in npm's own folder: no network calls, nothing written to your home folder, no agent changed. Your agents change only when you run `aiskills install`.\n- **Pinned `skills` CLI.** Every call is `npx -y skills@1.7.6 ...`, so a new or compromised release isn't used until it has been tested. [`AISKILLS_SKILLS_LIB_VERSION`](../reference/environment.md#aiskills_skills_lib_version) overrides it with a version, `latest`, `next`, an npm range or an interval (`[1.7.4, 1.8.0)`), and refuses anything that isn't made of version characters. Before a new version is pinned, `npm run audit:skills` checks it has no high or critical advisory and is at least 7 days old.\n- **Registry results are checked.** With `--route`, a `find` result is used only if its `owner/repo@skill` is made of letters, digits, `.`, `_` and `-`, and a bare name needs exactly one exact match.\n- **Found skills are confirmed.** A skill the registry lookup chose is shown (source, install count) and installed only after you answer `y`, or pass `-y`. Without a terminal and without `-y`, nothing is installed. Pinned `owner/repo@skill` specs aren't asked about. See [`-y`](../reference/cli.md#-y---yes).\n- **No shell syntax on Windows.** `npx.cmd` runs through `cmd.exe`, so `aiskills` refuses arguments containing `& | < > ^ % ! \" ( )`.\n- **Only its own folders are replaced or deleted.** `sync`, `install` and `uninstall --purge` refuse a folder that has other files but no `aiskills.json`. This guards against an `AISKILLS_HOME` pointed at the wrong place.\n- **npm's own variables are removed** before `npx` runs (registry, proxy and certificate settings are kept).\n- **No runtime dependencies.**\n\n## Skills are code\n\nAgent skills contain instructions, and sometimes scripts, that your agent may run with your permissions. Bundled skills come from the [sugatoray/aiskills](https://github.com/sugatoray/aiskills) repo at the version you installed; you can read them in `~/.config/sugatoray/aiskills/skills/`. External skills are third-party code: prefer `owner/repo@skill` from sources you trust.\n\n## Telemetry\n\n`aiskills` sends nothing itself. The `skills` CLI sends anonymous usage data to `skills.sh` unless `DISABLE_TELEMETRY` or `DO_NOT_TRACK` is set; `aiskills` passes both through. After an install, `aiskills` runs `npx skills add sugatoray/aiskills` in a temp folder so the install is counted on skills.sh: see [The skills.sh install count](install-count.md). `--no-stats`, `AISKILLS_STATS=0`, `DO_NOT_TRACK`, `DISABLE_TELEMETRY` and `CI` turn that off.\n\nSee also: [Errors and exit codes](../reference/errors.md) · [Choose the `skills` CLI version](../guides/choose-the-skills-cli-version.md)\n"},{"id":"concepts-install-count","path":"concepts/install-count.md","title":"The skills.sh install count","tab":"concepts","md":"# The skills.sh install count\n\nAfter `aiskills install`, a background `npx skills add sugatoray/aiskills` adds the install to each skill's count on [skills.sh](https://skills.sh); it needs github.com, fails silently without it, and `--no-stats` turns it off.\n\n## Why it exists\n\nskills.sh shows how often each skill is installed. The `skills` CLI reports an install only when it installs from GitHub (`npx skills add owner/repo`). `aiskills install` registers the skills from a local folder, `~/.config/sugatoray/aiskills`, so without this step none of its installs would be counted.\n\n## What happens\n\nAfter a successful install of bundled skills, `aiskills` prints one line and returns:\n\n```text\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nIn the background, in a new temp folder, it runs:\n\n```bash\nnpx -y skills@1.7.6 add sugatoray/aiskills --skill <each installed skill> --agent <your -a, or universal> --copy --yes\n```\n\n1. The `skills` CLI shallow-clones `https://github.com/sugatoray/aiskills` and installs the skills into the temp folder (a project install).\n2. It asks `api.github.com` whether the repo is public; only then does it send `skills.sh` its usual install event: the repo, the skill names, the agents, its own version, and the AI agent it runs under, if it detects one.\n3. `aiskills` deletes the temp folder. It stops the run after 2 minutes.\n\nYour agents keep using the copy in `~/.config/sugatoray/aiskills`; nothing from the temp folder is kept, and your global skills and projects aren't touched.\n\n| Install | Counted |\n| --- | --- |\n| `aiskills install`, with or without `-s`, `-G`, `-a`, `-p` | ✓ the skills installed, for the agents you named (`universal` if none) |\n| A failed install | |\n| `aiskills install -n` | shows the command as `[dry-run] skills.sh count: ...` |\n| External skills (`--route`, `aix`) | by `npx skills add owner/repo@skill` itself |\n| `aiskills sync` | |\n\n## Without access to github.com\n\nBehind a firewall or a proxy that blocks github.com, the clone (or the check with api.github.com) fails. Then nothing is counted and nothing is shown, and the install's exit status is unchanged: it had already finished. To see what the count does, run it in the foreground:\n\n```bash\nAISKILLS_STATS_FOREGROUND=1 aiskills install\n```\n\n## Turning it off\n\n| How | Lasts |\n| --- | --- |\n| `aiskills install --no-stats` | Remembered in `aiskills.json` until `--stats` |\n| `aiskills sync --no-stats` | The same, without installing anything |\n| [`AISKILLS_STATS=0`](../reference/environment.md#aiskills_stats) | While it's set; wins over the remembered choice, not over `--stats` |\n| `DO_NOT_TRACK`, `DISABLE_TELEMETRY` (any value) | Always off, even with `--stats`; they also turn off the `skills` CLI's own telemetry |\n| `CI`, `GITHUB_ACTIONS` set | Always off |\n\nSee also: [Security model](security.md) · [`--no-stats`](../reference/cli.md#--no-stats) · [Environment variables](../reference/environment.md)\n"},{"id":"reference-cli","path":"reference/cli.md","title":"CLI reference","tab":"reference","md":"# CLI reference\n\nEvery command, alias and option of `aiskills`, `ais` and `aix`; this page is exhaustive.\n\n```text\naiskills <command> [options] [-- <extra npx skills arguments>]\n```\n\n- **`aiskills`** and **`ais`** are the same command.\n- **`aix`** is `aiskills --route`: `aix i -s pdf` = `aiskills --route install -s pdf`.\n- With no command, `aiskills` runs `install`.\n- `--route`, `--nested` and `--flat` can also go **before** the command: `aiskills --route installed`, `aiskills --nested` (= `install --nested`).\n- Options are checked per command. An option a command doesn't take fails with `option <x> is not valid here`.\n\n## Commands\n\n| Command | Aliases | Does |\n| --- | --- | --- |\n| [`install`](#install) | `i` | Save the skills and run `npx skills add` on them (the default command) |\n| [`uninstall`](#uninstall) | `r`, `rm`, `remove` | Remove skills with `npx skills remove` |\n| [`installed`](#installed) | `ls` | Show installed skills |\n| [`groups`](#groups) | `g` | List the skill groups |\n| [`find`](#find) | `f` | Search the skills registry |\n| [`sync`](#sync) | | Only save or refresh the skills folder |\n| [`list`](#list) | | List the skills in the saved folder, via `npx skills` |\n| [`path`](#path) | `p` | Print the install folder |\n| [`info`](#info) | | Show this setup: versions, folders, settings and where each comes from |\n| [`releases`](#releases) | `rel` | Show the latest releases on npm, optionally with download counts |\n| [`upgrade`](#upgrade) | | Install the latest aiskills globally and update the skills your agents have |\n| [`skills`](#skills) | | Pass arguments to `npx skills` |\n| [`help`](#help) | `h`, `-h`, `--help` | Show the help |\n| [`-v`, `--version`](#-v---version) | | Print the version |\n\n`sync`, `skills` and `list` have no one-letter alias on purpose: `s` would be ambiguous, and `l` looks like `ls`.\n\n### `install`\n\nSave the skills to the install folder (see [`sync`](#sync)), then run `npx skills add <install folder>` with the selected skills and agents.\n\n```text\naiskills install [-g|-p] [-a agents] [-s skills] [-G groups] [-i] [-l] [--copy] [--route] [-y] [-n] [--nested|--flat] [-- <extra>]\n```\n\n| | |\n| --- | --- |\n| Alias | `i` |\n| Options | [`-g`](#-g---global), [`-p`](#-p---project), [`-a`](#-a---agent), [`-s`](#-s---skill), [`-G`](#-g---group---groups), [`-i`](#-i---interactive), [`-l`](#-l---last-agents), [`--copy`](#--copy), [`--route`](#--route), [`-y`](#-y---yes), [`-n`](#-n---dry-run), [`--nested`](#--nested), [`--flat`](#--flat), [`--`](#--) |\n| Default | Every skill, `--global`, agents detected by `npx skills` |\n| Exit code | `1` if a name, pattern or lookup fails, or an external skill isn't confirmed (nothing is installed); otherwise the exit code of `npx skills add` |\n\n<!-- verify -->\n```bash\naiskills install\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill '*' --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\nWith `-s`/`-G`, it prints `bundled: <names>` first. With `--route`, names that aren't bundled are looked up; each skill the lookup found is shown and must be confirmed (see [`-y`](#-y---yes)) before anything, bundled skills included, is installed. External skills are installed after the bundled ones (`external: <spec>`).\n\nSee: [1. Install a group](../tutorial/01-install-a-group.md) · [2. Pick skills and agents](../tutorial/02-pick-skills-and-agents.md)\n\n### `uninstall`\n\nRemove skills with `npx skills remove <names> --yes`.\n\n```text\naiskills uninstall [-g|-p] [-a agents] [-s skills] [-G groups] [--route] [--purge] [-f] [-n] [-- <extra>]\n```\n\n| | |\n| --- | --- |\n| Aliases | `r`, `rm`, `remove` |\n| Options | [`-g`](#-g---global), [`-p`](#-p---project), [`-a`](#-a---agent), [`-s`](#-s---skill), [`-G`](#-g---group---groups), [`--route`](#--route), [`--purge`](#--purge), [`-f`](#-f---force), [`-n`](#-n---dry-run), [`--`](#--) |\n| Default | A **full uninstall**: every skill `npx skills list --json` reports as installed from the install folder |\n| Exit code | `1` on a refused name or option; otherwise the exit code of `npx skills remove` (`0` if there was nothing to remove) |\n\n- **Full** (no `-s`/`-G`): removes exactly the skills recorded as installed from the install folder, even with `--route`. If `npx skills list` can't be read, it falls back to every skill in the folder, with a warning.\n- **Partial** (`-s`/`-G`): names this package doesn't provide are refused, unless `--route` or `-f`. Skills reached through a pattern or group are removed only if installed.\n- **`-a`** removes the skills from those agents only.\n- The skill files stay in the install folder unless `--purge`.\n\n<!-- verify: list=prodigy,stata-recipes -->\n```bash\naiskills uninstall -G stata -n\n```\n\n```text\n[aiskills] [dry-run] would remove (global): stata-recipes\n[aiskills] [dry-run] npx -y skills@1.7.6 remove stata-
