recipes --global --yes\n```\n\nSee: [5. Uninstall](../tutorial/05-uninstall.md) · [Remove everything](../guides/remove-everything.md)\n\n### `installed`\n\nList the skills `npx skills` reports as installed from the install folder, one per line: name, group, agents.\n\n```text\naiskills installed [-g|-p] [--route]\n```\n\n| | |\n| --- | --- |\n| Alias | `ls` |\n| Options | [`-g`](#-g---global), [`-p`](#-p---project), [`--route`](#--route) (all skills, with a source column) |\n| Exit code | `1` if `npx skills list` can't be read |\n\n<!-- verify: list=scrolls-setup,owner/repo@pdf -->\n```bash\naiskills ls\n```\n\n```text\nscrolls-setup              scrolls-skills         Claude Code\n```\n\nOnly skills installed from the install folder are listed; `pdf`, installed from `owner/repo`, is left out (add `--route` to list it). A `-` in the group column means the skill belongs to no group.\n\n### `groups`\n\nList the skill groups from the bundled `marketplace.json`, with their aliases and skills, and the skills in no group. Syncs the install folder first, quietly.\n\n```text\naiskills groups [--json]\n```\n\n| | |\n| --- | --- |\n| Alias | `g` |\n| Options | [`--json`](#--json) |\n\nOutput: see [1. Install a group](../tutorial/01-install-a-group.md#see-the-groups); JSON shape: [Files and schemas](files.md#aiskills-groups---json).\n\n### `find`\n\nSearch the skills registry: `aiskills find <query>` runs `npx skills find <query>`. Every argument is passed on.\n\n| | |\n| --- | --- |\n| Alias | `f` |\n| Exit code | The exit code of `npx skills find` |\n\n### `sync`\n\nSave or refresh `<install folder>/skills/` from the package, without running `npx skills add`. Also writes `marketplace.json`, `layout.json` and `aiskills.json` next to it.\n\n```text\naiskills sync [--nested|--flat]\n```\n\n| | |\n| --- | --- |\n| Options | [`--nested`](#--nested), [`--flat`](#--flat) |\n\n<!-- verify -->\n```bash\naiskills sync\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n```\n\n### `list`\n\nSync, then run `npx skills add <install folder> --list`, which lists the skills there without installing them. Takes no options.\n\n<!-- verify -->\n```bash\naiskills list\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --list\n```\n\n### `path`\n\nPrint the install folder: `~/.config/sugatoray/aiskills`, or `AISKILLS_HOME` if set. Changes nothing.\n\n| | |\n| --- | --- |\n| Alias | `p` |\n\n<!-- verify -->\n```bash\naiskills p\n```\n\n```text\n~/.config/sugatoray/aiskills\n```\n\n### `info`\n\nShow this setup, like `conda info`: the aiskills version, where npm installed it, Node, the install folder and its saved skills, every setting with where its value comes from, the `npx skills` lock file and the agents last picked in it, and every `AISKILLS_*` variable that is set. It reads local files only: no network, no `npx`, so it is instant and works offline.\n\n```text\naiskills info [--full] [--json]\n```\n\n| | |\n| --- | --- |\n| Options | [`--full`](#--full), [`--json`](#--json) |\n| Exit code | `0` |\n\n<!-- verify -->\n```bash\naiskills info\n```\n\n```text\n  aiskills version : 0.9.0\n…\n      install root : ~/.config/sugatoray/aiskills  (AISKILLS_HOME)\n      saved skills : 15 skills in 8 groups, flat layout\n…\n        skills CLI : skills@1.7.6  (pinned, tested)\n             scope : global  (default)\n            layout : flat  (remembered)\n             stats : on  (default)\n             route : off  (default)\n\n  skills lock file : ~/.agents/.skill-lock.json  (not created yet)\nlast-picked agents : none  (used by install -l)\n…\n```\n\n(The examples on these pages run with `AISKILLS_HOME` set, so the install root's source shows as `AISKILLS_HOME`; without it, it is `default`.)\n\nWhat each line means:\n\n| Line | Shows | Where it comes from (in brackets) |\n| --- | --- | --- |\n| `aiskills version`, `package path`, `node version` | This package, the folder npm installed it in, Node and the platform | |\n| `install root` | The install folder; `not created yet` before the first `install` or `sync` | `default` or `AISKILLS_HOME` |\n| `saved skills`, `saved by` | What the last `install`/`sync` saved, and which aiskills version saved it; `not this version` means run `aiskills install` again | `aiskills.json` |\n| `skills CLI` | The `skills` package `npx` runs | `pinned, tested`, or the variable that overrides it |\n| `scope`, `layout`, `stats`, `route` | The defaults `install` would use with no options | `default`, an `AISKILLS_*` variable, `remembered` (in `aiskills.json`), or, for stats, `DO_NOT_TRACK`, `DISABLE_TELEMETRY`, `CI` or `GITHUB_ACTIONS` |\n| `skills lock file`, `last-picked agents` | The lock file `npx skills` keeps, and the agents [`-l`](#-l---last-agents) would use | |\n| `env overrides` | Every `AISKILLS_*` variable that is set, one per line | |\n\nWith [`--full`](#--full) it also asks npm and `npx skills` (a few seconds; needs network), and adds:\n\n```text\n     latest on npm : 0.8.0  (up to date)\n  installed skills : 13 from the install root, 2 from other sources  (global)\n         per agent : Claude Code 13, Codex 13\n```\n\n`latest on npm` says `up to date`, `update available: npm install -g @sugatoray-ai/aiskills@latest`, or that this version is not published; if npm can't be reached it says `unavailable` and why, and the command still succeeds. `installed skills` counts what `npx skills list` reports for the current scope.\n\nSee also: [Use aiskills from an AI agent or a script](../guides/use-from-an-agent.md)\n\n### `releases`\n\nShow the package's latest releases on npm, newest first, like the Versions tab on npmjs.com: the version, when it was published (date and age), its dist-tag, and which one you have installed. Read with `npm view`, so your npm registry and proxy settings apply.\n\n```text\naiskills releases [<n>|all] [-L|--last <n|all>] [--downloads [period]] [--chart|--table] [--by day|week|month] [--ascii] [--json]\n```\n\n| | |\n| --- | --- |\n| Alias | `rel` |\n| Options | [`-L`, `--last`](#-l---last), [`--downloads`](#--downloads), [`--chart`](#--chart), [`--table`](#--table), [`--by`](#--by), [`--ascii`](#--ascii), [`--json`](#--json) |\n| Default | The latest 5 releases, no download counts |\n| Exit code | `1` if the count or period is invalid (checked before any network call), or npm or api.npmjs.org can't be reached; otherwise `0` |\n\nThe examples below run against sample registry data, with today set to 2026-11-21.\n\n<!-- verify -->\n```bash\naiskills rel 3\n```\n\n```text\n@sugatoray-ai/aiskills: latest 3 of 6 releases\n\n  VERSION  PUBLISHED                 TAG\n  0.9.0    2026-11-20 (1 day ago)    latest  ← installed\n  0.8.0    2026-11-12 (9 days ago)\n  0.7.0    2026-11-11 (10 days ago)\n\nmore: aiskills rel all\n\nchangelog: /usr/local/lib/node_modules/@sugatoray-ai/aiskills/CHANGELOG.md\n           https://github.com/sugatoray/aiskills/blob/master/src/packages/aiskills/CHANGELOG.md\n```\n\n- How many: a number or `all` right after the command (`aiskills rel 10`, `aiskills rel all`), or the same with [`-L`/`--last`](#-l---last). Default: 5.\n- An older installed version gets `update available: <installed> → <latest>  (npm install -g @sugatoray-ai/aiskills@latest)`; one that isn't on npm gets `installed: <version> (not published on npm)`.\n- npm's staged-publish placeholder (`0.0.0-stage`) is not a release and is never listed.\n- The last line points to the changelog twice: the copy inside the installed package (readable offline, and behind a firewall that blocks GitHub) and the one on GitHub (which also covers newer versions).\n- **Behind a registry mirror** (Artifactory, Nexus, Verdaccio, …) the list comes from the mirror, because `npm view` uses your npm config. A mirror that doesn't pass on npm's publish times still gets every version, newest first by version number, with `–` as the date and the note `publish dates: not reported by <registry>`. [`--downloads`](#--downloads) needs api.npmjs.org itself, which registry mirrors don't serve. See [FAQ: firewalls and mirrors](../faq.md#does-aiskills-work-behind-a-firewall-or-with-an-npm-mirror).\n\nWith [`--downloads`](#--downloads), a 7-day download column is added, then the package's total over the period and a breakdown, as a chart by default:\n\n<!-- verify -->\n```bash\naiskills rel --downloads\n```\n\n```text\n@sugatoray-ai/aiskills: latest 5 of 6 releases\n\n  VERSION  PUBLISHED                 TAG     DOWNLOADS (7 DAYS)\n  0.9.0    2026-11-20 (1 day ago)    latest                   –  ← installed\n  0.8.0    2026-11-12 (9 days ago)                            –\n  0.7.0    2026-11-11 (10 days ago)                           –\n  0.6.0    2026-11-11 (10 days ago)                           –\n  0.5.0    2026-11-09 (12 days ago)                         140\n\nmore: aiskills rel all\n\ndownloads, all versions: 424 all time (2026-11-09 → 2026-11-10)\nper-version counts cover the last 7 days only (npm keeps no older ones); – = no count yet\nthe total includes versions not listed here (0.0.0-stage)\n\n  2026-11-09 ██████████████████████████████ 402  0.4.0, 0.5.0 published\n  2026-11-10 █▋                              22\n\nchangelog: /usr/local/lib/node_modules/@sugatoray-ai/aiskills/CHANGELOG.md\n           https://github.com/sugatoray/aiskills/blob/master/src/packages/aiskills/CHANGELOG.md\n```\n\nHow to read it:\n\n- **`DOWNLOADS (7 DAYS)`** is per version, and only for the last 7 days: npm keeps no older per-version counts, so per-version all-time numbers don't exist anywhere. `–` means npm has no count for that version yet (its counts lag a day or two).\n- **The total line** covers the whole package (every version) over the period you chose, `all time` by default. It includes versions the table hides, such as `0.0.0-stage`.\n- **The breakdown** has one row per day for periods up to 31 days, per week up to 183 days, and per month beyond that ([`--by`](#--by) overrides it). Each row names the versions published in it. Bars are scaled to the busiest row; a run of 3 or more empty rows is shortened to its first and last row. A week or month the period only partly covers says `(partial: <n> of <m> days)`. Days after npm's latest data (usually yesterday) are left out.\n\nThe same breakdown as a plain table, with [`--table`](#--table):\n\n<!-- verify -->\n```bash\naiskills rel 1 --downloads 7d --table\n```\n\n```text\n@sugatoray-ai/aiskills: latest 1 of 6 releases\n\n  VERSION  PUBLISHED               TAG     DOWNLOADS (7 DAYS)\n  0.9.0    2026-11-20 (1 day ago)  latest                   –  ← installed\n\nmore: aiskills rel all\n\ndownloads, all versions: 424 in the last 7 days (2026-11-04 → 2026-11-10)\nper-version counts cover the last 7 days only (npm keeps no older ones); – = no count yet\nthe total includes versions not listed here (0.0.0-stage)\n\n  DAY         DOWNLOADS  RELEASED\n  2026-11-04          0\n  2026-11-05          0\n  2026-11-06          0\n  2026-11-07          0\n  2026-11-08          0\n  2026-11-09        402  0.4.0, 0.5.0\n  2026-11-10         22\n\nchangelog: /usr/local/lib/node_modules/@sugatoray-ai/aiskills/CHANGELOG.md\n           https://github.com/sugatoray/aiskills/blob/master/src/packages/aiskills/CHANGELOG.md\n```\n\nJSON (`--json`), for scripts: `{ \"package\", \"registry\", \"installed\", \"latest\", \"total\", \"releases\": [{ \"version\", \"published\", \"tags\": [string], \"installed\": boolean, \"downloadsLastWeek\"?: number|null }], \"downloads\"?: { \"start\", \"end\", \"label\", \"total\", \"by\", \"rows\": [{ \"start\", \"end\", \"downloads\", \"partial\": boolean, \"published\": [string] }] } }`. Dates are `YYYY-MM-DD`; `published` on a release is npm's ISO 8601 timestamp, or `null` when the registry doesn't report it. `registry` is the registry `npm view` asked (`npm config get registry`).\n\nSee also: [FAQ: Which agents…](../faq.md) · [Errors: Releases and downloads](errors.md#releases-and-downloads)\n\n### `upgrade`\n\nInstall a newer aiskills (the latest, or the version or tag you name) with the package manager that installed it globally, then re-add the skills installed from the install folder, for the same agents, by running the new version. Without that second step your agents would keep the old skills: `npx skills` copies each skill into its own folder.\n\n```text\naiskills upgrade [<version>|<tag>] [--check [--json]] [--no-refresh] [-n] [-y]\n```\n\n| | |\n| --- | --- |\n| Options | [`--check`](#--check), [`--json`](#--json), [`--no-refresh`](#--no-refresh), [`-n`](#-n---dry-run), [`-y`](#-y---yes) |\n| Default | Upgrade to the `latest` tag, then refresh the skills (global) |\n| Exit code | `0` if upgraded, already up to date, or with `--check` (whatever it finds); `1` if aiskills can't upgrade itself, the version is unknown, or a downgrade isn't confirmed; otherwise the package manager's exit code |\n\nCheck first, without changing anything (the examples here run with 0.8.0 installed and 0.9.0 on the registry):\n\n<!-- verify: version=0.8.0 -->\n```bash\naiskills upgrade --check\n```\n\n```text\n[aiskills] installed: 0.8.0 (npm, global) · latest: 0.9.0 (published 2026-11-20)\n[aiskills] update available: run 'aiskills upgrade'\n```\n\nThen upgrade:\n\n<!-- verify: version=0.8.0 list=scrolls-setup,scrolls-update -->\n```bash\naiskills upgrade\n```\n\n```text\n[aiskills] installed: 0.8.0 (npm, global) · latest: 0.9.0 (published 2026-11-20)\n[aiskills] changes: https://github.com/sugatoray/aiskills/blob/master/src/packages/aiskills/CHANGELOG.md\n[aiskills] running: npm install -g @sugatoray-ai/aiskills@0.9.0\nchanged 1 package in 1s\n[aiskills] refreshing 2 skills for claude-code (global) with aiskills 0.9.0\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: scrolls-setup, scrolls-update\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill scrolls-setup --skill scrolls-update --agent claude-code --yes\n[aiskills] project installs aren't refreshed: run 'aiskills install -p' in each project that uses them\n[aiskills] upgraded 0.8.0 → 0.9.0\n```\n\nWhat it does, in order:\n\n1. **Picks the target** from `npm view` (your npm config applies): `latest`, or the `<version>` or `<tag>` you give (`aiskills upgrade 0.9.1`, `aiskills upgrade next`). If you already have it: `already up to date (<version>)`, and nothing changes.\n2. **Finds out how aiskills was installed**, from where its files are. Only a global install can upgrade itself:\n\n   | Installed with | `upgrade` runs |\n   | --- | --- |\n   | `npm install -g` | `npm install -g @sugatoray-ai/aiskills@<version>` |\n   | `pnpm add -g` | `pnpm add -g @sugatoray-ai/aiskills@<version>` |\n   | `bun add -g` | `bun add -g @sugatoray-ai/aiskills@<version>` |\n   | `yarn global add` | `yarn global add @sugatoray-ai/aiskills@<version>` |\n   | `npx @sugatoray-ai/aiskills …` | nothing; says to run `npx @sugatoray-ai/aiskills@latest install` |\n   | a project's dependency | nothing; says to run `npm install -D @sugatoray-ai/aiskills@latest` |\n   | a source checkout | nothing; says to `git pull` or install the package |\n\n3. **Installs it**, showing the package manager's output. A permission error gets a hint (don't use `sudo`; give npm a folder you own); npm's release-age refusal gets the [usual explanation](errors.md#npms-release-age-rule-blocked-the-skills-cli).\n4. **Refreshes the skills**: for each set of agents, runs the new version's `aiskills install -g -s <skills> -a <agents>` for the skills `npx skills list` reports as installed from the install folder. Agent names are mapped to ids (`Claude Code` → `claude-code`); one that can't be mapped is reported with the command to use, never guessed. The refresh doesn't add to the [skills.sh count](../concepts/install-count.md).\n5. **Tells you what changed in the bundle:** skills new in this version are listed, not installed, with the commands to add them; skills the new version no longer has are listed with the command to remove them:\n\n   ```text\n   [aiskills] new in 0.9.0, not installed: gamma\n     to install them:      aiskills install -s gamma -a claude-code,codex\n     or pick from a list:  aiskills install -i\n   [aiskills] no longer in 0.9.0 but still installed: old-skill\n     to remove:  aiskills uninstall -s old-skill\n   ```\n\nOnly global installs from the install folder are refreshed; skills installed into a project (`-p`) are not, as aiskills can't know every project: run `aiskills install -p` in each. A **downgrade** (`aiskills upgrade 0.7.0`) asks `[y/N]` first, or needs [`-y`](#-y---yes); without a terminal it stops. Preview everything with [`-n`](#-n---dry-run):\n\n<!-- verify: version=0.8.0 list=scrolls-setup,scrolls-update -->\n```bash\naiskills upgrade -n\n```\n\n```text\n[aiskills] installed: 0.8.0 (npm, global) · latest: 0.9.0 (published 2026-11-20)\n[aiskills] changes: https://github.com/sugatoray/aiskills/blob/master/src/packages/aiskills/CHANGELOG.md\n[aiskills] [dry-run] npm install -g @sugatoray-ai/aiskills@0.9.0\n[aiskills] [dry-run] then: aiskills install -g -s scrolls-setup,scrolls-update -a claude-code\n```\n\nJSON (`--check --json`), for scripts: `{ \"installed\", \"target\", \"tag\": string|null, \"change\": \"upgrade\"|\"downgrade\"|\"none\", \"upgradable\": boolean, \"method\": \"npm\"|\"pnpm\"|\"bun\"|\"yarn\"|\"npx\"|\"project\"|\"source\", \"global\": boolean, \"published\": \"YYYY-MM-DD\"|null }`. The exit code is `0` either way, so read `upgradable`.\n\nSee also: [FAQ: How do I update the skills?](../faq.md#how-do-i-update-the-skills) · [Errors: Upgrade](errors.md#upgrade)\n\n### `skills`\n\nRun `npx -y skills@<pinned version> <args>` with every argument unchanged, except that `:root` is replaced by the install folder. Exit code: that of `npx skills`.\n\n<!-- verify -->\n```bash\naiskills skills remove prodigy -a codex -g -y\n```\n\n```text\n[aiskills] running: npx -y skills@1.7.6 remove prodigy -a codex -g -y\n```\n\nSee: [Run any `npx skills` command](../guides/run-npx-skills-directly.md)\n\n### `help`\n\nPrint the help to stdout. Aliases: `h`, `-h`, `--help`. An unknown command prints `unknown command: <name>` and the help to stderr, and exits with `1`.\n\n<!-- verify -->\n```bash\naiskills --help\n```\n\n```text\naiskills 0.9.0 — Sugato Ray's agent skills\n\nUsage: aiskills <command> [options]\n       ais <command> [options]     (same as aiskills)\n       aix <command> [options]     (same as aiskills --route)\n\nCommands:\n  install, i     Save skills to ~/.config/sugatoray/aiskills/skills and run 'npx skills add' on it (default)\n  uninstall, r   Remove skills installed from ~/.config/sugatoray/aiskills via 'npx skills remove' (also: rm, remove)\n  installed, ls  Show skills currently installed from ~/.config/sugatoray/aiskills\n  groups, g      List skill groups (from .claude-plugin/marketplace.json) and their skills\n  sync           Only save/refresh the skills folder; do not run 'npx skills add'\n  list           List the skills available in the saved folder\n  path, p        Print the folder that holds skills/\n  info           Show this setup: versions, folders, settings and where each comes from\n                 (offline); --full also asks npx skills and npm; --json for scripts\n  releases, rel  Show the latest releases on npm (default 5): rel 10, rel all, -L/--last <n|all>\n  upgrade        Install the latest aiskills (or <version|tag>) globally, then re-add the\n                 installed skills for the same agents with the new version\n  find, f <q>    Search the skills registry (= npx skills find <query>)\n  skills <args>  Pass <args> straight to 'npx skills'; ':root' is replaced by ~/.config/sugatoray/aiskills\n  help, h        Show this help\n\nScope/selection options (install, uninstall, installed):\n  -g, --global           User-level (default)\n  -p, --project          Current project instead of user-level\n  -a, --agent <names>    Comma-separated agents (e.g. claude-code,codex); default: auto-detect\n  -s, --skill <names>    Comma-separated skill names; default: all skills from this package\n  -G, --group <names>    Comma-separated skill groups (e.g. scrolls-skills or just scrolls;\n                         'all' = everything). Combines with -s. See 'aiskills groups'.\n  -s/-G/-a may be repeated; values accumulate.\n  -s/-G/-a accept glob patterns: * (any text), ? (one character), [abc] / [a-z] / [!a]\n  (one of / range / not). Matching ignores case. A pattern that matches nothing is an\n  error. Quote patterns so your shell doesn't expand them: -s 'scrolls-*'.\n\nRouting (install, uninstall, installed; may also go before the command):\n      --route            Hand skills that are NOT bundled to 'npx skills'.\n                         The 'aix' command is 'aiskills --route' (e.g. 'aix i -s pdf'):\n                           install:   -s <name>             -> npx skills find <name>, then add owner/repo@<name>\n                                                                 after you confirm (shows the match first; see -y)\n                                      -s owner/repo[@skill] -> npx skills add owner/repo[@skill] (also URLs/paths)\n                           uninstall: -s <name|pattern>     -> also matches skills from other sources\n                           installed: lists every installed skill with its source\n\nLayout of ~/.config/sugatoray/aiskills/skills (install, sync; may also go before the command):\n      --flat             skills/<skill>/...          one folder per skill, as the npm package ships it\n      --nested           skills/<group>/<skill>/...  the repo's original layout, incl. group READMEs etc.\n                         The choice is remembered for later commands; default: flat. Either way,\n                         'npx skills add' installs the same skills.\n\ninstall only:\n  -i, --interactive      Let 'npx skills add' ask which skills and agents to install for\n                         (its own pickers; agents you picked last time are pre-checked,\n                         and it remembers this pick). -s/-G/-a skip the matching picker.\n                         Needs a terminal.\n  -l, --last-agents      Install for the agents you last picked in 'npx skills add'\n                         (its lastSelectedAgents), instead of every detected agent.\n                         Combines with -a.\n      --copy             Copy files into agent dirs instead of symlinking\n      --no-stats         Don't add this install to the skills.sh install count. By default, after\n                         installing bundled skills, aiskills runs 'npx skills add sugatoray/aiskills' for\n                         them in a temp folder, in the background, so skills.sh counts the install\n                         (needs github.com; skipped silently without it). Remembered until --stats;\n                         also accepted by sync. Always off with DO_NOT_TRACK, DISABLE_TELEMETRY or CI.\n      --stats            Count installs on skills.sh again (the default)\n  -y, --yes              Install skills that --route found by a registry lookup without asking\n                         (needed when there is no terminal to ask in); pinned owner/repo@skill never asks\n  -n, --dry-run          Show what would be installed, and the exact commands; install nothing\n\nreleases only:\n  <n|all>, -L, --last <n|all>  How many releases to show (default 5)\n      --downloads [period]     Add download counts: a 7-day column per version (the only\n                               per-version counts npm keeps), the package total over <period>,\n                               and a breakdown. period: all (default), <N><d|w|m|y> (7d, 2w,\n                               1m = 30 days, 1y = 365 days), <YYYY-MM-DD>:<YYYY-MM-DD> or <YYYY-MM-DD>:\n      --chart                  Show the breakdown as a bar chart (the default)\n      --table                  Show the breakdown as a plain table\n      --by day|week|month      Row size of the breakdown; default: by the period's length\n      --ascii                  Draw the bars with # instead of block characters\n  --chart, --table, --by and --ascii imply --downloads.\n\nupgrade only:\n  <version|tag>          What to install instead of latest: 0.9.1, next\n      --check            Only say whether an upgrade is available; change nothing (exit 0)\n      --json             With --check: the result as JSON\n      --no-refresh       Upgrade the package only; print how to refresh the skills\n  -n, --dry-run          Print what would run; change nothing\n  -y, --yes              Allow a downgrade without asking\n\nuninstall only:\n      --purge            Also delete ~/.config/sugatoray/aiskills (only with a full uninstall)\n  -f, --force            Allow -s names that this package does not provide\n  -n, --dry-run          Print what would run; change nothing\n\nAnything after '--' is appended to the underlying 'npx skills' command.\n\nExamples:\n  aiskills groups                             # what groups exist\n  aiskills install --group scrolls --global --agent claude-code\n  aiskills install -G scrolls,personas -s create-lib-docs -a claude-code,codex\n  aiskills install -i                         # pick skills and agents interactively\n  aiskills install -l                         # only the agents picked last time (--last-agents)\n  aiskills uninstall                          # remove every skill this package installed\n  aiskills uninstall -G stata                 # remove one group\n  aiskills install -G 'scroll*,d*' -a 'claude*,codex'\n  aiskills install -s 'scrolls-*' -a 'cursor,qoder*'\n  aiskills uninstall -s 'scrolls-[hu]*'       # scrolls-hide, -unhide, -update\n  aiskills --route install -s scrolls-setup,pdf -a claude-code      # bundled + registry lookup\n  aiskills install --route -s anthropics/skills@pdf -g              # external, pinned\n  aiskills --route uninstall -s pdf                                 # remove an external skill\n  aiskills --route installed                                        # bundled + external\n  aiskills --nested                                                 # install, keeping the repo's nested folders\n  aiskills uninstall -s scrolls-hide,prodigy  # remove just these\n  aiskills uninstall -a codex                 # unlink from Codex only\n  aiskills uninstall --purge                  # remove all, then delete ~/.config/sugatoray/aiskills\n  aiskills info                               # this setup, offline\n  aiskills rel 10 --downloads 1m              # latest 10 releases, downloads of the last 30 days\n  aiskills upgrade --check                    # is there a newer aiskills?\n  aiskills upgrade                            # install it, and update the skills your agents have\n  aiskills skills list -g                     # = npx skills list -g\n  aiskills skills add :root -s prodigy -g -y  # = npx skills add ~/.config/sugatoray/aiskills -s prodigy -g -y\n\nEnvironment:\n  AISKILLS_HOME          Override the install root (default ~/.config/sugatoray/aiskills)\n  AISKILLS_SCOPE, AISKILLS_AGENTS, AISKILLS_SKILLS, AISKILLS_GROUPS, AISKILLS_COPY\n                         Defaults for the options above\n  AISKILLS_ROUTE=1              Same as --route\n  AISKILLS_LAYOUT=flat|nested   Same as --flat / --nested\n  AISKILLS_SKILLS_LIB_VERSION   The skills CLI library version npx runs (default 1.7.6, tested): a version,\n                                latest, next, an npm range (~1.7.4, 1.7.x) or an interval, where one of\n                                \"...\", \"?\" or \"*\" is an open end: [1.7.4, ...) >=1.7.4   (1.7.4, *) >1.7.4\n                                [1.7.4, 1.8.0) >=1.7.4 <1.8.0   (..., 1.7.6] <=1.7.6. With a range, npm picks\n                                the newest version its rules (e.g. min-release-age) allow.\n                                Quote it: AISKILLS_SKILLS_LIB_VERSION='(..., 1.7.6]'\n                                (AISKILLS_SKILLS_VERSION, its old name, still works until 1.0.0)\n  AISKILLS_STATS=0|1            Same as --no-stats / --stats (not remembered)\n  AISKILLS_STATS_FOREGROUND=1   Wait for the skills.sh count and show its output\n```\n\n### `-v`, `--version`\n\nPrint the package version.\n\n<!-- verify -->\n```bash\nais -v\n```\n\n```text\n0.9.0\n```\n\n## Options\n\nValues for `-a`, `-s` and `-G` are comma-separated, may be [glob patterns](patterns.md), and accumulate when the option is repeated: `-s a,b` = `-s a -s b`. Options on the command line replace the matching [`AISKILLS_*`](environment.md) default.\n\n| Option | install | uninstall | installed | groups | sync |\n| --- | --- | --- | --- | --- | --- |\n| `-g`, `-p` | ✓ | ✓ | ✓ | | |\n| `-a`, `-s`, `-G` | ✓ | ✓ | | | |\n| `--route` | ✓ | ✓ | ✓ | | |\n| `--nested`, `--flat` | ✓ | | | | ✓ |\n| `--stats`, `--no-stats` | ✓ | | | | ✓ |\n| `--copy`, `-y`, `-i`, `-l` | ✓ | | | | |\n| `-n` | ✓ | ✓ | | | |\n| `--purge`, `-f` | | ✓ | | | |\n| `--json` | | | | ✓ | |\n\n`info` takes `--full` and `--json`; `upgrade` takes `--check`, `--json`, `--no-refresh`, `-n` and `-y`; `releases` takes `-L`, `--downloads`, `--chart`, `--table`, `--by`, `--ascii` and `--json` (see their headings below).\n| `--` | ✓ | ✓ | | | |\n\n### `-g`, `--global`\n\nUser-level scope: skills apply in every project. The default. Env: [`AISKILLS_SCOPE`](environment.md#aiskills_scope).\n\n### `-p`, `--project`\n\nProject scope: install, list or remove in the current folder. `npx skills` runs from the current folder without `--global`. Env: `AISKILLS_SCOPE=project`. See [3. Install into a project](../tutorial/03-install-into-a-project.md).\n\n### `-a`, `--agent`\n\nAgents to install to or remove from, e.g. `claude-code,codex`. Default: the agents `npx skills` detects (install) or every agent (uninstall). Plain names are passed to `npx skills`, which checks them. Patterns (`'claude*'`) are expanded against the agent list `npx skills` reports, and the result is printed as `agents: ...`. `-a '*'` is passed on as is, meaning all agents. Env: [`AISKILLS_AGENTS`](environment.md#aiskills_agents).\n\n### `-s`, `--skill`\n\nSkills, by name or pattern. Default: every skill. `-s '*'` is the same as no `-s`. Install matches against the bundled skills; uninstall also against the skills installed from the install folder. A name that isn't bundled is refused unless [`--route`](#--route) (or `-f` on uninstall). With `--route`, `-s` also takes `owner/repo@skill`, `owner/repo`, URLs and paths. Env: [`AISKILLS_SKILLS`](environment.md#aiskills_skills).\n\n### `-G`, `--group`, `--groups`\n\nSkill groups, by name (`scrolls-skills`), alias (`scrolls`), pattern, or `all`. Combines with `-s` (union). See [Skill groups](../concepts/skill-groups.md). Env: [`AISKILLS_GROUPS`](environment.md#aiskills_groups).\n\n### `--route`\n\nHand skills that aren't bundled to `npx skills`: look up bare names with `npx skills find` (install only on a unique exact match), pass `owner/repo@skill` and other sources to `npx skills add`, let uninstall match any source, and make `installed` list every skill with its source. The `aix` command always sets it. Env: [`AISKILLS_ROUTE`](environment.md#aiskills_route). See [Bundled and external skills](../concepts/bundled-and-external.md).\n\n### `--nested`\n\nWrite `<install folder>/skills/` in the repo's nested layout. Remembered for later commands. Env: [`AISKILLS_LAYOUT`](environment.md#aiskills_layout). See [Layouts](../concepts/layouts.md).\n\n### `--flat`\n\nWrite `<install folder>/skills/` flat, one folder per skill (the default). Remembered for later commands.\n\n### `--stats`\n\nAdd installs to the [skills.sh install count](../concepts/install-count.md) (the default). Undoes a remembered `--no-stats`. Has no effect when `DO_NOT_TRACK`, `DISABLE_TELEMETRY`, `CI` or `GITHUB_ACTIONS` is set.\n\n### `--no-stats`\n\nDon't add this install to the skills.sh count: no background `npx skills add sugatoray/aiskills`, no temp folder, no call to github.com or skills.sh for it. Remembered in `aiskills.json` until `--stats`; `aiskills sync --no-stats` sets it without installing. Env: [`AISKILLS_STATS=0`](environment.md#aiskills_stats). See [The skills.sh install count](../concepts/install-count.md).\n\n### `-i`, `--interactive`\n\nRun `npx skills add` without `--yes`, so it shows its own pickers: which skills (all pre-checked), which agents, and how to install (symlink or copy). In the agent picker, the agents you picked last time are pre-checked, and `npx skills` remembers the new pick for next time (see [`-l`](#-l---last-agents)). `-s`/`-G` and `-a` are still passed on and skip the skill or agent picker. With `-p`, `npx skills` also asks for the scope; pick *Project*. Needs a terminal: without one, `aiskills` stops before installing anything.\n\nWithout `-i`, `npx skills add --yes` installs to every agent it detects (an agent counts as detected when its config folder exists, e.g. `~/.claude` or `~/.codex`) plus the universal `.agents/skills` agents, and, when it detects none, to every agent it supports.\n\n### `-l`, `--last-agents`\n\nInstall for the agents you last picked in the agent picker of `npx skills add` (run directly or via [`-i`](#-i---interactive)), instead of every detected agent. They are read from `lastSelectedAgents` in the lock file `npx skills` keeps: `$XDG_STATE_HOME/skills/.skill-lock.json`, else `~/.agents/.skill-lock.json`. Adds to any `-a` agents. If none were ever picked, it stops with [No agents recorded](errors.md#no-agents-recorded---last-agents).\n\n### `--copy`\n\nPass `--copy` to `npx skills add`: copy the files into agent folders instead of symlinking them. Env: [`AISKILLS_COPY`](environment.md#aiskills_copy).\n\n### `-y`, `--yes`\n\nOn install with [`--route`](#--route), install the skills that a registry lookup found without asking. Without it, `aiskills` lists each one (`owner/repo@skill`, its install count, and the name you gave), then:\n\n- in a terminal, asks `Install <n> external skill(s) from the registry? [y/N]`; only `y` or `yes` installs, and anything else stops with `nothing installed: not confirmed` (exit `1`);\n- with no terminal (a script, CI, an agent), stops with `not installing external skills without confirmation` (exit `1`).\n\nEither way nothing is installed, not even the bundled skills, until the external ones are confirmed. A skill given as `owner/repo@skill`, a URL or a path is never asked about: you named its source. Bundled skills never ask. See [Security model](../concepts/security.md).\n\nOn [`upgrade`](#upgrade), allow a downgrade (a target older than the installed version) without asking. Without it, a terminal asks `Downgrade aiskills <installed> → <target>? [y/N]`, and with no terminal it stops with `not downgrading ... without confirmation` (exit `1`). An upgrade never asks.\n\n### `--purge`\n\nAfter a full uninstall, delete the install folder. Refused with `-s`/`-G`, and refused for a folder that isn't an aiskills folder (checked before anything is removed).\n\n### `-f`, `--force`\n\nOn uninstall, pass `-s` names to `npx skills remove` even if this package doesn't provide them.\n\n### `-n`, `--dry-run`\n\nOn uninstall, print what would be removed and the exact `npx skills` command, and change nothing.\n\nOn [`upgrade`](#upgrade), print the package manager's install command and each `aiskills install` refresh command as `[dry-run]` lines, and change nothing.\n\nOn install, show what would be installed: the skills a `--route` lookup found (no confirmation is asked) and each exact `npx skills add` command, as `[dry-run] npx -y skills@1.7.6 add ...` lines, and the [skills.sh count](../concepts/install-count.md) command as a `[dry-run] skills.sh count: ...` line. Nothing is installed or counted. The saved copy in the install folder is still refreshed, as [`sync`](#sync) does.\n\n### `--json`\n\nOn `groups`, print the groups as JSON. Schema: [Files and schemas](files.md#aiskills-groups---json). On [`info`](#info) and [`releases`](#releases), print what they show as JSON; on [`upgrade`](#upgrade), only with `--check` (schemas in their sections).\n\n### `--check`\n\nOn [`upgrade`](#upgrade), only say whether a newer version is available (`update available: run 'aiskills upgrade'`, `up to date`, or `installed <version> is newer than <target>`), and change nothing. Exits `0` whatever it finds; with [`--json`](#--json), read `upgradable`.\n\n### `--no-refresh`\n\nOn [`upgrade`](#upgrade), install the new package but leave the skills your agents have as they are, and print the `aiskills install` commands that would update them.\n\n### `--full`\n\nOn [`info`](#info), also ask npm for the latest version and `npx skills list` for what is installed (a few seconds; needs network). Without it, `info` is offline.\n\n### `-L`, `--last`\n\nOn [`releases`](#releases), how many releases to show: a whole number of 1 or more, or `all`. The same as giving the number right after the command (`aiskills rel 10` = `aiskills rel -L 10`). Default: 5. Anything else stops with [Invalid number of releases](errors.md#invalid-number-of-releases).\n\n### `--downloads`\n\nOn [`releases`](#releases), add download counts from api.npmjs.org: a `DOWNLOADS (7 DAYS)` column per version, the package's total over a period, and a breakdown by day, week or month. `--downloads` alone means `all`; a value right after it, or after `=`, is the period:\n\n```text\nperiod  := all                         since the first publish (the default)\n         | <N><unit>                   the last N units, ending on npm's latest day of data\n         | <YYYY-MM-DD>:<YYYY-MM-DD>   an exact range (npm's own notation)\n         | <YYYY-MM-DD>:               from a date until npm's latest day\n\nunit    := d (days) | w (weeks: 7 days) | m (months: 30 days) | y (years: 365 days)\nN       := a whole number, 1 or more\n```\n\nExamples: `--downloads 7d`, `--downloads 2w`, `--downloads=1m`, `--downloads 1y`, `--downloads 2026-11-01:2026-11-10`, `--downloads 2026-11-01:`. Units ignore case; a month is 30 days and a year 365, matching npm's own \"last month\" and \"last year\". A bare number after `--downloads` is not a period, so `aiskills rel --downloads 10` shows 10 releases with all-time counts. Periods longer than npm's 18-month limit are fetched in pieces and added up; npm has counts from 2015-01-10 on. An invalid period stops with [Invalid period](errors.md#invalid-period) before any network call.\n\n### `--chart`\n\nOn [`releases`](#releases), show the downloads breakdown as a bar chart (the default). Implies `--downloads` (all time) if it isn't given. Can't be combined with `--table`.\n\n### `--table`\n\nOn [`releases`](#releases), show the downloads breakdown as a plain table (`DAY`/`WEEK`/`MONTH`, `DOWNLOADS`, `RELEASED`), with every row and no bars. Implies `--downloads`.\n\n### `--by`\n\nOn [`releases`](#releases), the row size of the downloads breakdown: `day`, `week` or `month`. Default: by the period's length (day up to 31 days, week up to 183, month beyond). Weeks run in 7-day steps from the period's first day; months follow the calendar. Implies `--downloads`.\n\n### `--ascii`\n\nOn [`releases`](#releases), draw the chart's bars with `#` instead of block characters, for terminals or fonts without them. Also used when `TERM=dumb`. Implies `--downloads`.\n\n### `--`\n\nEverything after `--` is appended to the `npx skills add` (install) or `npx skills remove` (uninstall) command. See [Run any `npx skills` command](../guides/run-npx-skills-directly.md#extra-flags-on-install-and-uninstall).\n\nSee also: [Environment variables](environment.md) · [Errors and exit codes](errors.md) · [Patterns](patterns.md)\n"},{"id":"reference-patterns","path":"reference/patterns.md","title":"Patterns reference","tab":"reference","md":"# Patterns reference\n\nThe glob syntax that `-s`, `-G` and `-a` accept (and `AISKILLS_SKILLS`, `AISKILLS_GROUPS`, `AISKILLS_AGENTS`), on install and uninstall; this page is exhaustive.\n\n## Syntax\n\n| Pattern | Matches | Example |\n| --- | --- | --- |\n| `*` | Any text, including none | `scrolls-*` |\n| `?` | Exactly one character | `?????-recipes` |\n| `[abc]` | One of the listed characters | `scrolls-[hu]*` → scrolls-help, -hide, -unhide, -update |\n| `[a-z]` | One character in the range | `scrolls-[r-u]*` |\n| `[!abc]`, `[^abc]` | One character **not** listed | `scrolls-[!hu]*` → scrolls-remove, -restore, -setup |\n\nAny other character matches itself. An entry with none of `*`, `?` or `[` is a plain name.\n\n## Rules\n\n- **Case is ignored**, for patterns and plain names alike.\n- **The whole name must match.** `scroll*` matches `scrolls-skills`; `croll` matches nothing.\n- **Mix freely.** One comma-separated list can hold names and patterns: `-s 'scrolls-*,prodigy'`.\n- **A pattern that matches nothing is an error**, before anything changes. The message lists what is available.\n- **Quote patterns** (`'scrolls-*'`), or your shell may expand them into file names.\n\n<!-- verify -->\n```bash\naiskills install -s '?????-recipes' -a claude-code\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (flat layout)\n[aiskills] bundled: stata-recipes\n[aiskills] running: npx -y skills@1.7.6 add ~/.config/sugatoray/aiskills --global --skill stata-recipes --agent claude-code --yes\n[aiskills] adding this install to the skills.sh count in the background (turn off: --no-stats)\n```\n\n## What each option matches against\n\n| Option | Matched against |\n| --- | --- |\n| `-s`, `--skill` | **install:** the bundled skills. **uninstall:** the bundled skills plus the skills installed from the install folder; with `--route`, every installed skill. |\n| `-G`, `--group` | Group names **and** aliases. `all` and `*` mean every bundled skill. |\n| `-a`, `--agent` | The agent ids `npx skills` accepts (`claude-code`, `codex`, `cursor`, …), read from `npx skills` itself. |\n\n## Special cases\n\n### `-s '*'`\n\nEvery skill, the same as no `-s`.\n\n### `-a '*'`\n\nPassed to `npx skills` unchanged; it means all agents.\n\n### Plain agent names\n\nNot checked by `aiskills`; `npx skills` checks them. Only patterns are expanded, and the expansion is printed as `[aiskills] agents: ...`.\n\n### Uninstall with a pattern or a group\n\nOnly skills that are actually installed are removed. Plain names are always passed on with `-f`.\n\n### `--route` and patterns\n\nPatterns match only bundled (or, on uninstall, installed) skills. The registry can't be searched by pattern: use `aiskills find <query>`.\n\nSee also: [CLI reference](cli.md) · [2. Pick skills and agents](../tutorial/02-pick-skills-and-agents.md)\n"},{"id":"reference-environment","path":"reference/environment.md","title":"Environment variables reference","tab":"reference","md":"# Environment variables reference\n\nEvery environment variable `aiskills` reads; this page is exhaustive. `npm install` reads none of them: the package has no install step.\n\nVariables give defaults. An option on the command line replaces the matching variable. Values that are lists are comma-separated, and accept [patterns](patterns.md). \"Truthy\" means `1`, `true` or `yes`, in any case.\n\n<!-- verify -->\n```bash\nAISKILLS_LAYOUT=nested aiskills sync\n```\n\n```text\n[aiskills] skills saved to ~/.config/sugatoray/aiskills/skills (nested layout)\n```\n\n## Choosing skills and agents\n\n### `AISKILLS_SKILLS`\n\nDefault for `-s`: skill names or patterns. Unset: every skill. A name that isn't bundled is an error unless [`AISKILLS_ROUTE`](#aiskills_route) is truthy.\n\n### `AISKILLS_GROUPS`\n\nDefault for `-G`: group names, aliases or patterns. Combined with `AISKILLS_SKILLS` (union).\n\n### `AISKILLS_AGENTS`\n\nDefault for `-a`: agent names or patterns. Unset: the agents `npx skills` detects.\n\n### `AISKILLS_SCOPE`\n\n`project` = `-p`; anything else, or unset, = `-g` (global).\n\n### `AISKILLS_COPY`\n\nTruthy = `--copy`.\n\n### `AISKILLS_ROUTE`\n\nTruthy = `--route`. The `aix` command sets it. Lets names in `AISKILLS_SKILLS` that aren't bundled be looked up.\n\n### `AISKILLS_LAYOUT`\n\n`flat` or `nested`, the same as `--flat` / `--nested`. A command-line flag wins over it; it wins over the remembered layout. Any other value fails with `unknown layout`.\n\n### `AISKILLS_STATS`\n\n`0` or `1` (also `false`/`true`, `no`/`yes`, `off`/`on`): the same as `--no-stats` / `--stats` while it's set, but not remembered. `--stats`/`--no-stats` win over it; it wins over the choice remembered in `aiskills.json`. Empty means unset; any other value fails with `AISKILLS_STATS must be 1 or 0`. See [The skills.sh install count](../concepts/install-count.md).\n\n### `AISKILLS_STATS_FOREGROUND`\n\n`1` (or `true`, `yes`, `on`): run the [skills.sh install count](../concepts/install-count.md) in the foreground after `aiskills install`, and show its output, to see why a count doesn't happen. Its exit status still doesn't change the install's.\n\n## Where things go\n\n### `AISKILLS_HOME`\n\nThe install folder. Default: `~/.config/sugatoray/aiskills`. A relative path is resolved from the current folder. If the folder exists, it must be empty or an aiskills folder (it has `aiskills.json`); otherwise `aiskills` refuses to replace or delete it.\n\n### `AISKILLS_SKILLS_LIB_VERSION`\n\nThe version of the `skills` CLI library that every `npx` call runs (not the version of the bundled skills). Default: `1.7.6` (pinned and tested). Accepts an exact version (`1.7.6`, `1.8.0-beta.1`), `latest`, `next`, an npm range (`~1.7.4`, `1.7.x`, `>=1.7.4 <1.8.0`) or interval notation, where exactly one of `...`, `?` or `*` is an open end (no combinations): `[x, ...)` (or `[x, ?)`, `[x, *)`) is `>=x`, `(x, ...)` is `>x`, `[x, y)` is `>=x <y`, `(..., x]` is `<=x`, and the other mixes of `[ ( ) ]`. With a range, npm picks the newest version its own rules (such as `min-release-age`) allow. A typographic `…` (as autocorrect makes it) is read as `...`. Only plain spaces may separate a range's parts; tabs, line breaks and Unicode spaces are refused. Anything else, or an interval no version fits, is refused. When it overrides the pinned version, every command says so once: `using skills@<spec> from AISKILLS_SKILLS_LIB_VERSION, not the tested 1.7.6`. See [Choose the `skills` CLI version](../guides/choose-the-skills-cli-version.md).\n\n### `AISKILLS_SKILLS_VERSION`\n\nDeprecated: the old name (0.4.0 to 0.5.0) of [`AISKILLS_SKILLS_LIB_VERSION`](#aiskills_skills_lib_version), renamed so it isn't mistaken for the version of the bundled skills. It still works, with a warning, and is removed in 1.0.0; if both are set, `AISKILLS_SKILLS_LIB_VERSION` wins. Rename it in your profile or CI.\n\n## `info` and `releases`\n\n### `AISKILLS_TODAY`\n\nA date (`YYYY-MM-DD`) that [`aiskills releases`](cli.md#releases) treats as today when it shows a release's age (`3 days ago`). Unset, today is the current UTC date. For reproducible output, as in tests and these docs; it doesn't change the download periods, which end on npm's latest day of data. Anything but a real date stops with `AISKILLS_TODAY must be a date (YYYY-MM-DD)`.\n\n### `AISKILLS_NPM_API_URL`\n\nThe base URL of the npm download counts API that [`aiskills releases --downloads`](cli.md#--downloads) asks. Default: `https://api.npmjs.org`. For tests, or a mirror that serves the same paths (`/downloads/point/...`, `/downloads/range/...`, `/versions/...`). The release list itself comes from `npm view`, which uses your npm registry setting instead.\n\n### `TERM`\n\nSet by your terminal. When it is `dumb`, [`aiskills releases`](cli.md#releases) draws the downloads chart with `#`, as with [`--ascii`](cli.md#--ascii).\n\n## Read by `npx skills`, passed through\n\n`aiskills` passes every variable to `npx` except npm's own `npm_*` variables (registry, proxy and certificate settings among them are kept). These are worth knowing:\n\n| Variable | Effect in `npx skills` |\n| --- | --- |\n| `DISABLE_TELEMETRY`, `DO_NOT_TRACK` | Turn off its anonymous usage data to `skills.sh`, and the [skills.sh install count](../concepts/install-count.md) (any value) |\n| `CI`, `GITHUB_ACTIONS` | Read by `aiskills`: when set, the skills.sh install count is off |\n| `npm_config_min_release_age`, `npm_config_min_release_age_exclude`, `npm_config_before` | npm's release-age rule, passed on to `npx` (other `npm_config_*` variables except registry, proxy and certificate settings are not). `npm_config_min_release_age=0 aiskills <command>` relaxes it for one run. See [When npm's release-age rule blocks the pinned version](../guides/choose-the-skills-cli-version.md#when-npms-release-age-rule-blocks-the-pinned-version) |\n\nSee also: [Set default choices](../guides/set-defaults.md) · [CLI reference](cli.md)\n"},{"id":"reference-files","path":"reference/files.md","title":"Files and schemas reference","tab":"reference","md":"# Files and schemas reference\n\nWhat `aiskills` writes and where, and the exact fields of every file and JSON output it produces or reads; this page is exhaustive.\n\n## The install folder\n\n`~/.config/sugatoray/aiskills/` (or [`AISKILLS_HOME`](environment.md#aiskills_home)), written by every sync (`install`, `sync`, `list` and `groups`; never by `npm install`):\n\n```text\n~/.config/sugatoray/aiskills/\n├── aiskills.json                     marks the folder as an aiskills folder; last sync\n├── skills/                           the skills, flat or nested; replaced on every sync\n├── .aiskills/layout.json             each skill's original folder\n└── .claude-plugin/marketplace.json   the repo's marketplace file, used for groups\n```\n\n`skills/` is built in a temporary `.skills.tmp-<pid>` folder next to it, then swapped in.\n\n## `aiskills.json`\n\n```json\n{\n  \"package\": \"@sugatoray-ai/aiskills\",\n  \"version\": \"0.9.0\",\n  \"layout\": \"flat\",\n  \"installedAt\": \"2026-11-06T10:26:01.152Z\",\n  \"skills\": \"/home/me/.config/sugatoray/aiskills/skills\"\n}\n```\n\n| Field | Type | Meaning |\n| --- | --- | --- |\n| `package` | string | Always `@sugatoray-ai/aiskills`. Its presence is what makes a folder safe for `aiskills` to replace or delete. |\n| `version` | string | The package version that wrote the folder. |\n| `layout` | `\"flat\"` \\| `\"nested\"` | The layout of `skills/`, reused by the next sync unless overridden. |\n| `stats` | boolean, optional | Written by `--stats` / `--no-stats`: whether `aiskills install` adds installs to the [skills.sh count](../concepts/install-count.md). Kept by later syncs; absent means on. |\n| `installedAt` | string (ISO 8601) | When the folder was last synced. |\n| `skills` | string (absolute path) | The `skills/` folder. |\n\n## `.aiskills/layout.json`\n\nWritten when the package is built, and copied to the install folder.\n\n```json\n{\n  \"format\": 1,\n  \"description\": \"skills/ is flat (skills/<name>/). …\",\n  \"skills\": {\n    \"create-lib-docs\": \"docs/create-lib-docs\",\n    \"scrolls-setup\": \"scrolls/scrolls-setup\"\n  },\n  \"extras\": [\"scrolls/README.md\", \"scrolls/.claude-plugin/plugin.json\"],\n  \"ignored\": [\"newsletters/newsletter-ai/\"]\n}\n```\n\n| Field | Type | Meaning |\n| --- | --- | --- |\n| `format` | number | Version of this file's shape; currently `1`. |\n| `description` | string | A note for people reading the file. |\n| `skills` | object: skill name → string | Each skill's original folder, relative to the repo's `skills/`. Used for `--nested` and for groups. |\n| `extras` | string[] | Files outside any skill folder (READMEs, `plugin.json`, `meta/`), stored in the package under `.aiskills/nested/` at these paths. |\n| `ignored` | string[] | Paths a `.skillsignore` left out of the package. Folders end with `/`. In this version: `newsletters/newsletter-ai/`, from `skills/newsletters/.skillsignore`. |\n\n## The package\n\n```text\n@sugatoray-ai/aiskills/\n├── bin/aiskills.mjs, bin/aix.mjs     the commands (aiskills and ais share one file)\n├── src/scripts/core/                 cli.mjs, installer.mjs\n├── skills/<skill>/                   the skills, flat\n├── .aiskills/layout.json, .aiskills/nested/\n├── .claude-plugin/marketplace.json\n└── README.md, CHANGELOG.md, SECURITY.md, LICENSE, package.json\n```\n\nThat is everything the package contains. What builds it stays in the repo: `src/scripts/pack/` (copies the skills in at `npm pack`), `src/scripts/docs/` (builds these docs and the banner), `src/test/` and `docs/`.\n\nFiles named `.gitignore` and `.npmignore` inside the skills are stored as `_gitignore` and `_npmignore`, because npm drops the real names; every sync renames them back. The package has no JavaScript API: only the commands are public.\n\n## `aiskills groups --json`\n\n```json\n{\n  \"groups\": [\n    {\n      \"name\": \"scrolls-skills\",\n      \"alias\": \"scrolls\",\n      \"description\": \"Scrolls: a git-native markdown system …\",\n      \"skills\": [\"scrolls-help\", \"scrolls-hide\", \"…\"]\n    }\n  ],\n  \"ungrouped\": []\n}\n```\n\n| Field | Type | Meaning |\n| --- | --- | --- |\n| `groups[].name` | string | The group name from `marketplace.json`. |\n| `groups[].alias` | string | The name without a trailing `-skills`. |\n| `groups[].description` | string | From `marketplace.json`; may be empty. |\n| `groups[].skills` | string[] | Skill names, sorted. |\n| `ungrouped` | string[] | Bundled skills in no group, sorted. |\n\n## `npx skills list --json` rows\n\n`aiskills` reads these (from `npx skills list --json [--global]`) to know what is installed. It never writes them. Fields as reported by `skills@1.7.6`:\n\n| Field | Type | Used for |\n| --- | --- | --- |\n| `name` | string | The skill name. |\n| `source` | string | Where it was installed from: a folder path, or `owner/repo`. |\n| `sourceType` | string | `local` for a folder, `github` for GitHub. |\n| `scope` | string | `global` or `project`. |\n| `agents` | string[] | Agents it's installed for, as display names such as `Claude Code` (shown by `installed`). |\n| `path`, `sourceUrl`, `status` | string | Also present in `skills@1.7.6`; not used by `aiskills`. |\n\nA row is **from this package** when `sourceType` is `local` and `source` is the install folder.\n\n## Written by `npx skills`\n\nThe agents' skill folders (`~/.claude/skills/`, `~/.agents/skills/`, …, or the project's with `-p`) and `npx skills`' own records, such as a project's `skills-lock.json`. `aiskills` doesn't touch them directly.\n\nSee also: [How aiskills works](../concepts/how-it-works.md) · [Layouts](../concepts/layouts.md)\n"},{"id":"reference-skillsignore","path":"reference/skillsignore.md","title":"`.skillsignore` reference","tab":"reference","md":"# `.skillsignore` reference\n\nThe rule syntax of `.skillsignore` files, which leave files, folders or whole skills out of the package when it is built; this page is exhaustive.\n\nA `.skillsignore` can sit in the repo's `skills/` folder or any folder below it. Its rules apply to that folder and below. It is read only when the package is built (`npm pack`), so it matters to maintainers, not to users. The repo uses one: `skills/newsletters/.skillsignore` holds `newsletter-ai/`, which leaves that skill out of the package (it stays installable from the repo with `npx skills add`).\n\n## Syntax\n\nThe syntax is a subset of `.gitignore`:\n\n| Line | Meaning |\n| --- | --- |\n| blank, or starting with `#` | Skipped. A `#` later in a line is part of the pattern. |\n| `\\#name`, `\\!name` | A literal leading `#` or `!`. |\n| `name` | A file or folder with that name, at any depth. |\n| `/name`, `a/name` | A leading or middle `/` anchors the pattern to the `.skillsignore`'s folder. |\n| `name/` | Folders only. |\n| `*`, `?`, `[abc]`, `[!abc]` | Within one path segment. |\n| `**` | Across segments: `**/x`, `x/**`, `a/**/b`. |\n| `!pattern` | Re-include something an earlier rule excluded. |\n\n## Rules\n\n- **The last matching rule wins.** Rules in a deeper `.skillsignore` come after the outer ones.\n- **An ignored folder is never entered**, so a file inside it can't be re-included (as in git).\n- **`.skillsignore` files never ship.**\n- **Ignoring only a `SKILL.md` is refused.** Ignore the skill's folder to drop the skill.\n- **What was left out** is listed under `ignored` in [`.aiskills/layout.json`](files.md#aiskillslayoutjson).\n\n## Example\n\n```gitignore\n# every tests/ folder, at any depth\n**/tests/\n# a \"/\" in the middle anchors to this folder, so use **/ for any depth\n**/meta/MAINTAINERS.md\n# all .log files except keep.log\n*.log\n!keep.log\n# ignoring a skill's folder drops the whole skill\nscrolls/wip-skill/\n```\n\nSee also: [Leave files out of the package](../guides/leave-files-out.md) · [Errors](errors.md#packaging-errors-maintainers)\n"},{"id":"reference-errors","path":"reference/errors.md","title":"Errors and exit codes reference","tab":"reference","md":"# Errors and exit codes reference\n\nEvery error and warning `aiskills` prints, with its cause and fix, and what each exit code means; this page is exhaustive.\n\nErrors and warnings go to stderr and start with `[aiskills]`. Parts in `<angle brackets>` vary.\n\n## Exit codes\n\n| Code | Meaning |\n| --- | --- |\n| `0` | Success. `uninstall` also exits `0` when there was nothing to remove. |\n| `1` | `aiskills` stopped with one of the errors below, or `installed` couldn't read `npx skills list`. No skill was installed or removed. |\n| any other | The exit code of the `npx skills` command it ran, passed through. |\n\n<!-- verify -->\n```bash\naiskills install --purge\n```\n\n```text\n[aiskills] option --purge is not valid here\n```\n\n## Options and commands\n\n### Option not valid here\n\n```text\n[aiskills] option <option> is not valid here\n```\n\n**Cause:** the option exists, but not for this command, e.g. `--purge` on `install`. **Fix:** see which options each command takes in the [CLI reference](cli.md#options).\n\n### Unknown option\n\n```text\n[aiskills] unknown option: <option>\n```\n\n**Cause:** a typo, or an option of `npx skills` given directly. **Fix:** check `aiskills --help`; pass `npx skills` options after `--`.\n\n### Option needs a value\n\n```text\n[aiskills] <option> needs a value\n```\n\n**Cause:** `-a`, `-s` or `-G` is the last argument. **Fix:** add the value: `-s scrolls-setup`.\n\n### Unknown command\n\n```text\nunknown command: <name>\n```\n\n**Cause:** not one of the [commands](cli.md#commands). The help follows on stderr. **Fix:** check the spelling; `aiskills help` lists them.\n\n## Choosing skills, groups and agents\n\n### Not provided by this package\n\n```text\n[aiskills] not provided by this package: <names>\n  available: <bundled skills>\n  add --route to look them up with 'npx skills' instead\n```\n\n**Cause:** `install -s` names a skill that isn't bundled. **Fix:** check the spelling against `available`, or add `--route` (or use `aix`) for an external skill. On `uninstall` the last line reads `use --route to also match skills installed from other sources, or -f/--force`.\n\n### No skill matches\n\n```text\n[aiskills] no skill matches: <patterns>\n  available: <skills>\n```\n\n**Cause:** an `-s` pattern matched no skill. **Fix:** adjust the pattern; patterns match the whole name, ignoring case.\n\n### No group matches\n\n```text\n[aiskills] no group matches: <names>\n  available: <group (alias), …>, all\n  see 'aiskills groups'\n```\n\n**Cause:** a `-G` name, alias or pattern matched no group. **Fix:** pick one from `available`.\n\n### The selected groups contain no skills\n\n```text\n[aiskills] the selected group(s) contain no skills\n```\n\n**Cause:** the `-G` groups exist but have no bundled skills. **Fix:** choose other groups; `aiskills groups` shows each group's skills.\n\n### No marketplace.json\n\n```text\n[aiskills] no .claude-plugin/marketplace.json in <install folder>; run 'aiskills sync' first\n```\n\n**Cause:** `-G` was used but the install folder has no `marketplace.json`, e.g. it was synced by an older version. **Fix:** `aiskills sync`.\n\n### No agent matches\n\n```text\n[aiskills] no agent matches: <patterns>\n  valid agents: <agents>\n```\n\n**Cause:** an `-a` pattern matched none of the agents `npx skills` supports. **Fix:** adjust the pattern, or use names from `valid agents`.\n\n### No agents recorded (`--last-agents`)\n\n```text\n[aiskills] --last-agents: no agents recorded in <lock file>\n  pick them once with 'aiskills install -i' (or 'npx skills add'), or use -a <agents>\n```\n\n**Cause:** `--last-agents` reads `lastSelectedAgents` from the lock file `npx skills` keeps (`$XDG_STATE_HOME/skills/.skill-lock.json`, else `~/.agents/.skill-lock.json`), and it has none: the agent picker of `npx skills add` was never used. **Fix:** run `aiskills install -i` once and pick the agents, or name them with `-a`.\n\n### Interactive install needs a terminal\n\n```text\n[aiskills] -i/--interactive needs a terminal; pick with -s/-G/-a instead\n```\n\n**Cause:** `-i` lets `npx skills add` ask which skills and agents to use, and there is no terminal to ask in (a script, CI, an agent). Nothing is installed. **Fix:** drop `-i` and choose with `-s`, `-G`, `-a` or `-l`/`--last-agents`.\n\n### Could not read the agent list\n\n```text\n[aiskills] could not read the agent list from 'npx skills'\n```\n\n**Cause:** an `-a` pattern needs the agent list, and `npx skills` didn't print it (no network for the first download, or a `skills` version that words it differently). **Fix:** pass plain agent names instead of a pattern, or go back to the pinned `skills` version.\n\n## Uninstall\n\n### Purge only with a full uninstall\n\n```text\n[aiskills] --purge only applies to a full uninstall (drop -s/-G)\n```\n\n**Cause:** `--purge` with `-s` or `-G`. **Fix:** remove the skills first, then run `aiskills uninstall --purge` on its own.\n\n### Names a source, not a skill\n\n```text\n[aiskills] '<entry>' names a source, not a skill; use -s <skill> or <owner/repo@skill>\n```\n\n**Cause:** `--route uninstall -s owner/repo`: a repository isn't a skill name. **Fix:** name the skill, `-s pdf` or `-s owner/repo@pdf`.\n\n### Not installed, skipping\n\n```text\n[aiskills] not installed (<scope>), skipping: <names>\n```\n\n**Warning.** **Cause:** with `--route`, these names aren't installed in this scope. **Fix:** none needed; check `-g`/`-p` if you expected them.\n\n### Could not read `npx skills list` (uninstall)\n\n```text\n[aiskills] could not read 'npx skills list'; falling back to the skills found in <install folder>\n```\n\n**Warning.** **Cause:** `npx skills list --json` failed during a full uninstall, so `aiskills` removes every skill name in its folder instead. **Fix:** usually none; check network access if it repeats.\n\n### Could not read `npx skills list` (installed)\n\n```text\n[aiskills] could not read 'npx skills list'\n```\n\n**Cause:** `installed` couldn't run or parse `npx skills list --json`; exit code `1`. **Fix:** run `aiskills skills list -g` to see the underlying error.\n\n## External skills (`--route`)\n\n### Matches several skills\n\n```text\n[aiskills] '<name>' matches several skills; pick one with -s <owner/repo@skill>:\n    <owner/repo@name>  (<installs>)\n    …\n```\n\n**Cause:** more than one registry result has exactly this name. `aiskills` never picks. **Fix:** choose one and pass it as `-s owner/repo@name`.\n\n### No skill named exactly\n\n```text\n[aiskills] no skill named exactly '<name>'; closest results:\n    <owner/repo@skill>  (<installs>)\n```\n\n**Cause:** the registry has similar skills but none with this exact name. **Fix:** use one of the listed names, or `aiskills find <query>` to search.\n\n### No skill found\n\n```text\n[aiskills] no skill named '<name>' found by 'npx skills find'\n```\n\n**Cause:** the registry returned nothing (or there's no network access to `skills.sh`). **Fix:** check the name and network, or give the source as `owner/repo@skill`.\n\n### Unsafe registry results ignored\n\n```text\n[aiskills] ignored <n> registry result(s) with unsafe characters: \"<spec>\", …\n```\n\n**Warning.** **Cause:** results whose `owner/repo@skill` has characters other than letters, digits, `.`, `_` and `-` are never used. **Fix:** none needed. If the skill you want was among them, check its source and pass it yourself.\n\n### Not confirmed (no terminal)\n\n```text\n[aiskills] found in the skills registry (not bundled; third-party code your agents may run):\n    <owner/repo@skill>  (<n> installs)  for '<name>'\n[aiskills] not installing external skills without confirmation: <owner/repo@skill>, …\n  re-run with -y/--yes to install them, or pin each one with -s owner/repo@skill\n```\n\n**Cause:** `--route` (or `aix`) found a skill by looking up a bare name, and there is no terminal to ask in (a script, CI, an agent). Nothing was installed, not even bundled skills. **Fix:** check the listed source, then re-run with [`-y`](cli.md#-y---yes), or pin it: `-s <owner/repo@skill>`.\n\n### Not confirmed\n\n```text\nInstall <n> external skill(s) from the registry? [y/N] n\n[aiskills] nothing installed: not confirmed\n```\n\n**Cause:** you answered anything but `y` or `yes` (Enter means no). Nothing was installed. **Fix:** none needed. To install, run again and answer `y`, or pin the skill as `owner/repo@skill`.\n\n## Files and folders\n\n### Not an aiskills folder\n\n```text\n[aiskills] <folder> is not an aiskills folder (it has other files but no aiskills.json), so it won't be replaced or deleted.\n  Point AISKILLS_HOME at a new or empty folder instead.\n```\n\n**Cause:** the install folder (usually from `AISKILLS_HOME`) already holds files that `aiskills` didn't write. **Fix:** point `AISKILLS_HOME` at a new or empty folder, or unset it.\n\n### Unknown layout\n\n```text\n[aiskills] unknown layout '<value>' (use flat or nested)\n```\n\n**Cause:** `AISKILLS_LAYOUT`, or the `layout` in `aiskills.json`, isn't `flat` or `nested`. **Fix:** set `AISKILLS_LAYOUT=flat` or `nested`, or run `aiskills sync --flat`.\n\n### AISKILLS_STATS must be 1 or 0\n\n```text\n[aiskills] AISKILLS_STATS must be 1 or 0 (or true/false, yes/no, on/off); got '<value>'\n```\n\n**Cause:** `AISKILLS_STATS` is set to something else. **Fix:** set it to `0` (or `1`), or unset it. See [The skills.sh install count](../concepts/install-count.md).\n\n### No vendored skills folder\n\n```text\n[aiskills] no vendored skills folder at <package>/skills\n```\n\n**Cause:** the package has no `skills/`, which happens when running from a git checkout of the repo. **Fix:** install the published package, or run `npm run vendor` in the checkout.\n\n### Nested layout unavailable\n\n```text\n[aiskills] this package has no .aiskills/layout.json, so --nested can't rebuild the nested layout\n```\n\n**Cause:** the package was built without `layout.json`. **Fix:** use `--flat`, or reinstall the published package.\n\n## Releases and downloads\n\n### Invalid number of releases\n\n```text\n[aiskills] invalid number of releases '<value>' (use a whole number of 1 or more, or all)\n```\n\n**Cause:** the number after `aiskills releases` or `-L`/`--last` isn't a whole number of 1 or more, or `all`. **Fix:** `aiskills rel 10`, `aiskills rel all`.\n\n### Invalid period\n\n```text\n[aiskills] invalid period '<value>'\n  use all, <N><d|w|m|y> (7d, 2w, 1m = 30 days, 1y = 365 days), <YYYY-MM-DD>:<YYYY-MM-DD> or <YYYY-MM-DD>:\n```\n\n**Cause:** the value of `--downloads` isn't one of the [period forms](cli.md#--downloads): for example `7days`, `1.5m`, `0d`, an impossible date, or a range whose start is after its end. Checked before any network call. **Fix:** use one of the listed forms.\n\n### No download counts after a date\n\n```text\n[aiskills] npm has no download counts after <date>; pick a period that starts on or before it\n```\n\n**Cause:** a `--downloads` range starts after npm's latest day of data (usually yesterday). **Fix:** start the range earlier, or use `<N>d`.\n\n### `--chart` and `--table` together\n\n```text\n[aiskills] --chart and --table can't be used together\n```\n\n**Cause:** both were given. **Fix:** pick one; `--chart` is the default.\n\n### Bad `--by` value\n\n```text\n[aiskills] --by takes day, week or month; got '<value>'\n```\n\n**Cause:** `--by` was given something else, or nothing. **Fix:** `--by day`, `--by week` or `--by month`.\n\n### Could not read the releases\n\n```text\n[aiskills] could not read the releases of @sugatoray-ai/aiskills from <registry>: <npm's reason>\n```\n\n**Cause:** `npm view` failed: no network, a registry (or company mirror) that doesn't have the package or refuses the request, or npm missing from `PATH` (then `<registry>` reads `npm`). `<registry>` is what `npm config get registry` reports, so you can see which one was asked. If npm answered with something other than JSON, the reason is `unexpected output from 'npm view'` (`... from npm: unexpected output from 'npm view'`). On `info --full` the same message appears as `latest on npm : unavailable` and `info` still succeeds. **Fix:** check `npm view @sugatoray-ai/aiskills version` works, and your registry setting (`npm config get registry`). Behind a mirror, ask whoever runs it to proxy the public npm registry for `@sugatoray-ai/aiskills`.\n\n### Could not reach api.npmjs.org\n\n```text\n[aiskills] could not reach api.npmjs.org: <reason>\n```\n\n**Cause:** `--downloads` couldn't get an answer from the download counts API: no network, a firewall or proxy that blocks the host, an HTTP error (`HTTP 503`), or an answer it can't use (`could not reach api.npmjs.org: the answer was not JSON`, `could not reach api.npmjs.org: no latest day in its answer`). A proxy in `HTTPS_PROXY` is used on Node versions that support `NODE_USE_ENV_PROXY` (22.21+, 24+). Registry mirrors (Artifactory, Nexus, Verdaccio) don't serve download counts, so a network that only allows a mirror can't use `--downloads`. Behind a TLS-inspecting proxy, `npm` uses its `cafile`/`ca` settings but these requests run in Node, which reads extra certificates from `NODE_EXTRA_CA_CERTS` (a PEM file); without it the reason is a certificate error such as `SELF_SIGNED_CERT_IN_CHAIN` or `UNABLE_TO_GET_ISSUER_CERT_LOCALLY`. **Fix:** run without `--downloads`; allow `api.npmjs.org`; set `NODE_EXTRA_CA_CERTS` to your company's CA bundle; or, if your company proxies api.npmjs.org, point [`AISKILLS_NPM_API_URL`](environment.md#aiskills_npm_api_url) at it.\n\n### Bad `AISKILLS_TODAY`\n\n```text\n[aiskills] AISKILLS_TODAY must be a date (YYYY-MM-DD); got '<value>'\n```\n\n**Cause:** [`AISKILLS_TODAY`](environment.md#aiskills_today) is set to something that isn't a real date. **Fix:** a date like `2026-11-12`, or unset it.\n\n## Upgrade\n\n### Can't upgrade\n\n```text\n[aiskills] can't upgrade: <how aiskills was run, and what to do>\n```\n\n**Cause:** this aiskills isn't a global install, so there's nothing for `upgrade` to replace. It was run through npx (`npx @sugatoray-ai/aiskills@latest install` gets the latest), is a project's dependency (`npm install -D @sugatoray-ai/aiskills@latest`; your lockfile pins it), or is a source checkout (`git pull`, or `npm install -g @sugatoray-ai/aiskills`). The message names which. **Fix:** the command it gives. `aiskills upgrade --check` still works.\n\n### No such version or tag\n\n```text\n[aiskills] no version or tag '<value>' of @sugatoray-ai/aiskills on the registry (see: aiskills releases all)\n```\n\n**Cause:** the `<version>` or `<tag>` given to `upgrade` isn't on the registry npm uses. If the registry reports no `latest` tag at all, the message is `the registry reports no latest version of @sugatoray-ai/aiskills`. **Fix:** pick one from `aiskills releases all`.\n\n### Downgrade not confirmed\n\n```text\n[aiskills] not downgrading <installed> → <target> without confirmation: re-run with -y\n```\n\n**Cause:** the target is older than the installed version (`--check` says `installed <version> is newer than <target>`), and there was no terminal to ask in (or the answer to `[y/N]` wasn't yes: `nothing changed: not confirmed`). **Fix:** add `-y` if you mean it.\n\n### Bad `upgrade` options\n\n```text\n[aiskills] --json only works with --check\n[aiskills] give one version or tag (got '<a>' and '<b>')\n```\n\n**Cause:** `--json` without `--check`, or two targets. **Fix:** `aiskills upgrade --check --json`; one target.\n\n### The package manager failed\n\n```text\nnpm has no permission to write its global folder. Don't use sudo; give npm a folder you own:\n  npm config set prefix ~/.npm-global   (then add ~/.npm-global/bin to PATH and install aiskills again)\n```\n\n**Cause:** the global install failed; `upgrade` exits with its exit code and nothing else changes. A permission error (`EACCES`) gets the hint above; npm's release-age rule gets [its usual explanation](#npms-release-age-rule-blocked-the-skills-cli); if the package manager can't be started at all: `could not run <npm|pnpm|bun|yarn>: <reason>`. **Fix:** as shown; then run `aiskills upgrade` again.\n\n### Refresh warnings\n\n```text\n[aiskills] could not read 'npx skills list'; the skills won't be refreshed\n[aiskills] couldn't tell which agent '<name>' is; re-add its skills with: aiskills install -s <skills> -a <agent id>\n[aiskills] <npm> installed <version>, not <target>\n```\n\n**Cause:** after the upgrade, aiskills couldn't list what's installed (no network for `npx`), couldn't map an agent's display name to an id, or the package manager installed a different version than asked (a registry or mirror lagging behind). The upgrade itself succeeded. **Fix:** run the `aiskills install` command for the skills and agents shown (to see the agent ids, give `-a` a pattern that matches none: `aiskills install -a 'x*' -n` stops with `no agent matches` and lists every valid id).\n\n## Running `npx skills`\n\n### Bad `AISKILLS_SKILLS_LIB_VERSION`\n\n```text\n[aiskills] AISKILLS_SKILLS_LIB_VERSION must be a version (e.g. 1.7.6), \"latest\", \"next\", an npm range (e.g. ~1.7.4) or an interval (e.g. [1.7.4, 1.8.0)); got '<value>'\n```\n\n**Cause:** tags other than `latest`/`next`, URLs, paths, shell syntax, tabs, line breaks or Unicode spaces between a range's parts, and malformed intervals (an open end `…` needs `(` or `)`) are refused. **Fix:** use one of the forms in [Choose the `skills` CLI version](../guides/choose-the-skills-cli-version.md#variations), or unset it for the pinned one.\n\n### `AISKILLS_SKILLS_VERSION` is deprecated\n\n```text\n[aiskills] AISKILLS_SKILLS_VERSION is deprecated and will be removed in 1.0.0: use AISKILLS_SKILLS_LIB_VERSION (the version of the skills CLI library, not of the bundled skills)\n```\n\n**Cause:** a warning, not an error: the old name of the variable is set (it still works until 1.0.0; `AISKILLS_SKILLS_LIB_VERSION` wins if both are). From 1.0.0 it's ignored, so the pinned version would run instead. **Fix:** rename it to `AISKILLS_SKILLS_LIB_VERSION` wherever it's set (shell profile, `.envrc`, CI).\n\n### `skills` CLI version overridden\n\n```text\n[aiskills] using skills@<spec> from AISKILLS_SKILLS_LIB_VERSION, not the tested 1.7.6\n```\n\n**Cause:** a notice, not an error: `AISKILLS_SKILLS_LIB_VERSION` is set to something other than the pinned version, so `npx` runs a `skills` CLI nobody tested with `aiskills`. **Fix:** if you didn't set it, look for it in your shell profile, a project's `.envrc`/`.env`, or CI variables, and unset it.\n\n### Empty `AISKILLS_SKILLS_LIB_VERSION` interval\n\n```text\n[aiskills] AISKILLS_SKILLS_LIB_VERSION '<value>' is an empty interval: no version fits it\n```\n\n**Cause:** the lower bound is above the upper one, or they're equal and not both inclusive (`[1.7.6, 1.7.6)`). **Fix:** swap or widen the bounds; `[1.7.6, 1.7.6]` means exactly `1.7.6`.\n\n### npm's release-age rule blocked the `skills` CLI\n\n```text\nnpm error notarget No matching version found for skills@1.7.6 with a date before 11/2/2026, 9:53:24 AM.\n[aiskills] npm's release-age rule (min-release-age or before) blocked skills@1.7.6: npm only installs versions published before 11/2/2026, 9:53:24 AM, and this one is newer.\n[aiskills]   - wait until it is old enough ('npm view skills time' shows when each version came out), or\n[aiskills]   - relax the rule for one run: npm_config_min_release_age=0 aiskills <command>, or\n[aiskills]   - allow an older, untested skills CLI: AISKILLS_SKILLS_LIB_VERSION='(..., 1.7.6]' (npm picks the newest it may)\n```\n\n**Cause:** your `.npmrc` (or environment) sets `min-release-age` or `before`, and the `skills` CLI version `aiskills` runs was published more recently. npm's `min-release-age-exclude` doesn't apply to `npx`. With a range in `AISKILLS_SKILLS_LIB_VERSION`, the last line instead suggests a wider range. **Fix:** one of the three lines; see [When npm's release-age rule blocks the pinned version](../guides/choose-the-skills-cli-version.md#when-npms-release-age-rule-blocks-the-pinned-version).\n\n### Shell characters on Windows\n\n```text\n[aiskills] refusing to pass shell characters to cmd.exe: <arguments>\n```\n\n**Cause:** on Windows, an argument contains one of `& | < > ^ % ! \" ( )`, which `cmd.exe` would interpret. The `skills@<range>` argument from `AISKILLS_SKILLS_LIB_VERSION` is the one exception: it's already limited to version characters and is passed in double quotes. **Fix:** remove those characters; skill names and specs never need them.\n\n## Packaging errors (maintainers)\n\nThese come from `npm pack` / `npm run vendor`, when the package is built from the repo.\n\n### Repo not found\n\n```text\nno ancestor of <folder> contains skills/ and .claude-plugin/marketplace.json\n```\n\n**Fix:** build from inside the repo, where `skills/` and `.claude-plugin/marketplace.json` are above the package folder.\n\n### `skills/` not found\n\n```text\n<repo>/skills not found\n```\n\n**Fix:** the repo's `skills/` folder is missing; restore it.\n\n### SKILL.md ignored\n\n```text\n.skillsignore ignores <group>/<skill>/SKILL.md; to drop a skill, ignore the folder (<group>/<skill>/) instead\n```\n\n**Fix:** ignore the skill's folder, not only its `SKILL.md`. See [`.skillsignore`](skillsignore.md).\n\n### Skill directly in `skills/`\n\n```text\n<repo>/skills/SKILL.md: a skill can't sit directly in skills/\n```\n\n**Fix:** move the skill into its own folder.\n\n### Skill inside a skill\n\n```text\nskills inside other skills aren't supported: <folders>\n```\n\n**Fix:** move the inner skill out to its own folder.\n\n### Unsafe skill name\n\n```text\nskills/<folder>: skill name '<name>' can't be used as a folder name\n```\n\n**Fix:** use only letters, digits, `.`, `_` and `-` in the `name:`.\n\n### Duplicate skill name\n\n```text\ntwo skills are both named '<name>': skills/<folder> and skills/<folder>\n```\n\n**Fix:** give one of them another `name:`.\n\n## Docs build errors (maintainers)\n\nThese come from `npm run docs:html`, which builds `docs/docsite/index.html`.\n\n### Page not in the landing page\n\n```text\npages not linked from a section of README.md: <pages>\n```\n\n**Fix:** add each page to a `### Section` list in `docs/docsite/README.md` (`- [Title](path.md): summary`). The tabs are built from those lists.\n\n### Usage\n\n```text\nusage: build-docs-html.mjs <docs-dir> --out <file.html> [--ref <branch>]\n```\n\n**Fix:** pass the docs folder and `--out`, or use `npm run docs:html`.\n\n## Banner build errors (maintainers)\n\nThese come from `npm run banner`, `banner:check` and `banner:png` (`src/scripts/docs/create-banner.mjs`), and from `npm run docs:html`, which copies the banner onto the docs landing page.\n\n### Config value not quoted\n\n```text\nconfig line <n>: values must be double-quoted strings: <text>\n```\n\n**Fix:** in `docs/banner/config.yaml`, write every value as `key: \"value\"
