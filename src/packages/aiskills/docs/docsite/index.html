`, and list items as `  - \"item\"`.\n\n### Config line not understood\n\n```text\nconfig line <n>: expected 'key: \"value\"' or a '  - \"item\"' line\nconfig line <n>: a list item without a key above it\n```\n\n**Fix:** use only `key: \"value\"`, `key:` followed by `  - \"item\"` lines, blank lines and `#` comments.\n\n### Unknown `--set` key\n\n```text\n--set: unknown key: <key>\n```\n\n**Fix:** use a key that exists in `config.yaml`.\n\n### Install style or count\n\n```text\ninstall_style must be \"box\" or \"chips\", not \"<value>\"\ninstall_style \"<style>\" has room for 1 to <max> install commands, not <n>\n```\n\n**Fix:** `box` takes up to 3 commands and `chips` up to 2.\n\n### Unknown theme\n\n```text\nunknown theme: <name> (use one of teal, paper, phosphor, …, lightsout)\n```\n\n**Fix:** set `theme` in `docs/banner/config.yaml` (or `--set theme=…`) to one of the themes in `src/scripts/docs/themes.mjs`. The default is `lightsout`.\n\n### Demo group or skill\n\n```text\ndemo_group \"<name>\" isn't a bundled group (<aliases>)\nroute_skill \"<name>\" is bundled, so 'aix i -s <name>' wouldn't look it up\n```\n\n**Fix:** `demo_group` must be a bundled group; `route_skill` must be a skill the package does *not* bundle, or the terminal demo would show something `aiskills` doesn't do.\n\n### Template placeholder without a value\n\n```text\ntemplate placeholder {{ <name> }} has no value\n```\n\n**Fix:** a placeholder was added to `src/scripts/docs/templates/banner-template.html` without a value in `render()`; add one.\n\n### PNG needs Playwright\n\n```text\n--png needs Playwright (npm install -g playwright, then npx playwright install chromium)\n--scale must be 1, 2 or 4\n```\n\n**Fix:** install Playwright and Chromium, and use scale 1, 2 or 4.\n\n### Page out of date\n\n```text\n<path>/aiskills-banner.html is out of date: run npm run banner\n```\n\n**Fix:** run `npm run banner` (and `npm run banner:png` for the README image), then `npm run docs:html`.\n\n### Banner page missing (docs build)\n\n```text\nbanner page not found: <path> (run npm run banner, or pass --no-banner)\n<path>: no banner:html:start ... banner:html:end markers\n```\n\n**Fix:** build the banner page first, or build the docs with `--no-banner`. Keep the `banner:html` and `banner:css` marker comments in the template.\n\nSee also: [Use aiskills from an AI agent or a script](../guides/use-from-an-agent.md) · [FAQ and troubleshooting](../faq.md)\n"},{"id":"faq","path":"faq.md","title":"FAQ and troubleshooting","tab":"faq","md":"# FAQ and troubleshooting\n\nAnswers to the questions people ask most, and fixes for the problems they hit.\n\n## Questions\n\n### Which agents are supported?\n\nEvery agent the `skills` CLI supports: Claude Code, Codex, Cursor, Qoder and many more. `aiskills` reads the list from `npx skills`, so a newer `skills` version brings new agents with no change here. Pass agent ids to `-a` (`claude-code`, `codex`, `cursor`, …).\n\n### Does `aiskills install` put the skills in every agent's folder?\n\nNo, only in the agents `npx skills` detects: those whose folder already exists (such as `~/.claude` or `~/.codex`), plus the agents that share `~/.config/agents/skills`. Only when it detects none does it install for every agent it supports, creating a folder for each. To choose yourself, name agents with `-a`, pick them from a list with [`-i`](reference/cli.md#-i---interactive), or reuse your last pick with [`-l`](reference/cli.md#-l---last-agents). See [2. Pick skills and agents](tutorial/02-pick-skills-and-agents.md#pick-from-a-list--i).\n\n### Where are the skills on my machine?\n\nThe saved copy is in `~/.config/sugatoray/aiskills/skills/` (`aiskills path` prints the folder). `npx skills` installs them into each agent's own folder, such as `~/.claude/skills/`, or the project's folders with `-p`.\n\n### What's the difference between `aiskills`, `ais` and `aix`?\n\n`ais` is `aiskills`. `aix` is `aiskills --route`, which also manages skills that aren't bundled. See [Bundled and external skills](concepts/bundled-and-external.md).\n\n### How do I update the skills?\n\nRun `aiskills upgrade`. It installs the latest aiskills with the package manager you installed it with, then updates the skills your agents have, for the same agents. Skills that are new in that version are listed with the commands to add them. `aiskills upgrade --check` only says whether there is a newer version. (Before 0.9.0: `npm install -g @sugatoray-ai/aiskills@latest`, then `aiskills install` again.) See [`upgrade`](reference/cli.md#upgrade).\n\n### How do I see my setup, or check for a newer version?\n\n`aiskills info` shows the aiskills version, the install folder, what was saved there and by which version, and every setting with where its value comes from (a flag's default, an `AISKILLS_*` variable, or remembered). It is offline; `aiskills info --full` also asks npm for the latest version. `aiskills rel` lists the latest releases on npm and marks the one you have; `aiskills rel --downloads` adds download counts. See [`info`](reference/cli.md#info) and [`releases`](reference/cli.md#releases).\n\n### Does aiskills work behind a firewall or with an npm mirror?\n\nYes, except for download counts. Everything goes through npm and your npm config (`registry=`, proxy, `cafile`), so a company mirror (Artifactory, Nexus, Verdaccio, …) works:\n\n| Command | Needs | With only an npm mirror |\n| --- | --- | --- |\n| `install`, `uninstall`, `installed`, `list`, `skills` | the `skills` package, through `npx` | works |\n| `info` | nothing (local files) | works |\n| `info --full` | `npm view`, and `skills` through `npx` | works |\n| `releases` / `rel` | `npm view` | works; a mirror that strips publish times shows `–` as the date and says so |\n| `rel --downloads` | api.npmjs.org | fails with `could not reach api.npmjs.org`; mirrors don't serve download counts ([fixes](reference/errors.md#could-not-reach-apinpmjsorg)) |\n| the skills.sh install count | github.com | skipped silently; the install is unaffected |\n| `--route` / `aix` lookups | skills.sh | fail with an error; bundled skills don't need them |\n\nThe `changelog:` line of `aiskills rel` is only printed, never fetched; its first path is the copy inside the installed package, readable offline. A TLS-inspecting proxy needs `NODE_EXTRA_CA_CERTS` for `--downloads` (npm itself uses `cafile`).\n\n### Why are download counts per version only for the last 7 days?\n\nBecause npm only keeps per-version counts for the last 7 days; older ones aren't stored anywhere. `aiskills rel --downloads <period>` shows them in a column, and the package's total (all versions together) for any period, from all time (`all`, the default) to a day (`1d`). See [`--downloads`](reference/cli.md#--downloads).\n\n### Does it install Claude Code plugins?\n\nNo. It reads the repo's `.claude-plugin/marketplace.json` only to group the skills. Everything is installed as skills through `npx skills`.\n\n### Can I edit the saved skills?\n\nDon't: every sync replaces `~/.config/sugatoray/aiskills/skills/`. Copy a skill elsewhere to change it, or contribute the change to [the repo](https://github.com/sugatoray/aiskills).\n\n### Does aiskills send any data?\n\n`aiskills` sends nothing itself. After `aiskills install`, it runs `npx skills add sugatoray/aiskills` once more in a temp folder, in the background, so the install is counted on skills.sh (off with `--no-stats` or `AISKILLS_STATS=0`); see [The skills.sh install count](concepts/install-count.md). The `skills` CLI sends anonymous usage data to `skills.sh` unless `DISABLE_TELEMETRY` or `DO_NOT_TRACK` is set, and either one also turns the count off. See [Security model](concepts/security.md#telemetry).\n\n### `aiskills` fails with \"No matching version found for skills@… with a date before …\"\n\nYour npm has a release-age rule (`min-release-age` or `before` in `.npmrc`), and the `skills` CLI version `aiskills` runs is newer than it allows. `aiskills` prints the options after npm's error: wait, run once with `npm_config_min_release_age=0 aiskills <command>`, or set `AISKILLS_SKILLS_LIB_VERSION='(..., 1.7.6]'` so npm can fall back to an older version. See [When npm's release-age rule blocks the pinned version](guides/choose-the-skills-cli-version.md#when-npms-release-age-rule-blocks-the-pinned-version).\n\n### Why don't my installs show up on skills.sh?\n\nThe count needs github.com and api.github.com: without them it's skipped silently. It's also off with `--no-stats` (check `\"stats\"` in `~/.config/sugatoray/aiskills/aiskills.json`), `AISKILLS_STATS=0`, `DO_NOT_TRACK`, `DISABLE_TELEMETRY` or `CI`. `AISKILLS_STATS_FOREGROUND=1 aiskills install` shows what happens.\n\n### How do I change how these docs look?\n\nIn the single-page HTML version of these docs (`index.html`), click the gear at the top right and pick one of 11 themes; the moon/sun button next to it switches light and dark. Your choice is remembered in your browser. The default is Lights Out.\n\n### Is there a JavaScript API?\n\nNo. Only the commands are public; the files under `src/scripts/core/` can change in any release.\n\n### What is a skill group?\n\nGroups come from the plugin entries in the repo's `marketplace.json`; every bundled skill is in one. See [Skill groups](concepts/skill-groups.md).\n\n### Why isn't `newsletter-ai` in the package?\n\nThe repo's `skills/newsletters/.skillsignore` leaves it out on purpose, so `aiskills` doesn't install it. It is still in the repo, so you can install it straight from there:\n\n```bash\nnpx skills add sugatoray/aiskills --skill newsletter-ai --global\n```\n\nor through `aix`, naming the source (pinned, so it isn't asked about): `aix install -s sugatoray/aiskills@newsletter-ai`.\n\n### Nothing was installed by `npm install -g`\n\n- **Symptom:** `aiskills installed` shows nothing after the npm install.\n- **Cause:** that's expected. `npm install` only adds the `aiskills` command; the package has no install step, so it never changes your agents by itself.\n- **Fix:** run `aiskills install`. It prints each step, and any error.\n\n### `skills: not found` when run through `npx @sugatoray-ai/aiskills`\n\n- **Cause:** an npm setting reached the nested `npx`. `aiskills` removes npm's own variables before running `npx`, so this means a new one got through.\n- **Fix:** install the package with `npm install -g` and run `aiskills install`, and please [report it](https://github.com/sugatoray/aiskills/issues).\n\n### A pattern does nothing, or matches files\n\n- **Cause:** the shell expanded an unquoted pattern, such as `-s scrolls-*`, into file names.\n- **Fix:** quote it: `-s 'scrolls-*'`.\n\n### A skill's `.gitignore` is missing in the package\n\n- **Cause:** npm drops files named `.gitignore`. The package stores them as `_gitignore`.\n- **Fix:** none needed: every sync renames them back in `~/.config/sugatoray/aiskills/skills/`.\n\n### `--route` can't find a skill I know exists\n\n- **Cause:** the name isn't an exact match, several skills share it, or there's no network access to `skills.sh`.\n- **Fix:** run `aiskills find <name>` and pass the exact `owner/repo@skill`. See [Errors](reference/errors.md#external-skills---route).\n\n### `... is not an aiskills folder ...`\n\n- **Cause:** `AISKILLS_HOME` points at a folder with other files in it, which `aiskills` refuses to replace or delete.\n- **Fix:** point it at a new or empty folder. See [Errors](reference/errors.md#not-an-aiskills-folder).\n\n### `aiskills` is gone, but the skills are still installed\n\n- **Cause:** npm ran no step on `npm uninstall -g`.\n- **Fix:** `npx @sugatoray-ai/aiskills uninstall --purge`. See [Remove everything](guides/remove-everything.md).\n\nSee also: [Errors and exit codes](reference/errors.md) · [Docs home](README.md)\n"},{"id":"license","path":"license.md","title":"License","tab":"license","md":"# License\n\nThe `@sugatoray-ai/aiskills` npm package is licensed under Apache-2.0. Each skill it bundles keeps its own license, declared in that skill's `SKILL.md`; today every bundled skill is MIT, not Apache-2.0.\n\n## The package\n\n| Part | License | Declared in |\n| --- | --- | --- |\n| The npm package: the `aiskills`, `ais` and `aix` commands and their code | [Apache-2.0](../../LICENSE) | `package.json` (`\"license\"`), `LICENSE` |\n\n## Bundled skills\n\n15 skills, sorted by name.\n\n| Skill | Group | License | Declared in |\n| --- | --- | --- | --- |\n| [`artwallbg`](skills/artwallbg.md) | image-styles | MIT | [`SKILL.md`](https://github.com/sugatoray/aiskills/blob/master/skills/image-styles/artwallbg/SKILL.md) |\n| [`commentdrop`](skills/commentdrop.md) | image-styles | MIT | [`SKILL.md`](https://github.com/sugatoray/aiskills/blob/master/skills/image-styles/commentdrop/SKILL.md) |\n| [`create-issues-update-pr`](skills/create-issues-update-pr.md) | repo-related | MIT | [`SKILL.md`](https://github.com/sugatoray/aiskills/blob/master/skills/development/repo-related/create-issues-update-pr/SKILL.md) |\n| [`create-lib-docs`](skills/create-lib-docs.md) | docs | MIT | [`SKILL.md`](https://github.com/sugatoray/aiskills/blob/master/skills/docs/create-lib-docs/SKILL.md) |\n| [`dynamic-promo-video`](skills/dynamic-promo-video.md) | video-related | MIT | [`SKILL.md`](https://github.com/sugatoray/aiskills/blob/master/skills/video-related/dynamic-promo-video/SKILL.md) |\n| [`network-flow`](skills/network-flow.md) | diagrams | MIT | [`SKILL.md`](https://github.com/sugatoray/aiskills/blob/master/skills/diagrams/network-flow/SKILL.md) |\n| [`prodigy`](skills/prodigy.md) | personas | MIT | [`SKILL.md`](https://github.com/sugatoray/aiskills/blob/master/skills/personas/prodigy/SKILL.md) |\n| [`scrolls-help`](skills/scrolls-help.md) | scrolls | MIT | [`SKILL.md`](https://github.com/sugatoray/aiskills/blob/master/skills/scrolls/scrolls-help/SKILL.md) |\n| [`scrolls-hide`](skills/scrolls-hide.md) | scrolls | MIT | [`SKILL.md`](https://github.com/sugatoray/aiskills/blob/master (function () {
  const $ = (s, el = document) => el.querySelector(s);
  const root = document.documentElement;
  const byId = new Map(DATA.pages.map(p => [p.id, p]));

  const mq = window.matchMedia("(prefers-color-scheme: dark)");

    return t === "dark" || t === "light" ? t : (mq.matches ? "dark" : "light");

  function syncThemeUI() {
    const eff = effectiveTheme();

    $("#theme-btn").setAttribute("aria-label", eff === "dark" ? "Switch to light theme" : "Switch to dark theme");
  }
  const saved = store.get("aiskills-docs-theme");
  if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
  syncThemeUI();
  mq.addEventListener("change", syncThemeUI);
  new MutationObserver(syncThemeUI).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  $("#theme-btn").addEventListener("click", () => {
    const next = effectiveTheme() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    store.set("aiskills-docs-theme", next);
  });

  /* ---------- theme menu (gear) ---------- */
  (function () {

    const open = () => {
      sync(); menu.hidden = false; btn.setAttribute("aria-expanded", "true");
      (items().find((i) => i.getAttribute("aria-checked") === "true") || items()[0]).focus();
    };
    const close = (refocus) => { if (menu.hidden) return; menu.hidden = true; btn.setAttribute("aria-expanded", "false"); if (refocus) btn.focus(); };
    const choose = (id) => {
      root.setAttribute("data-skin", id);
      store.set("aiskills-docs-skin", id);
      if (window.__aiskillsLoadSkinFonts) window.__aiskillsLoadSkinFonts(id);
      sync(); close(true);
    };
    btn.addEventListener("click", (e) => { e.stopPropagation(); menu.hidden ? open() : close(true); });

      else if (e.key === "ArrowUp") go(at - 1);
      else if (e.key === "Home") go(0);
      else if (e.key === "End") go(list.length - 1);
      else if (e.key === "Escape") { e.preventDefault(); close(true); }
      else if (e.key === "Tab") close(false);

    sync();
  })();

    // Heading anchors (GitHub slugs, with -1, -2 for repeats)
    const seen = new Map();
    doc.querySelectorAll("h1, h2, h3, h4").forEach(h => {
      const base = slug(h.textContent);
      const n = seen.get(base) || 0;
      seen.set(base, n + 1);
      h.id = n ? `${base}-${n}` : base;
      if (h.tagName !== "H1") {
        const a = document.createElement("a");
        a.className = "anchor"; a.href = "#" + page.id; a.dataset.anchor = h.id; a.textContent = "#";
        a.setAttribute("aria-label", "Link to this section");
        h.prepend(a);
      }
    });

    // Images: embedded SVGs
    doc.querySelectorAll("img").forEach(img => {
      const r = resolve(page.path, img.getAttribute("src"));
      if (r && DATA.images[r.path]) img.src = DATA.images[r.path];
      img.loading = "lazy";
      const wrap = document.createElement("div");
      wrap.className = "figure-wrap";
      const host = img.parentElement.tagName === "P" && img.parentElement.childNodes.length === 1 ? img.parentElement : img;
      host.replaceWith(wrap); wrap.appendChild(img);
    });

    // Links: other pages become in-app routes; files outside the docs go to GitHub
    doc.querySelectorAll("a[href]").forEach(a => {
      if (a.classList.contains("anchor")) return;
      const href = a.getAttribute("href");
      if (/^[a-z]+:/i.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
      if (href.startsWith("#")) { a.href = "#" + page.id; a.dataset.anchor = decodeURIComponent(href.slice(1)); return; }
      const r = resolve(page.path, href);
      const target = r && byPath.get(r.path);
      if (target) { a.href = "#" + target.id; if (r.hash) a.dataset.anchor = r.hash; return; }
      const base = r.path.endsWith("/") ? DATA.treeBase : DATA.repoBase;
      a.href = new URL(href, base + page.path).href;
      a.target = "_blank"; a.rel = "noopener";
    });

    // Tables scroll on their own
    doc.querySelectorAll("table").forEach(t => {
      const w = document.createElement("div"); w.className = "table-wrap";
      t.replaceWith(w); w.appendChild(t);
    });

    // Code: highlight, label, copy; blocks that follow another block are output
    doc.querySelectorAll("pre > code").forEach(code => {
      const pre = code.parentElement;
      const lang = ((code.className.match(/language-([\w-]+)/) || [])[1] || "").toLowerCase();
      const box = document.createElement("div");
      box.className = "codeblock";
      const prev = pre.previousElementSibling;
      const isOutput = lang === "text" && prev && prev.classList.contains("codeblock");
      if (isOutput) box.classList.add("output");
      pre.replaceWith(box); box.appendChild(pre);
      if (window.hljs && lang && lang !== "text") {
        const l = lang === "toml" ? "ini" : lang === "sh" || lang === "shell" ? "bash" : lang;
        if (hljs.getLanguage(l)) { try { hljs.highlightElement(code); } catch (e) {} }
      }
      if (!isOutput && lang) {
        const tag = document.createElement("span"); tag.className = "lang"; tag.textContent = lang; box.appendChild(tag);
      }
      const btn = document.createElement("button");
      btn.className = "copy"; btn.type = "button"; btn.textContent = "Copy";
      btn.addEventListener("click", () => {
        const text = code.textContent;
        const done = ok => { btn.textContent = ok ? "Copied" : "Select and copy"; setTimeout(() => btn.textContent = "Copy", 1600); };
        const fallback = () => {
          const range = document.createRange(); range.selectNodeContents(code);
          const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); done(false);
        };
        try { navigator.clipboard.writeText(text).then(() => done(true), fallback); } catch (e) { fallback(); }
      });
      box.appendChild(btn);
    });
  }

  /* ---------- chrome: tabs, side nav, toc, pager ---------- */
  function drawTabs() {
    const tabs = $("#tabs");
    tabs.innerHTML = "";
    DATA.tabs.forEach(t => {
      const b = document.createElement("button");
      b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(current && tabOf(current.id).id === t.id));
      b.innerHTML = t.label + (t.pages.length > 1 ? `<span class="count">${t.pages.length}</span>` : "");
      b.addEventListener("click", () => go(byPath.get(t.pages[0]).id));
      tabs.appendChild(b);
    });
    const sel = $('.tab[aria-selected="true"]', tabs);
    if (sel) sel.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function navLabel(p) {
    const m = p.path.match(/^tutorial\/0?(\d+)-/);
    const title = m ? p.title.replace(/^\d+\.\s*/, "") : p.title;
    return (m ? `<span class="step">${m[1].padStart(2, "0")}</span>` : "") + escapeHtml(title);
  }
  function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function drawSide() {
    const side = $("#side");
    if ($("#q").value.trim()) return drawResults($("#q").value.trim());
    const tab = tabOf(current.id);
    let html = `<div class="side-group"><p class="side-label">${escapeHtml(tab.label)}</p><ul class="nav-list">`;
    tab.pages.forEach(path => {
      const p = byPath.get(path);
      html += `<li><a href="#${p.id}"${p.id === current.id ? ' aria-current="page"' : ""}>${navLabel(p)}</a></li>`;
    });
    html += `</ul></div><div class="side-group"><p class="side-label">Other sections</p><ul class="nav-list other">`;
    DATA.tabs.filter(t => t.id !== tab.id).forEach(t => {
      html += `<li><a href="#${byPath.get(t.pages[0]).id}">${escapeHtml(t.label)}</a></li>`;
    });
    side.innerHTML = html + "</ul></div>";
  }

  function plain(md) {
    return md.replace(/```[\s\S]*?```/g, " ").replace(/!?\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/[#>*`|_-]+/g, " ").replace(/\s+/g, " ");
  }
  const searchIndex = DATA.pages.map(p => ({ p, text: plain(p.md), lower: plain(p.md).toLowerCase() }));
  function drawResults(q) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = searchIndex
      .map(e => {
        const title = e.p.title.toLowerCase();
        if (!terms.every(t => e.lower.includes(t) || title.includes(t))) return null;
        const score = terms.reduce((s, t) => s + (title.includes(t) ? 10 : 0) + e.lower.split(t).length - 1, 0);
        return { e, score };
      })
      .filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 20);
    const mark = s => terms.reduce((acc, t) => acc.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`), escapeHtml(s));
    let html = `<div class="side-group"><p class="side-label">${hits.length} result${hits.length === 1 ? "" : "s"}</p><div class="results">`;
    if (!hits.length) html += `<p class="empty">No page mentions “${escapeHtml(q)}”.</p>`;
    hits.forEach(({ e }) => {
      const i = e.lower.indexOf(terms[0]);
      const snip = (i > 40 ? "…" : "") + e.text.slice(Math.max(0, i - 40), i + 90).trim() + "…";
      html += `<a class="hit" href="#${e.p.id}"><strong>${mark(e.p.title)}</strong><span>${mark(snip)}</span></a>`;
    });
    $("#side").innerHTML = html + "</div></div>";
  }

  function drawToc() {
    const heads = [...$("#doc").querySelectorAll("h2, h3")];
    const items = heads.map(h => {
      const text = escapeHtml(h.textContent.replace(/^#/, ""));
      return `<li><a href="#${current.id}" data-anchor="${h.id}" class="lvl${h.tagName[1]}">${text}</a></li>`;
    }).join("");
    const toc = $("#toc"), mtoc = $("#mobile-toc");
    if (!heads.length) { toc.innerHTML = ""; mtoc.hidden = true; }
    else {
      toc.innerHTML = `<p class="toc-label">On this page</p><ol>${items}</ol>`;
      mtoc.hidden = false; mtoc.open = false; $("ol", mtoc).innerHTML = items;
    }
    const src = DATA.repoBase + current.path;
    toc.insertAdjacentHTML("beforeend", `<div class="toc-actions"><a href="#${current.id}" data-anchor="top">Back to top ↑</a><a href="${src}" target="_blank" rel="noopener">View source on GitHub ↗</a></div>`);

    if (observer) observer.disconnect();
    const links = new Map([...toc.querySelectorAll("a[data-anchor]")].map(a => [a.dataset.anchor, a]));
    const visible = new Set();
    observer = new IntersectionObserver(entries => {
      entries.forEach(en => en.isIntersecting ? visible.add(en.target.id) : visible.delete(en.target.id));
      let active = null;
      for (const h of heads) { if (visible.has(h.id)) { active = h.id; break; } }
      if (!active) {
        const y = 140;
        for (const h of heads) { if (h.getBoundingClientRect().top < y) active = h.id; }
      }
      links.forEach((a, id) => a.classList.toggle("active", id === active));
    }, { rootMargin: "-100px 0px -60% 0px" });
    heads.forEach(h => observer.observe(h));
  }

  function drawPager() {
    const i = order.indexOf(current);
    const prev = order[i - 1], next = order[i + 1];
    $("#pager").innerHTML =
      (prev ? `<a class="prev" href="#${prev.id}"><span class="dir">← Previous</span><span class="t">${escapeHtml(prev.title)}</span></a>` : "") +
      (next ? `<a class="next" href="#${next.id}"><span class="dir">Next →</span><span class="t">${escapeHtml(next.title)}</span></a>` : "");
  }

  function drawCrumbs() {
    const tab = tabOf(current.id);
    const first = byPath.get(tab.pages[0]);
    $("#crumbs").innerHTML = current.id === "home" ? "" :
      `<a href="#home">aiskills</a><span>/</span>` + (first === current ? `<span>${escapeHtml(tab.label)}</span>` :
      `<a href="#${first.id}">${escapeHtml(tab.label)}</a><span>/</span><span>${escapeHtml(current.title)}</span>`);
  }

  /* ---------- routing (hash holds the page id only) ---------- */
  let pendingAnchor = null;
  function scrollToAnchor(anchor, smooth) {
    if (!anchor || anchor === "top") { window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" }); return; }
    const el = document.getElementById(anchor);
    if (el) el.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
  }
  function show(id) {
    const page = byId.get(id) || byId.get("home");
    const same = current === page;
    current = page;
    if (!same) {
      render(page); drawTabs(); drawSide(); drawToc(); drawPager(); drawCrumbs();
      document.title = page.id === "home" ? "aiskills documentation" : `${page.title} · aiskills documentation`;
    }
    scrollToAnchor(pendingAnchor, same);
    pendingAnchor = null;
    closeNav();
  }
  function go(id, anchor) {
    pendingAnchor = anchor || null;
    if (location.hash.slice(1) === id) show(id);
    else location.hash = id;
  }
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="#"]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
    const id = a.getAttribute("href").slice(1);
    if (!byId.has(id)) return;
    e.preventDefault();
    if ($("#q").value && a.classList.contains("hit")) { /* keep results open */ }
    go(id, a.dataset.anchor);
  });

  /* ---------- search + mobile nav ---------- */
  const q = $("#q");
  q.addEventListener("input", () => { if (current) { drawSide(); if (q.value.trim()) openNav(); } });
  q.addEventListener("keydown", e => {
    if (e.key === "Escape") { q.value = ""; drawSide(); q.blur(); }
    if (e.key === "Enter") { const hit = $(".hit"); if (hit) hit.click(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)) {
      e.preventDefault(); q.focus();
    }
  });
  const narrow = window.matchMedia("(max-width: 860px)");
  function openNav() { if (!narrow.matches) return; document.body.classList.add("nav-open"); $("#menu-btn").setAttribute("aria-expanded", "true"); }
  function closeNav() { document.body.classList.remove("nav-open"); $("#menu-btn").setAttribute("aria-expanded", "false"); }
  $("#menu-btn").addEventListener("click", () => document.body.classList.contains("nav-open") ? closeNav() : openNav());
  $("#scrim").addEventListener("click", closeNav);

  show(location.hash.slice(1) || "home");
})();
</script>
</body>
</html>
